# Publishes the recorded demo to GitHub Pages: site/index.html (welcome page) and demo/index.html at /demo/.
# The demo runs on recorded data there; the live app with the real AI runs on our server (deploy/docker.sh).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: |
          mkdir -p _site/demo
          cp site/index.html _site/
          cp demo/index.html _site/demo/
          # light mode by default on Pages (the moon button still switches to dark)
          sed -i 's/store.get("theme", "system")/store.get("theme", "light")/' _site/demo/index.html
          grep -q 'store.get("theme", "light")' _site/demo/index.html
          cp images/ITSG-logo.png deploy/qr.svg pitch/ITSG-Spec-Pipeline.pdf _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
