<title>EEL Review Assistant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Demo: AI-assisted system review for income replacement benefits (DTA EEL), built for the ITSG challenge at Futury Build Days 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: sticky top bar · left pipeline rail (the nav IS the pipeline) · working canvas · right provenance drawer.
   Design tokens below are the single source of truth (Claude Design friendly: tokens → components). */
:root {
  /* colour */
  --bg: #f6f4f4;
  --surface: #ffffff;
  --surface-2: #f1eeee;
  --surface-3: #e9e4e4;
  --line: #e0d9d9;
  --line-strong: #c9c0c1;
  --fg: #1c1819;
  --fg-2: #3d3537;
  --muted: #6d6366;
  --accent: #b0142f;
  --accent-ink: #ffffff;
  --accent-soft: #f8e1e5;
  --accent-line: #e8a9b4;
  --ok: #1d7347; --ok-soft: #e0f1e7;
  --warn: #9a5b00; --warn-soft: #fbeed6;
  --bad: #b3261e; --bad-soft: #fde3e0;
  --info: #285a9c; --info-soft: #e2ebf7;
  --hl-cond: #dbe8fb; --hl-cond-line: #6f9ee0;
  --hl-param: #fde9b8; --hl-param-line: #d49a12;
  --hl-field: #ebe0fb; --hl-field-line: #9a72d8;
  --hl-exc: #fbe0e0; --hl-exc-line: #d76b6b;
  --shadow: 0 1px 2px rgba(40, 20, 24, .06), 0 6px 24px rgba(40, 20, 24, .07);
  --scrim: rgba(20, 12, 14, .62);
  /* type */
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  --fs-xs: .75rem; --fs-sm: .8125rem; --fs-md: .9375rem; --fs-lg: 1.125rem; --fs-xl: 1.5rem; --fs-2xl: 2rem;
  /* shape & space */
  --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;
  --rail-w: 236px; --drawer-w: 440px; --bar-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131112; --surface: #1b1819; --surface-2: #231f20; --surface-3: #2c2728; --line: #342e30; --line-strong: #4a4144;
    --fg: #f0ebec; --fg-2: #d6cfd0; --muted: #a59a9d;
    --accent: #f0566c; --accent-ink: #1b0a0d; --accent-soft: #3b1a20; --accent-line: #7c3341;
    --ok: #57c88f; --ok-soft: #15301f; --warn: #e8a73e; --warn-soft: #34270f; --bad: #f2685b; --bad-soft: #3b1916; --info: #80aef0; --info-soft: #172639;
    --hl-cond: #1b2f4d; --hl-cond-line: #5b8ad0; --hl-param: #3d3011; --hl-param-line: #c4901b; --hl-field: #2c2145; --hl-field-line: #9a7ad8; --hl-exc: #3d1d1d; --hl-exc-line: #d77070;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45); --scrim: rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131112; --surface: #1b1819; --surface-2: #231f20; --surface-3: #2c2728; --line: #342e30; --line-strong: #4a4144;
  --fg: #f0ebec; --fg-2: #d6cfd0; --muted: #a59a9d;
  --accent: #f0566c; --accent-ink: #1b0a0d; --accent-soft: #3b1a20; --accent-line: #7c3341;
  --ok: #57c88f; --ok-soft: #15301f; --warn: #e8a73e; --warn-soft: #34270f; --bad: #f2685b; --bad-soft: #3b1916; --info: #80aef0; --info-soft: #172639;
  --hl-cond: #1b2f4d; --hl-cond-line: #5b8ad0; --hl-param: #3d3011; --hl-param-line: #c4901b; --hl-field: #2c2145; --hl-field-line: #9a7ad8; --hl-exc: #3d1d1d; --hl-exc-line: #d77070;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45); --scrim: rgba(0,0,0,.7);
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 var(--fs-md)/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -.005em; }
h1 { font-size: var(--fs-2xl); } h2 { font-size: var(--fs-xl); } h3 { font-size: var(--fs-lg); } h4 { font-size: var(--fs-md); }
p { margin: 0; max-width: 68ch; }
table { font-size: inherit; border-collapse: collapse; }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-mono); font-size: .92em; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font: 600 var(--fs-xs)/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.de-quote { font-family: var(--font-body); font-style: italic; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- shell ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; height: var(--bar-h); display: flex; align-items: center; gap: var(--s-3);
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 13px/1 var(--font-mono); flex: none; }
.brand-name { font: 600 var(--fs-lg)/1 var(--font-display); white-space: nowrap; }
.brand-sub { font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-spacer { flex: 1; }
.bar-tools { display: flex; align-items: center; gap: var(--s-2); flex-wrap: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: var(--fs-sm); color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); font-weight: 600; }
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: calc(100% - var(--bar-h)); }
.rail { border-right: 1px solid var(--line); background: var(--surface); padding: var(--s-4) var(--s-3); position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--bar-h)); overflow: auto; }
.rail-group { display: grid; gap: 2px; margin-bottom: var(--s-4); }
.rail-label { padding: 0 var(--s-2) var(--s-1); }
.nav-btn { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: var(--r-md); cursor: pointer; color: var(--fg-2); font-size: var(--fs-sm); }
.nav-btn:hover { background: var(--surface-2); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.nav-step { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font: 600 11px/1 var(--font-mono); color: var(--muted); background: var(--surface); }
.nav-btn[aria-current="page"] .nav-step { border-color: var(--accent); color: var(--accent); }
.nav-btn.done .nav-step { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.nav-badge { font: 600 11px/1 var(--font-mono); padding: 3px 6px; border-radius: 999px; background: var(--surface-3); color: var(--fg-2); }
.nav-badge.hot { background: var(--accent); color: var(--accent-ink); }
.main { min-width: 0; padding-block: var(--s-5) var(--s-6); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transform-origin: 50% 0; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
.main-inner { max-width: 1240px; margin: 0 auto; display: grid; gap: var(--s-5); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s-4); flex-wrap: wrap; }
.page-head-text { display: grid; gap: 6px; min-width: 0; }
.page-head p { color: var(--muted); }
.actions { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; }

/* ---------- components ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); padding: 7px 12px; border-radius: var(--r-md); cursor: pointer; font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--fg-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 4px 9px; font-size: var(--fs-xs); }
.btn.ok { border-color: var(--ok); color: var(--ok); }
.btn.bad { border-color: var(--bad); color: var(--bad); }
.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-body { padding: var(--s-4); display: grid; gap: var(--s-3); min-width: 0; }
.panel-body.flush { padding: 0; }
.panel-body > * { min-width: 0; } /* grid children default to min-content: a long file name would widen the whole panel */
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-4); }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-4); }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-3); }
.split { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: var(--s-4); align-items: start; }
.stack { display: grid; gap: var(--s-3); min-width: 0; }
.row { display: flex; gap: var(--s-2); align-items: center; flex-wrap: wrap; min-width: 0; }
.row.between { justify-content: space-between; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font: 600 11px/1.6 var(--font-body); letter-spacing: .02em; white-space: nowrap; background: var(--surface-3); color: var(--fg-2); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.mono { font-family: var(--font-mono); font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.kpi { padding: var(--s-4); display: grid; gap: 4px; }
.kpi-value { font: 600 var(--fs-2xl)/1 var(--font-display); font-variant-numeric: tabular-nums; }
.kpi-label { font-size: var(--fs-sm); color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; font-size: var(--fs-sm); }
.tbl th { text-align: left; font: 600 var(--fs-xs)/1.3 var(--font-body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.clickable { cursor: pointer; }
.tbl tr.clickable:hover td { background: var(--surface-2); }
.tbl tr.sel td { background: var(--accent-soft); }
.list { display: grid; }
.list-item { display: grid; gap: 4px; padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; border-left: 3px solid transparent; background: transparent; border-top: 0; border-right: 0; width: 100%; }
.list-item:hover { background: var(--surface-2); }
.list-item[aria-selected="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.list-item:last-child { border-bottom: 0; }
.sev { width: 4px; align-self: stretch; border-radius: 2px; }
.callout { border: 1px solid var(--line); border-left: 4px solid var(--info); background: var(--info-soft); border-radius: var(--r-md); padding: var(--s-3) var(--s-4); font-size: var(--fs-sm); display: grid; gap: 4px; }
.callout.warn { border-left-color: var(--warn); background: var(--warn-soft); }
.callout.ok { border-left-color: var(--ok); background: var(--ok-soft); }
.callout.bad { border-left-color: var(--bad); background: var(--bad-soft); }
.callout.accent { border-left-color: var(--accent); background: var(--accent-soft); }
.code { font: 400 12.5px/1.55 var(--font-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s-3); overflow-x: auto; white-space: pre; margin: 0; }
.field-label { font-size: var(--fs-xs); color: var(--muted); }
.input, .select, .textarea { width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-md); padding: 7px 10px; font-size: var(--fs-sm); }
.textarea { min-height: 80px; resize: vertical; font-family: var(--font-mono); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: var(--fs-sm); }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font-size: var(--fs-sm); color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.empty { padding: var(--s-6); text-align: center; color: var(--muted); font-size: var(--fs-sm); }
.toast-host { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: grid; gap: 8px; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: var(--r-md); font-size: var(--fs-sm); box-shadow: var(--shadow); max-width: min(360px, calc(100vw - 32px)); overflow-wrap: anywhere; animation: toast-in .25s ease-out; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }

/* ---------- pipeline map ---------- */
.pipe { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
.pipe-step { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 10px; text-align: left; cursor: pointer; display: grid; gap: 4px; min-width: 0; }
.pipe-step:hover { border-color: var(--accent-line); }
.pipe-step .n { font: 600 11px/1 var(--font-mono); color: var(--accent); }
.pipe-step .t { font: 600 var(--fs-sm)/1.25 var(--font-display); }
.pipe-step .d { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.pipe-step .who { font-size: 10.5px; }
.pipe-step.ai { border-top: 3px solid var(--info); }
.pipe-step.det { border-top: 3px solid var(--ok); }
.pipe-step.human { border-top: 3px solid var(--warn); }
.legend { display: flex; gap: var(--s-4); flex-wrap: wrap; font-size: var(--fs-xs); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.compare { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--s-4); }
.compare ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: var(--fs-sm); }

/* ---------- spec text & highlights ---------- */
.spec { font: 400 var(--fs-md)/1.7 var(--font-body); max-width: 74ch; }
.spec p { margin-bottom: 12px; max-width: none; }
.spec-meta { font: 500 var(--fs-xs)/1.4 var(--font-mono); color: var(--muted); }
mark.hl { background: transparent; color: inherit; border-radius: 3px; padding: 1px 2px; cursor: pointer; box-shadow: inset 0 -2px 0 var(--hl-cond-line); }
mark.hl.cond { background: var(--hl-cond); box-shadow: inset 0 -2px 0 var(--hl-cond-line); }
mark.hl.param { background: var(--hl-param); box-shadow: inset 0 -2px 0 var(--hl-param-line); }
mark.hl.field { background: var(--hl-field); box-shadow: inset 0 -2px 0 var(--hl-field-line); }
mark.hl.exc { background: var(--hl-exc); box-shadow: inset 0 -2px 0 var(--hl-exc-line); }
mark.hl.flash { animation: flash 1.2s ease-out 2; }
@keyframes flash { 50% { outline: 2px solid var(--accent); outline-offset: 2px; } }
.hl-legend { display: flex; gap: var(--s-3); flex-wrap: wrap; font-size: var(--fs-xs); }
.hl-legend mark { cursor: default; }
.xref { color: var(--info); text-decoration: underline dotted; cursor: pointer; }
.redline del { background: var(--bad-soft); color: var(--bad); text-decoration: line-through; border-radius: 2px; }
.redline ins { background: var(--ok-soft); color: var(--ok); text-decoration: none; border-radius: 2px; font-weight: 500; }
.toc { font-size: var(--fs-sm); display: grid; gap: 1px; }
.toc button { text-align: left; border: 0; background: transparent; padding: 4px 8px; border-radius: var(--r-sm); cursor: pointer; display: grid; grid-template-columns: 54px 1fr auto; gap: 6px; color: var(--fg-2); }
.toc button:hover { background: var(--surface-2); }
.toc button[aria-current="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.toc .sub { padding-left: 20px; }
.ctx-meter { display: grid; gap: 6px; }
.meter { height: 8px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--info); border-radius: 999px; }

/* ---------- extraction / guards ---------- */
.runs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); }
.guard { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; font-size: var(--fs-sm); padding: 6px 0; }
.guard .gi { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--font-mono); background: var(--surface-3); color: var(--muted); }
.guard.ok .gi { background: var(--ok); color: var(--surface); }
.guard.bad .gi { background: var(--bad); color: var(--surface); }
.guard.run .gi { background: var(--info); color: var(--surface); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.param-row { display: grid; grid-template-columns: minmax(110px, 160px) 70px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: var(--fs-sm); }
.param-row:last-child { border-bottom: 0; }
.param-val { font: 600 var(--fs-md)/1 var(--font-mono); }
.param-val input { width: 64px; padding: 3px 6px; border: 1px solid var(--accent); border-radius: var(--r-sm); background: var(--surface); font: inherit; }
.typing::after { content: "▍"; animation: pulse .8s infinite; color: var(--accent); }
.badge-llm { background: var(--info-soft); color: var(--info); }
.badge-oracle { background: var(--ok-soft); color: var(--ok); }

/* ---------- provenance drawer ---------- */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(var(--drawer-w), 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 70; display: grid; grid-template-rows: auto minmax(0, 1fr); transform: translateX(105%); transition: transform .35s cubic-bezier(.2,.7,.2,1);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer.open { transform: none; }
.drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s-3); padding: var(--s-4); border-bottom: 1px solid var(--line); }
.drawer-body { overflow: auto; padding: var(--s-4); }
.trail { display: grid; gap: 0; }
.trail-step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; position: relative; padding-bottom: var(--s-4); }
.trail-step::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
.trail-step:last-child::before { display: none; }
.trail-ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--font-mono); border: 2px solid var(--line-strong); background: var(--surface); color: var(--muted); z-index: 1; }
.trail-step.src .trail-ic { border-color: var(--hl-param-line); color: var(--warn); }
.trail-step.llm .trail-ic { border-color: var(--info); color: var(--info); }
.trail-step.fn .trail-ic { border-color: var(--ok); color: var(--ok); }
.trail-step.res .trail-ic { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.trail-content { display: grid; gap: 6px; min-width: 0; padding-top: 3px; }
.trail-title { font: 600 var(--fs-sm)/1.3 var(--font-display); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.trail-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 10px; font-size: var(--fs-sm); min-width: 0; overflow-wrap: anywhere; }
.calc { font: 400 12.5px/1.7 var(--font-mono); }
.prov { border-bottom: 1px dashed var(--accent); cursor: pointer; font-weight: 600; }
.prov:hover { background: var(--accent-soft); }
.prov::after { content: " ⓘ"; font-size: .8em; color: var(--accent); font-weight: 400; }

/* ---------- timeline (AU periods) ---------- */
.tl { width: 100%; height: auto; display: block; }
.tl text { fill: var(--muted); font: 500 10px var(--font-mono); }
.tl .lbl { fill: var(--fg-2); }
.tl .axis { stroke: var(--line-strong); }
.tl .au { fill: var(--info); }
.tl .au.cur { fill: var(--accent); }
.tl .au.paper { fill: var(--warn); }
.tl .au.out { fill: var(--line-strong); }
.tl .win { fill: var(--accent-soft); }
.tl .gap { stroke: var(--muted); stroke-dasharray: 3 3; }

/* ---------- byte view ---------- */
.bytes { font: 400 12.5px/2 var(--font-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s-3); overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
.bytes span { border-radius: 2px; cursor: pointer; padding: 1px 0; }
.bytes span:nth-of-type(odd) { background: var(--hl-cond); }
.bytes span:nth-of-type(even) { background: var(--hl-field); }
.bytes span.blk { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.bytes span.bad { background: var(--bad); color: var(--surface); }
.bytes span.focus { outline: 2px solid var(--accent); }
.fieldinfo { min-height: 64px; }

/* ---------- inbox ---------- */
.msg { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: var(--s-3); padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--line); }
.msg:last-child { border-bottom: 0; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--font-mono); background: var(--surface-3); color: var(--fg-2); }
.avatar.itsg { background: var(--accent); color: var(--accent-ink); }
.avatar.kk { background: var(--info); color: var(--surface); }
.avatar.ven { background: var(--ok); color: var(--surface); }
.seq { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.seq .arrow { color: var(--muted); }

/* ---------- report ---------- */
.report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-6); display: grid; gap: var(--s-5); }
.report-head { display: flex; justify-content: space-between; gap: var(--s-4); flex-wrap: wrap; border-bottom: 2px solid var(--fg); padding-bottom: var(--s-4); }
.verdict { font: 700 var(--fs-xl)/1 var(--font-display); padding: 10px 16px; border-radius: var(--r-md); border: 2px solid currentColor; display: inline-block; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.seal { font: 500 11px/1.5 var(--font-mono); overflow-wrap: anywhere; color: var(--muted); }
.scope-chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: var(--r-md); padding: 6px 10px; font-size: var(--fs-sm); }

/* ---------- coverage ---------- */
.cov { display: grid; grid-template-columns: minmax(180px, 2fr) repeat(4, minmax(60px, 1fr)); font-size: var(--fs-sm); }
.cov > div { padding: 8px 10px; border-bottom: 1px solid var(--line); }
.cov .h { font: 600 var(--fs-xs)/1.3 var(--font-body); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2); }
.heat { display: inline-block; min-width: 34px; text-align: center; border-radius: var(--r-sm); padding: 1px 6px; font: 600 12px/1.6 var(--font-mono); }

/* ---------- audit log ---------- */
.log-item { display: grid; grid-template-columns: 74px 26px minmax(0, 1fr); gap: 10px; padding: 10px var(--s-4); border-bottom: 1px solid var(--line); font-size: var(--fs-sm); }
.log-item:last-child { border-bottom: 0; }
.log-time { font: 500 12px/1.6 var(--font-mono); color: var(--muted); }
.log-hash { font: 400 11px/1.4 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }

/* ---------- dropzone ---------- */
.drop { border: 2px dashed var(--line-strong); border-radius: var(--r-lg); padding: var(--s-5); display: grid; gap: 8px; place-items: center; text-align: center; color: var(--muted); font-size: var(--fs-sm); cursor: pointer; background: var(--surface-2); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }

/* ---------- AI test pipeline ---------- */
.drop-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, auto); gap: var(--s-3); align-items: stretch; }
.test-btn { flex-direction: column; justify-content: center; gap: 6px; padding: var(--s-3) var(--s-4); white-space: normal; text-align: center; min-height: 100%; }
.test-btn .icon { width: 22px; height: 22px; }
.test-btn small { font-weight: 400; font-size: var(--fs-xs); opacity: .85; max-width: 18ch; }
.doc-list { display: grid; gap: 4px; font-size: var(--fs-sm); }
.doc-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); }
.doc-row .name, #pdfStatus, .plan, .test-btn small { overflow-wrap: anywhere; }
.plan { display: grid; gap: 6px; font-size: var(--fs-sm); }
.plan-pair { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 600; }
.cot { display: grid; gap: 10px; min-width: 0; }
.cot-step { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; font-size: var(--fs-sm); min-width: 0; }
.cot-ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--font-mono); background: var(--surface-3); color: var(--fg-2); }
.cot-step.thought .cot-ic { background: var(--info-soft); color: var(--info); }
.cot-step.say .cot-ic { background: var(--info); color: var(--surface); }
.cot-step.term .cot-ic { background: var(--fg); color: var(--surface); }
.cot-step.spec .cot-ic, .cot-step.case .cot-ic { background: var(--accent); color: var(--accent-ink); }
.cot-step.err .cot-ic { background: var(--bad); color: var(--surface); }
.cot-step.ok .cot-ic { background: var(--ok); color: var(--surface); }
.cot-body { display: grid; gap: 6px; min-width: 0; }
.cot-title { font: 600 var(--fs-xs)/1.4 var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cot-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
.cot-text.live { border: 1px dashed var(--info); border-radius: var(--r-md); padding: 8px 10px; background: var(--info-soft); max-height: 260px; overflow: auto; }
details.cot-more summary { cursor: pointer; color: var(--fg-2); }
details.cot-more summary::marker { color: var(--accent); }
.term { background: #15171c; color: #e7e9ee; border-radius: var(--r-md); overflow: hidden; font: 400 12.5px/1.5 var(--font-mono); border: 1px solid #2a2e36; }
.term-head { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; background: #20242b; color: #9aa3b2; font-size: 11.5px; }
.term pre { margin: 0; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 340px; overflow: auto; }
.term .term-code { color: #b8d4ff; border-bottom: 1px solid #2a2e36; }
.term .term-out { color: #c8f0d0; }
.term .term-out.err { color: #ffb4ab; }
.json { font: 400 12px/1.5 var(--font-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 380px; overflow: auto; margin: 0; }
.tc-card { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--r-md); padding: 10px 12px; display: grid; gap: 6px; background: var(--surface); }
.tc-card.changed { border-left-color: var(--warn); }
.tc-sheet { display: grid; gap: 8px; font-size: var(--fs-sm); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; background: var(--surface-2); }
.tc-sheet ul, .tc-sheet ol { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 2px; }
.tc-expect { border-left: 3px solid var(--ok); padding-left: 8px; }
.gmini { display: flex; gap: 4px; flex-wrap: wrap; }
.gmini span { font: 600 10.5px/1.6 var(--font-mono); padding: 0 6px; border-radius: 4px; background: var(--surface-3); }
.gmini .ok { background: var(--ok-soft); color: var(--ok); } .gmini .warn { background: var(--warn-soft); color: var(--warn); } .gmini .fail { background: var(--bad-soft); color: var(--bad); }
.item-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.st { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--font-mono); background: var(--surface-3); color: var(--muted); }
.st.running { background: var(--info); color: var(--surface); animation: pulse 1s infinite; }
.st.done { background: var(--ok); color: var(--surface); } .st.error { background: var(--bad); color: var(--surface); }
.flag-formula { display: inline-flex; gap: 4px; align-items: center; background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: 1px 8px; font: 700 11px/1.5 var(--font-body); }
.formula-box { display: grid; gap: var(--s-3); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-4); background: var(--surface-2); }
.formula-box.changed { border: 2px solid var(--warn); background: var(--warn-soft); }
.formula-input { font: 500 14px/1.5 var(--font-mono); min-height: 64px; }
.formula-view { font: 500 13.5px/1.9 var(--font-mono); overflow-wrap: anywhere; }
.formula-view .v { background: var(--hl-param); border-bottom: 2px solid var(--hl-param-line); border-radius: 3px; padding: 0 3px; cursor: help; }
.formula-view .f { color: var(--info); font-weight: 600; }
.formula-old { font: 400 12.5px/1.6 var(--font-mono); color: var(--muted); text-decoration: line-through; overflow-wrap: anywhere; }
.result-big { font: 700 var(--fs-xl)/1.1 var(--font-mono); }
.var-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.var-table th { text-align: left; font: 600 var(--fs-xs)/1.3 var(--font-body); color: var(--muted); padding: 4px 6px; text-transform: uppercase; letter-spacing: .04em; }
.var-table td { padding: 4px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.var-table input, .var-table select { width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-sm); padding: 5px 7px; font: 500 13px var(--font-mono); }
.var-table select { min-width: 92px; }
.var-table tr.spec-param td:first-child { border-left: 3px solid var(--hl-param-line); }
.var-name { font: 600 13px var(--font-mono); }
.trace { font: 400 12px/1.7 var(--font-mono); color: var(--fg-2); }
.chk { display: inline-flex; align-items: center; }
.split.wide { grid-template-columns: minmax(200px, 260px) minmax(0, 1fr); }
#valTable td:nth-child(2), #clTable td:nth-child(2) { min-width: 220px; }
@media (max-width: 900px) { .split.wide { grid-template-columns: minmax(0, 1fr); } }
.login-scrim { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: grid; place-items: center; padding: 16px; }
.login-box { width: min(560px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: var(--s-6); display: grid; gap: var(--s-4); }
.login-box h2 { font: 700 var(--fs-xl)/1.2 var(--font-display); }
.login-roles { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
.login-role { display: grid; gap: 6px; text-align: left; padding: var(--s-4); border: 2px solid var(--line); border-radius: var(--r-lg); background: var(--surface-2); cursor: pointer; font-size: var(--fs-sm); color: var(--fg-2); }
.login-role b { font: 700 var(--fs-lg)/1.2 var(--font-display); color: var(--fg); }
.login-role .icon { width: 22px; height: 22px; color: var(--accent); }
.login-role[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
@media (max-width: 560px) { .login-roles { grid-template-columns: 1fr; } }
.notify-host { position: fixed; top: calc(var(--bar-h) + 12px); right: 16px; z-index: 70; display: grid; gap: 8px; width: min(380px, calc(100% - 32px)); }
.notify { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 12px; cursor: pointer; font-size: var(--fs-sm); animation: toast-in .3s ease; }
.notify.result { border-left-color: var(--ok); }
.notify:hover { background: var(--surface-2); }
.notify-ic { font-size: 18px; line-height: 1; }
.tbl tr.row-fail td { background: var(--bad-soft); }
.tbl tr.flash-row td { animation: flash 1s ease; }
.recap { border-color: var(--accent); animation: toast-in .3s ease; }
.recap-wait { margin: 6px 0 0; color: var(--muted); animation: pulse 1.4s ease infinite; }
.recap-h { font-size: var(--fs-sm); }
.recap-list { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 4px; font-size: var(--fs-sm); }
.recap-list.check { list-style: none; padding-left: 0; }
.recap-list.check li::before { content: "☐ "; color: var(--accent); }
.sel-bar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sel-bar .btn { margin-left: auto; }
.btn.danger-ghost { color: var(--bad); border-color: transparent; background: transparent; }
.btn.danger-ghost:not(:disabled):hover { background: var(--bad-soft); }
.row-del { opacity: .45; padding: 2px 6px; }
.list-item:hover .row-del, .row-del:focus-visible { opacity: 1; }
.list-group { padding: 8px 14px 4px; font: 600 var(--fs-xs)/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.recap-row { margin-top: 4px; font-size: var(--fs-xs); color: var(--accent); }
input.cover { width: 20px; height: 20px; accent-color: var(--ok); cursor: pointer; }
.tbl tr.row-done td { background: var(--ok-soft); }
.tbl tr.row-done td b { text-decoration: line-through; text-decoration-color: var(--muted); }
.cover-bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.cover-bar i { display: block; height: 100%; background: var(--ok); transition: width .3s ease; }
@media (max-width: 560px) { .drop-row { grid-template-columns: minmax(0, 1fr); } }

/* ---------- spec-change review (between extraction and test cases) ---------- */
.chg-bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; justify-content: space-between; padding: var(--s-3) var(--s-4); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm, none); }
.chg-bar .row { gap: var(--s-2); }
.chg-list { display: grid; gap: var(--s-3); }
.chg-card { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line-strong); border-radius: var(--r-lg); padding: var(--s-4); display: grid; gap: var(--s-3); min-width: 0; transition: border-color .15s; }
.chg-card.approved { border-left-color: var(--ok); }
.chg-card.declined { border-left-color: var(--bad); opacity: .72; }
.chg-card.done { border-left-color: var(--info); }
.chg-card.selected { box-shadow: 0 0 0 2px var(--accent-line); }
.chg-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s-3); align-items: start; }
.chg-head h3 { margin: 2px 0 0; overflow-wrap: anywhere; }
.chg-head input[type=checkbox] { width: 18px; height: 18px; margin-top: 4px; accent-color: var(--accent); }
.chg-summary { font-size: var(--fs-md, 15px); line-height: 1.5; margin: 0; overflow-wrap: anywhere; }
.chg-rules { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: var(--s-2); align-items: stretch; }
.chg-rule { border-radius: var(--r-md); padding: 10px 12px; display: grid; gap: 4px; align-content: start; font-size: var(--fs-sm); overflow-wrap: anywhere; }
.chg-rule.before { background: var(--surface-2); color: var(--fg-2); }
.chg-rule.after { background: var(--ok-soft); color: var(--fg); }
.chg-rule.only { grid-column: 1 / -1; background: var(--surface-2); }
.chg-arrow { align-self: center; color: var(--muted); font-size: 20px; }
.chg-params { display: grid; gap: 6px; }
.chg-param { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: var(--s-2); align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-md); font-size: var(--fs-sm); }
.chg-param .val { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
.chg-param .old { text-decoration: line-through; color: var(--muted); }
.chg-param .new { font-weight: 700; background: var(--ok-soft); color: var(--ok); border-radius: 6px; padding: 1px 8px; }
.chg-param .q { grid-column: 1 / -1; font-size: 12px; color: var(--muted); font-style: italic; overflow-wrap: anywhere; }
.chg-quote { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; font-size: var(--fs-sm); overflow-wrap: anywhere; }
.chg-actions { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: var(--s-3); }
.chg-edit { display: grid; gap: var(--s-3); }
.chg-edit .prow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, .8fr) auto; gap: 6px; align-items: center; }
.chg-edit .prow.headrow { font: 600 var(--fs-xs) var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.chg-edit textarea { font-family: var(--font-body); min-height: 64px; }
.chg-pending { display: flex; gap: var(--s-3); align-items: center; padding: var(--s-3) var(--s-4); border: 1px dashed var(--line-strong); border-radius: var(--r-lg); font-size: var(--fs-sm); color: var(--muted); }
.chg-banner { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; justify-content: space-between; }
@media (max-width: 700px) {
  .chg-rules { grid-template-columns: minmax(0, 1fr); }
  .chg-arrow { transform: rotate(90deg); justify-self: center; }
  .chg-edit .prow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .chg-edit .prow.headrow { display: none; }
}

/* ---------- modal ---------- */
.modal-scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 80; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: var(--r-lg); width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; box-shadow: var(--shadow); display: grid; }
.modal-head { padding: var(--s-4); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: var(--s-3); }
.modal-body { padding: var(--s-4); display: grid; gap: var(--s-3); }
.modal-foot { padding: var(--s-3) var(--s-4); border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: var(--s-2); flex-wrap: wrap; }

/* ---------- tour ---------- */

  function parseDTA(text) {
    const lines = text.split(/\r?\n/).filter(l => l.length);
    const out = { lines: [], records: [], errors: [] };
    lines.forEach((line, li) => {
      const kind = line.slice(0, 4);
      const rec = { kind, line: li, length: line.length, fields: [], blocks: [], raw: line };
      if (kind === "DSLW") {
        DSLW.forEach(([a, b, name, sec]) => rec.fields.push({ name, sec, from: a, to: b, value: line.slice(a - 1, b) }));
        let pos = 225;
        while (pos <= line.length) {
          const id = line.slice(pos - 1, pos + 3);
          if (id === "DBVO") {
            const n = Number(line.slice(pos + 29, pos + 31));
            const len = 32 + 50 * (Number.isFinite(n) ? n : 0);
            const raw = line.slice(pos - 1, pos - 1 + len);
            const blk = { id, from: pos, to: pos + len - 1, raw, fields: [], groups: [] };
            DBVO_HEAD.forEach(([a, b, name, sec]) => blk.fields.push({ name, sec, from: pos + a - 1, to: pos + b - 1, value: raw.slice(a - 1, b) }));
            for (let g = 0; g < n; g++) {
              const base = 32 + g * 50, grp = { nn: g + 1, fields: [] };
              DBVO_GROUP.forEach(([off, len2, name, sec]) => grp.fields.push({ name: `${name}-${String(g + 1).padStart(2, "0")}`, base: name, sec, from: pos + base + off, to: pos + base + off + len2 - 1, value: raw.slice(base + off, base + off + len2) }));
              blk.groups.push(grp);
            }
            if (raw.length < len) out.errors.push({ code: "DBVO_SHORT", msg: { en: `DBVO declares ${n} periods but the line ends early.`, de: `DBVO meldet ${n} Zeiträume, die Zeile endet aber vorher.` } });
            rec.blocks.push(blk); pos += len;
          } else if (FIXED_BLOCKS[id]) {
            const fb = FIXED_BLOCKS[id], raw = line.slice(pos - 1, pos - 1 + fb.len);
            rec.blocks.push({ id, from: pos, to: pos + fb.len - 1, raw, fields: fb.fields.map(([a, b, name]) => ({ name, sec: fb.sec, from: pos + a - 1, to: pos + b - 1, value: raw.slice(a - 1, b) })) });
            pos += fb.len;
          } else {
            out.errors.push({ code: "UNKNOWN_BLOCK", at: pos, msg: { en: `Unknown or misaligned data block “${id}” at position ${pos}.`, de: `Unbekannter oder verschobener Datenbaustein „${id}“ an Position ${pos}.` } });
            break;
          }
        }
      } else {
        rec.fields.push({ name: "KENNUNG", from: 1, to: 4, value: kind }, { name: "VERFAHREN", from: 5, to: 9, value: line.slice(4, 9) }, { name: "REST (envelope)", from: 10, to: line.length, value: line.slice(9) });
      }
      out.records.push(rec);
    });
    return out;
  }
  const fieldOf = (rec, name) => (rec.fields.find(f => f.name === name) || {}).value;
  const blockOf = (rec, id) => rec.blocks.find(b => b.id === id);

  /* ---------- message validation (comparator) ---------- */
  function validateMessage(text, scenario, P) {
    const parsed = parseDTA(text), checks = [];
    const add = (id, ok, sec, uuid, en, de2, where) => checks.push({ id, ok, sec, uuid, msg: { en, de: de2 }, where: where || null });
    const dslw = parsed.records.find(r => r.kind === "DSLW");
    add("F-STRUCT", parsed.errors.length === 0 && !!dslw, "3.1", null, parsed.errors.length ? parsed.errors.map(e => e.msg.en).join(" ") : "Record structure readable (DSLW + data blocks).", parsed.errors.length ? parsed.errors.map(e => e.msg.de).join(" ") : "Satzaufbau lesbar (DSLW + Datenbausteine).");
    if (!dslw) return { parsed, checks, meta: {} };
    const ag = fieldOf(dslw, "ABGABEGRUND");
    const meta = { abgabegrund: ag, product: fieldOf(dslw, "PRODUKT-IDENTIFIER"), modification: fieldOf(dslw, "MODIFIKATIONS-IDENTIFIER"), dsid: fieldOf(dslw, "DATENSATZ-ID"), created: fieldOf(dslw, "DATUM-ERSTELLUNG") };
    add("F-AG", ABGABEGRUENDE.includes(ag), "3.1.18", null, `Abgabegrund “${ag}” is a valid code.`, `Abgabegrund „${ag}“ ist ein gültiger Schlüssel.`, ["ABGABEGRUND"]);
    add("F-KORR", fieldOf(dslw, "KORR-ABGABEGRUND") === "00", "3.1.19", null, "KORR-ABGABEGRUND is default (00) in an employer report.", "KORR-ABGABEGRUND ist in der AG-Meldung Grundstellung (00).", ["KORR-ABGABEGRUND"]);
    const dbid = blockOf(dslw, "DBID");
    add("F-DBID", !!dbid && !!(dbid.fields.find(f => f.name === "AKTENZEICHEN-VERURSACHER").value.trim()), "3.19", null, "DBID present with the sender's file reference (AZVU).", "DBID mit Aktenzeichen Verursacher (AZVU) vorhanden.", ["AKTENZEICHEN-VERURSACHER"]);
    if (ag === "41") {
      const vo = blockOf(dslw, "DBVO");
      add("V-PRESENT", !!vo, "3.12", null, "DBVO block present for Abgabegrund 41.", "DBVO-Baustein bei Abgabegrund 41 vorhanden.");
      if (vo) {
        const f = n => vo.fields.find(x => x.name === n).value;
        add("V-GRUND", ["1", "2", "3"].includes(f("GRUNDAV")), "3.12.1", null, `GRUNDAV = “${f("GRUNDAV")}” (1/2/3).`, `GRUNDAV = „${f("GRUNDAV")}“ (1/2/3).`, ["GRUNDAV"]);
        add("V-SV", f("AU-AB-SV") === "00000000", "3.12.3", null, "AU-AB-SV is default: only the insurer fills it.", "AU-AB-SV ist Grundstellung: nur die Krankenkasse füllt es.", ["AU-AB-SV"]);
        add("V-KZAK", f("KZ-AK-AU") === "0", "3.12.4", null, "KZ-AK-AU is default (0) in an employer report.", "KZ-AK-AU ist in der AG-Meldung Grundstellung (0).", ["KZ-AK-AU"]);
        add("V-12M", f("12-MONATSFRIST-AB") === "00000000", "3.12.5", null, "12-month period start is default (insurer field).", "Beginn 12-Monatsfrist ist Grundstellung (Feld der Krankenkasse).", ["12-MONATSFRIST-AB"]);
        const n = Number(f("ANZAHL-AU"));
        add("V-COUNT", n >= 1 && n === vo.groups.length && parsed.errors.length === 0, "3.12.6", null, `ANZAHL-AU = ${n}, periods found = ${vo.groups.length}, at least 1.`, `ANZAHL-AU = ${n}, gefundene Zeiträume = ${vo.groups.length}, mindestens 1.`, ["ANZAHL-AU"]);
        const periods = vo.groups.map(g => ({ start: fromYmd(g.fields[0].value), end: fromYmd(g.fields[1].value), g }));
        const insurerFilled = vo.groups.filter(g => g.fields.slice(2).some(x => /[^0]/.test(x.value)));
        add("V-GRPDEF", insurerFilled.length === 0, "3.12.9", null, "Insurer-only fields in every period are default.", "Kassenfelder in allen Zeiträumen sind Grundstellung.", insurerFilled.flatMap(g => g.fields.slice(2).filter(x => /[^0]/.test(x.value)).map(x => x.name)));
        const ordered = periods.every((p, i) => i === 0 || (p.start != null && periods[i - 1].start != null && p.start < periods[i - 1].start));
        add("V-ORDER", ordered, "3.12.7", null, "Periods listed newest first.", "Zeiträume beginnend mit der aktuellsten.", ordered ? null : periods.map(p => p.g.fields[0].name));
        const cur = fromYmd(f("AU-AB-AG"));
        let refStart = cur, chainOk = true, badGroup = null;
        [...periods].sort((a, b) => b.start - a.start).forEach(p => { if (!chainOk) return; if (!(refStart <= addMonths(p.end, P.six_months))) { chainOk = false; badGroup = p.g; } refStart = p.start; });
        add("V-CHAIN", chainOk, "3.12", UUID.chain, `Each period ends no more than ${P.six_months} months before the next one starts.`, `Zwischen den Zeiträumen liegen jeweils nicht mehr als ${P.six_months} Monate.`, badGroup ? [badGroup.fields[0].name, badGroup.fields[1].name] : null);
        if (scenario) {
          const exp = dbvoBlock(scenario.state, P);
          const same = vo.raw === exp;
          add("V-ORACLE", same, "3.12", null, same ? "DBVO block equals the oracle's expected block byte for byte." : "DBVO block differs from the oracle's expected block.", same ? "DBVO-Baustein stimmt Byte für Byte mit dem Erwartungswert des Orakels überein." : "DBVO-Baustein weicht vom Erwartungswert des Orakels ab.");
          meta.expected = exp; meta.actual = vo.raw;
          const gt = gates(scenario.state, scenario.today, P);
          add("V-GATE", gt.allowed, "3.12", UUID.thirty_days, gt.allowed ? `Scenario allows request 41 (${gt.days.total} d ≥ ${P.min_days} d).` : "Scenario does NOT allow request 41, but the software produced one.", gt.allowed ? `Szenario erlaubt Anfrage 41 (${gt.days.total} T ≥ ${P.min_days} T).` : "Szenario erlaubt KEINE Anfrage 41, die Software hat aber eine erzeugt.");
        }
      }
    }
    return { parsed, checks, meta, ok: checks.every(c => c.ok) };
  }

  const TEMPLATES = [
    { id: "gap-in", crit: UUID.six_months, label: { en: "Gap exactly 6 months", de: "Lücke genau 6 Monate" } },

    { id: "uncert", crit: UUID.certified, label: { en: "Uncertified short sick days are dropped", de: "Unbescheinigte Kurz-AU wird nicht übermittelt" } }

  function generateVariants(seed, P, count) {
    const rnd = mulberry32(seed), pick = a => a[Math.floor(rnd() * a.length)], out = [];
    for (let i = 0; i < count; i++) {
      const t = TEMPLATES[i % TEMPLATES.length];
      const month = 1 + Math.floor(rnd() * 6), day = 2 + Math.floor(rnd() * 25);
      const start = D(`2027-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`);
      const st = { insurance: "GKV", marginal: false, current: { start, end: start + 9, certified: true }, priors: [] };
      let today = start;
      if (t.id === "gap-in" || t.id === "gap-out") {
        const end = addMonths(start, -P.six_months) - (t.id === "gap-out" ? 1 : 0);
        st.priors.push({ start: end - 24, end, certified: true });
      } else if (t.id === "days-29" || t.id === "days-30") {
        const need = (t.id === "days-29" ? 29 : 30) - 10, a = 5 + Math.floor(rnd() * 8), b = need - a;
        const e1 = start - 20 - Math.floor(rnd() * 30);
        st.priors.push({ start: e1 - b + 1, end: e1, certified: true });
        const e2 = e1 - 30 - Math.floor(rnd() * 40);
        st.priors.push({ start: e2 - a + 1, end: e2, certified: true });
      } else if (t.id === "open-end") {
        st.current.end = null; today = start + 3;
        const e1 = start - 15 - Math.floor(rnd() * 40);
        st.priors.push({ start: e1 - 18, end: e1, certified: true });
      } else if (t.id === "uncert") {
        const e1 = start - 25;
        st.priors.push({ start: e1 - 2, end: e1, certified: false });
        st.priors.push({ start: e1 - 60, end: e1 - 40, certified: true });
      }
      const g = gates(st, today, P);
      out.push({ id: `TV-${seed}-${String(i + 1).padStart(2, "0")}`, template: t, name: `${pick(FIRST)} ${pick(LAST)}`, today, state: st, result: g, expected: g.allowed ? dbvoBlock(st, P) : null });
    }
    return out;
  }

  };
  const HL_KIND = { cond: () => L("condition", "Bedingung"), param: () => L("parameter / number", "Parameter / Zahl"), field: () => L("required output field", "Pflichtfeld der Ausgabe"), exc: () => L("exception", "Ausnahme") };
  function highlightText(text, sec, extraQuote) {
    let html = esc(text);
    const hls = (HIGHLIGHTS[sec] || []).slice().sort((a, b) => b.q.length - a.q.length);
    const used = [];
    hls.forEach((h, i) => {
      const e = esc(h.q), idx = html.indexOf(e);
      if (idx < 0 || used.some(u => idx < u[1] && idx + e.length > u[0])) return;
      const tag = `<mark class="hl ${h.k}" data-act="hl" data-sec="${esc(sec)}" data-i="${(HIGHLIGHTS[sec] || []).indexOf(h)}" title="${esc(HL_KIND[h.k]())}">`;
      html = html.slice(0, idx) + tag + e + "</mark>" + html.slice(idx + e.length);
      used.forEach(u => { if (u[0] > idx) { u[0] += tag.length + 7; u[1] += tag.length + 7; } });
      used.push([idx, idx + tag.length + e.length + 7]);
    });
    if (extraQuote) { const e = esc(extraQuote); const i = html.indexOf(e); if (i >= 0) html = html.slice(0, i) + `<mark class="hl param flash" id="flashQuote">` + e + "</mark>" + html.slice(i + e.length); }
    return html.replace(/(\d+\.\d+(?:\.\d+)*)(?=\s„)/g, m => C.SPEC.sections[m] ? `<span class="xref" data-act="goSec" data-sec="${m}">${m}</span>` : m);
  }

  /* ---------- 2 · Change impact ---------- */
  function vChanges() {

    const counts = Object.keys(SOURCE).map(k => [k, list.filter(c => c.source === k).length]);

    const K = 16, parts = ch.diff ? ch.diff.parts : [];

    const redline = ch.diff ? parts.map((p, i) => p.t === "=" ? esc(trimEq(p.s, i)) : p.t === "-" ? `<del>${esc(p.s)}</del>` : `<ins>${esc(p.s)}</ins>`).join(" ") : null;

            <div class="row between"><b class="mono">§${c.sec}</b>${riskPill(r)}</div>
            <div style="font-size:var(--fs-sm)">${esc(c.title)}</div>
            <div class="row"><span class="pill ${SOURCE[c.source].cls}">${T(SOURCE[c.source])}</span><span class="pill">${typeLabel(changeType(c.sec))}</span><span class="pill">${changeImpact(c).count} ${L("tests", "Tests")}</span></div></button>`; }).join("")}</div></section>
        <section class="panel" data-tour="redline"><div class="panel-head"><div class="stack" style="gap:2px"><span class="eyebrow">§${ch.sec}</span><h3>${esc(ch.title)}</h3></div><div class="row"><span class="pill ${SOURCE[ch.source].cls}">${T(SOURCE[ch.source])}</span>${riskPill(risk)}</div></div>
          <div class="panel-body">
            ${ch.entry ? `<div class="callout"><b>${L("Change log entry", "Eintrag im Änderungsprotokoll")} (${esc(ch.entry.version)} · ${esc(ch.entry.date)})</b><span class="de-quote">${esc(ch.entry.raw.split(" | ")[2])}</span><span class="muted" style="font-size:var(--fs-xs)">${L("Parsed: § refs", "Geparst: §-Bezüge")} ${ch.entry.refs.map(r => r.sec).join(", ")} · ${L("description", "Beschreibung")} „${esc(ch.entry.description)}“</span></div>` : `<div class="callout bad"><b>${L("Not in the change log", "Nicht im Änderungsprotokoll")}</b>${L("Found only by comparing the text. Without the diff, this change would have gone unnoticed.", "Nur durch Textvergleich gefunden. Ohne Diff wäre diese Änderung übersehen worden.")}</div>`}
