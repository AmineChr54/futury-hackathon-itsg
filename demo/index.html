      <section class="panel"><div class="panel-head"><h4>${L("Chain of thought (saved with this test case)", "Gedankengang (mit diesem Testfall gespeichert)")}</h4><span class="muted" style="font-size:var(--fs-xs)">${(c.cot || []).length} ${L("steps", "Schritte")} · ${esc(c.model)}</span></div><div class="panel-body"><div class="cot">${(c.cot || []).map(evHtml).join("")}</div></div></section>
      <section class="panel"><div class="panel-head"><h4>${L("History", "Verlauf")}</h4></div><div class="panel-body flush">${(c.history || []).slice().reverse().map(h => `<div class="log-item"><span class="log-time">${esc((h.t || "").slice(5, 16).replace("T", " "))}</span><span>${h.who && h.who.startsWith("AI") ? "AI" : "👤"}</span><div><b>${esc(h.action)}</b> · ${esc(h.who)}<div class="muted">${esc(h.detail || "")}</div></div></div>`).join("")}</div></section>`;
  }
  let evalTimer = null;
  function scheduleEval() {
    clearTimeout(evalTimer);
    evalTimer = setTimeout(async () => {
      const fm = P.draft && P.draft.formula; if (!fm) return;
      try { P.preview = await api("/api/evaluate", { body: { expression: fm.expression, variables: fm.variables } }); } catch (e) { P.preview = { ok: false, error: e.message }; }
      paintFormula();
    }, 250);
  }
  function paintFormula() {
    const c = P.caseDetail, d = P.draft; if (!c || !d) return;
    const fv = document.getElementById("pipeFormulaView"); if (fv) fv.innerHTML = formulaView(d.formula.expression, d.formula.variables);
    const pv = document.getElementById("pipePreview"); if (pv) pv.innerHTML = previewHtml(P.preview, c.expected_value);
    const names = (P.preview && P.preview.names) || [], missing = names.filter(n => !d.formula.variables.some(v => v.name === n));
    const ms = document.getElementById("pipeMissing"); if (ms) ms.innerHTML = missing.length ? `<div class="row">${L("Variables without a value", "Variablen ohne Wert")}: ${missing.map(n => `<button class="btn sm" data-act="pipeAddVar" data-name="${esc(n)}">+ ${esc(n)}</button>`).join("")}</div>` : "";
    const sb = document.getElementById("pipeSaveBtn"); if (sb) sb.disabled = false;
  }
  function readDraftFields() {
    const d = P.draft; if (!d) return true;
    const g = id => document.getElementById(id);
    if (g("pipeTitle")) d.title = g("pipeTitle").value;
    if (g("pipeOutcome")) d.expected_outcome = g("pipeOutcome").value;
    if (g("pipeCrit")) d.criterion = g("pipeCrit").value;
    const lines = el => el.value.split("\n").map(s => s.replace(/^\s*(\d+[.)]|[-•])\s*/, "").trim()).filter(Boolean);
    if (g("pipePre")) d.preconditions = lines(g("pipePre"));
    if (g("pipeSteps")) d.steps = lines(g("pipeSteps"));
    if (g("pipeScenario")) { try { d.scenario = JSON.parse(g("pipeScenario").value || "{}"); } catch (e) { A.toast(L("Scenario is not valid JSON", "Szenario ist kein gültiges JSON")); return false; } }
    return true;
  }
  async function saveCase() {
    if (!readDraftFields()) return false;
    try {
      const r = await api(`/api/testcases/${encodeURIComponent(P.selCase)}`, { method: "PATCH", body: P.draft });
      A.toast(r.changes.length ? L("Saved: ", "Gespeichert: ") + r.changes.length + L(" change(s), expected value recomputed", " Änderung(en), Erwartungswert neu berechnet") : L("No changes", "Keine Änderungen"));
      A.log("examiner", L("Test case edited", "Testfall bearbeitet"), `${P.selCase}: ${r.changes.join("; ")}`);
      await loadCases(); await openCase(P.selCase); return true;
    } catch (e) { A.toast(e.message); return false; }
  }
  async function caseAction(action, body) {
    try {
      await api(`/api/testcases/${encodeURIComponent(P.selCase)}/${action}`, { body: body || {} });
      A.log("examiner", { verify: L("Test case verified", "Testfall verifiziert"), reject: L("Test case rejected", "Testfall abgelehnt"), reopen: L("Test case reopened", "Testfall wieder geöffnet") }[action], P.selCase + (body && (body.reason || body.override_reason) ? " · " + (body.reason || body.override_reason) : ""));
      await loadCases(); await openCase(P.selCase); return true;
    } catch (e) {
      if (action === "verify" && /give a reason/.test(e.message)) {
        A.modal(L("Checks failed", "Prüfungen fehlgeschlagen"), `<p>${esc(e.message)}</p><label class="stack"><span class="field-label">${L("Why is the test case correct anyway?", "Warum ist der Testfall trotzdem korrekt?")}</span><textarea class="textarea" id="pipeOverride" style="font-family:var(--font-body)"></textarea></label>`, null, `<button class="btn" data-act="closeModal">${L("Cancel", "Abbrechen")}</button><button class="btn primary" data-act="pipeVerifyOverride">${L("Verify with reason", "Mit Begründung verifizieren")}</button>`);
      } else A.toast(e.message);
      return false;
    }
  }
  async function openSend() {
    try { P.users = await api("/api/users"); } catch (e) { /* keep the old list */ }
    const devs = P.users.filter(u => u.role === "dev");
    const ids = sendable(), unverified = ids.filter(id => !["verified", "sent", "acknowledged"].includes((P.cases.find(c => c.id === id) || {}).status));

  }

    A.modal(L("Who are you?", "Wer sind Sie?"), `<p class="muted" style="font-size:var(--fs-sm)">${L("Your name is recorded with every edit, verification and hand-over. Developers receive test cases under this name.", "Ihr Name wird bei jeder Änderung, Verifizierung und Übergabe vermerkt. Entwickler erhalten Testfälle unter diesem Namen.")}</p>

      `<button class="btn" data-act="closeModal">${L("Cancel", "Abbrechen")}</button><button class="btn primary" data-act="pipeSaveUser">${L("Continue", "Weiter")}</button>`);

    setTimeout(() => { const i = document.getElementById("pipeUserName"); if (i) i.focus(); }, 30);

  async function register() {
    if (!P.online || !P.user || !["itsg", "dev", "vendor"].includes(S.role)) return;

    else { register(); if (S.role === "dev") loadInbox(); }

  async function loadInbox() {
    if (!P.online || !P.user) return;
    try {
      const before = P.inbox.length;
      P.inbox = await api(`/api/inbox?user=${encodeURIComponent(P.user)}`);
      if (S.role === "dev" && P.inbox.length > before && before) A.toast(L("New test cases from ITSG", "Neue Testfälle von ITSG"));
      if (onScreen("devinbox") && !editing()) rerender(); else A.renderShell();
    } catch (e) { /* offline */ }
  }

  let devTimer = null;

  async function exportJson(path, name) {

  /* ---------- spec-change review: the examiner approves, edits or declines what the AI extracted ---------- */
  const CT = () => ({
    parameter: [L("A limit or number changed", "Grenzwert oder Zahl geändert"), "warn"],
    condition: [L("A condition changed", "Eine Bedingung hat sich geändert"), "warn"],
    formula: [L("A calculation changed", "Eine Berechnung hat sich geändert"), "bad"],

    removed_rule: [L("Rule removed", "Regel entfallen"), "bad"],

    clarification: [L("Clarification", "Klarstellung"), "info"],

  const ctPill = t => { const [label, cls] = CT()[t] || [t || "?", ""]; return pill(esc(label), cls); };
  const human = n => { const s = String(n || "").replace(/_/g, " ").trim(); return s ? s[0].toUpperCase() + s.slice(1) : ""; };

  const approvedReady = () => (P.run ? P.run.items : []).filter(i => i.status === "review" && i.decision === "approved");
  const chState = i => i.status === "done" ? "done" : (i.status === "queued" || i.status === "running") ? "busy" : i.decision || "waiting";

    done: i.cases.length ? pill(`✓ ${L("test cases created", "Testfälle erstellt")} (${i.cases.length})`, "info") : pill("✓ " + L("nothing to test", "nichts zu testen"), ""),

    approved: pill("✓ " + L("approved", "freigegeben"), "ok"),

      <div class="chg-bar" role="toolbar" aria-label="${esc(L("Bulk actions", "Sammelaktionen"))}">

          <span class="muted" style="font-size:var(--fs-sm)">${sel.length ? `${sel.length} ${L("selected", "ausgewählt")}` : L("tick cards to act on several at once", "Karten anhaken, um mehrere auf einmal zu bearbeiten")}</span></div>

      </div>
      <div class="tabs" role="tablist">${[["all", L("All", "Alle"), all.length], ["waiting", L("Waiting for you", "Wartet auf Sie"), count("waiting")], ["approved", L("Approved", "Freigegeben"), count("approved")], ["declined", L("Declined", "Abgelehnt"), count("declined")], ["done", L("Test cases created", "Testfälle erstellt"), count("done")]].map(([k, t, n]) => `<button class="tab" role="tab" aria-selected="${f === k}" data-act="chFilter" data-f="${k}">${t} <span class="muted">${n}</span></button>`).join("")}</div>
      <div class="chg-list">${shown.length ? shown.map(chCard).join("") : `<div class="empty">${all.length ? L("Nothing in this filter.", "Nichts in diesem Filter.") : P.run.status === "running" ? L("The AI is reading the sections. Changes appear here as soon as they are extracted.", "Die KI liest die Abschnitte. Änderungen erscheinen hier, sobald sie extrahiert sind.") : L("No changes were extracted in this run.", "In diesem Lauf wurden keine Änderungen extrahiert.")}</div>`}
        ${pending.length && f === "all" ? pending.map(i => `<div class="chg-pending">✕ <div style="flex:1"><b>§${esc(i.sec)} ${esc(i.title)}</b><br>${L("The AI could not extract a change for this section.", "Die KI konnte für diesen Abschnitt keine Änderung extrahieren.")}</div><button class="btn sm" data-act="pipeGen" data-sec="${esc(i.sec)}">↻ ${L("Try again", "Erneut versuchen")}</button></div>`).join("") : ""}</div>`;
  }

  function chCard(i) {
    const st = chState(i), sc = i.spec_change || {};
    if (st === "busy" && !i.spec_change) return `<div class="chg-pending"><span class="st running">◐</span><div><b>§${esc(i.sec)} ${esc(i.title)}</b><br>${L("The AI is reading this section…", "Die KI liest diesen Abschnitt…")}</div></div>`;
    if (P.chEdit === i.sec) return chEditCard(i);
    const params = (sc.parameters || []).filter(p => p && p.name);
    const checks = sc.quote_checks || [];
    const bad = checks.filter(q => !q.ok).length;
    const selected = P.chSel.has(i.sec) && i.status === "review";
    return `<article class="chg-card ${st} ${selected ? "selected" : ""}" data-sec="${esc(i.sec)}">
      <div class="chg-head">${i.status === "review" ? `<input type="checkbox" data-chsel="${esc(i.sec)}" ${selected ? "checked" : ""} aria-label="${esc(L("Select", "Auswählen") + " §" + i.sec)}">` : "<span></span>"}
        <div style="min-width:0"><span class="eyebrow">§${esc(i.sec)} · ${L("page", "Seite")} ${esc(i.page)}${i.change_edited ? " · " + L("edited by you", "von Ihnen bearbeitet") : ""}</span><h3>${esc(i.title)}</h3></div>
        <div>${chStatePill(i)}</div></div>
      <div class="row" style="gap:6px">${ctPill(sc.change_type)}${sc.formula_changed ? `<span class="flag-formula">ƒ ${L("the calculation changes", "die Berechnung ändert sich")}</span>` : ""}${kindPill(i.kind)}</div>
      ${sc.summary ? `<p class="chg-summary">${esc(sc.summary)}</p>` : ""}
      ${sc.old_rule ? `<div class="chg-rules"><div class="chg-rule before"><span class="field-label">${L("Before", "Vorher")}</span><div>${esc(sc.old_rule)}</div></div><div class="chg-arrow" aria-hidden="true">→</div><div class="chg-rule after"><span class="field-label">${L("Now", "Jetzt")}</span><div>${esc(sc.new_rule || "")}</div></div></div>`
        : sc.new_rule ? `<div class="chg-rules"><div class="chg-rule only"><span class="field-label">${L("The rule", "Die Regel")}</span><div>${esc(sc.new_rule)}</div></div></div>` : ""}
      ${params.length ? `<div class="stack" style="gap:6px"><span class="field-label">${L("Numbers and limits", "Zahlen und Grenzwerte")}</span><div class="chg-params">${params.map(p => `<div class="chg-param"><b>${esc(human(p.name))}</b><span class="val">${p.old_value ? `<span class="old">${esc(p.old_value)}</span><span class="muted">→</span>` : ""}<span class="new">${esc(p.new_value || "—")}${p.unit ? " " + esc(p.unit) : ""}</span></span>${p.quote ? `<span class="q">„${esc(p.quote)}“</span>` : ""}</div>`).join("")}</div></div>` : ""}
      ${checks.length ? `<details class="cot-more" ${bad ? "open" : ""}><summary><b>${L("Evidence from the specification", "Belege aus der Spezifikation")}</b> <span class="muted">· ${checks.length - bad}/${checks.length} ${L("found word for word", "wörtlich gefunden")}</span>${bad ? " " + pill(`${bad} ${L("not found — check", "nicht gefunden — prüfen")}`, "bad") : ""}</summary><div class="stack" style="gap:6px;margin-top:8px">${checks.map(q => `<div class="chg-quote"><span class="pill ${q.ok ? "ok" : "bad"}" title="${esc(q.ok ? L("found word for word in the spec", "wörtlich in der Spezifikation gefunden") : L("not found in the spec — the AI may have paraphrased", "nicht in der Spezifikation gefunden — die KI hat evtl. umformuliert"))}">${q.ok ? "✓" : "?"} ${q.side === "old" ? L("old text", "alter Text") : L("new text", "neuer Text")}</span><span class="de-quote">„${esc(q.quote)}“</span></div>`).join("")}</div></details>` : ""}
      <div class="chg-actions"><div class="row">${i.status === "review"
          ? (i.decision ? `<button class="btn ghost" data-act="chDecide" data-sec="${esc(i.sec)}" data-d="">↺ ${L("Undo", "Zurücknehmen")}</button>` : `<button class="btn ok primary" data-act="chDecide" data-sec="${esc(i.sec)}" data-d="approved">✓ ${L("Approve", "Freigeben")}</button>`)
            + `<button class="btn" data-act="chEdit" data-sec="${esc(i.sec)}">✎ ${L("Edit", "Bearbeiten")}</button>`
            + (i.decision === "declined" ? "" : `<button class="btn bad" data-act="chDecide" data-sec="${esc(i.sec)}" data-d="declined">✕ ${L("Decline", "Ablehnen")}</button>`)
          : i.status === "done" ? `<button class="btn" data-act="go" data-screen="review">${ic("check")} ${L("Open the test cases", "Testfälle öffnen")}</button>` : ""}</div>
        <details class="cot-more"><summary class="muted" style="font-size:var(--fs-xs)">${L("raw data (JSON)", "Rohdaten (JSON)")}</summary><pre class="json" style="margin-top:6px">${esc(JSON.stringify(Object.fromEntries(Object.entries(sc).filter(([k]) => !["quote_checks", "section", "title", "page", "detected_as", "source", "document", "previous_document"].includes(k))), null, 2))}</pre></details></div>
    </article>`;
  }

  function chEditCard(i) {
    const d = P.chDraft;
    const prow = (p, n) => `<div class="prow"><input class="input" data-cp="${n}" data-k="name" value="${esc(p.name || "")}" placeholder="${esc(L("e.g. gap months", "z. B. Abstand Monate"))}" aria-label="${esc(L("Name", "Name"))}"><input class="input" data-cp="${n}" data-k="old_value" value="${esc(p.old_value || "")}" placeholder="${esc(L("before", "vorher"))}" aria-label="${esc(L("Before", "Vorher"))}"><input class="input" data-cp="${n}" data-k="new_value" value="${esc(p.new_value || "")}" placeholder="${esc(L("now", "jetzt"))}" aria-label="${esc(L("Now", "Jetzt"))}"><input class="input" data-cp="${n}" data-k="unit" value="${esc(p.unit || "")}" placeholder="${esc(L("unit", "Einheit"))}" aria-label="${esc(L("Unit", "Einheit"))}"><button class="btn ghost sm" data-act="chDelParam" data-n="${n}" title="${esc(L("Remove", "Entfernen"))}">✕</button></div>`;
    return `<article class="chg-card selected" data-sec="${esc(i.sec)}">
      <div class="chg-head"><span></span><div style="min-width:0"><span class="eyebrow">§${esc(i.sec)} · ${L("editing", "bearbeiten")}</span><h3>${esc(i.title)}</h3></div><div>${pill("✎ " + L("editing", "Bearbeitung"), "info")}</div></div>
      <div class="chg-edit">
        <label class="stack" style="gap:4px"><span class="field-label">${L("What kind of change is it?", "Welche Art von Änderung?")}</span><select class="select" id="chType">${Object.entries(CT()).map(([k, [label]]) => `<option value="${k}" ${d.change_type === k ? "selected" : ""}>${esc(label)}</option>`).join("")}</select></label>
        <label class="stack" style="gap:4px"><span class="field-label">${L("In one or two sentences", "In ein, zwei Sätzen")}</span><textarea class="textarea" id="chSummary">${esc(d.summary || "")}</textarea></label>
        <div class="grid-2"><label class="stack" style="gap:4px"><span class="field-label">${L("The rule before", "Die Regel vorher")}</span><textarea class="textarea" id="chOld">${esc(d.old_rule || "")}</textarea></label>
          <label class="stack" style="gap:4px"><span class="field-label">${L("The rule now", "Die Regel jetzt")}</span><textarea class="textarea" id="chNew">${esc(d.new_rule || "")}</textarea></label></div>
        <div class="stack" style="gap:6px"><span class="field-label">${L("Numbers and limits", "Zahlen und Grenzwerte")}</span>
          <div class="prow headrow"><span>${L("Name", "Name")}</span><span>${L("Before", "Vorher")}</span><span>${L("Now", "Jetzt")}</span><span>${L("Unit", "Einheit")}</span><span></span></div>
          <div id="chParams" class="stack" style="gap:6px">${d.parameters.map(prow).join("")}</div>
          <div><button class="btn sm" data-act="chAddParam">+ ${L("Add a number", "Zahl hinzufügen")}</button></div></div>
        <div class="grid-2"><label class="stack" style="gap:4px"><span class="field-label">${L("Evidence from the new text (one sentence per line, copied exactly)", "Belege aus dem neuen Text (ein Satz je Zeile, exakt kopiert)")}</span><textarea class="textarea" id="chQNew">${esc((d.quotes_new || []).join("\n"))}</textarea></label>
          <label class="stack" style="gap:4px"><span class="field-label">${L("Evidence from the old text", "Belege aus dem alten Text")}</span><textarea class="textarea" id="chQOld">${esc((d.quotes_old || []).join("\n"))}</textarea></label></div>
        <label class="row" style="gap:8px"><input type="checkbox" id="chFormula" ${d.formula_changed ? "checked" : ""}> ${L("The way a value is calculated changes", "Die Berechnung eines Wertes ändert sich")}</label>
      </div>
      <div class="chg-actions"><span class="muted" style="font-size:var(--fs-xs)">${L("Evidence is re-checked against the specification when you save.", "Belege werden beim Speichern erneut gegen die Spezifikation geprüft.")}</span>
        <div class="row"><button class="btn ghost" data-act="chCancel">${L("Cancel", "Abbrechen")}</button><button class="btn" data-act="chSave">${L("Save", "Speichern")}</button><button class="btn ok primary" data-act="chSave" data-approve="1">✓ ${L("Save and approve", "Speichern und freigeben")}</button></div></div>
    </article>`;
  }
  function readChDraft() {
    const d = P.chDraft, g = id => document.getElementById(id);
    if (!d) return;
    d.change_type = g("chType").value; d.summary = g("chSummary").value; d.old_rule = g("chOld").value; d.new_rule = g("chNew").value;
    const lines = id => g(id).value.split("\n").map(s => s.trim()).filter(Boolean);
    d.quotes_new = lines("chQNew"); d.quotes_old = lines("chQOld"); d.formula_changed = g("chFormula").checked;
    document.querySelectorAll("[data-cp]").forEach(inp => { d.parameters[Number(inp.dataset.cp)][inp.dataset.k] = inp.value; });
  }
  function paintChanges() { if (onScreen("pipechanges") && !P.chEdit && !editing()) rerender(); else A.renderShell(); }
  async function decide(secs, decision) {
    try {
      await api(`/api/runs/${encodeURIComponent(P.runId)}/decide`, { body: { secs, decision: decision || null } });
      A.log("examiner", decision === "approved" ? L("Spec change approved", "Änderung freigegeben") : decision === "declined" ? L("Spec change declined", "Änderung abgelehnt") : L("Decision undone", "Entscheidung zurückgenommen"), secs.map(s => "§" + s).join(", "));
      await pollRun(true); rerender();
    } catch (e) { A.toast(e.message); }
  }

  /* ---------- screens, actions, events ---------- */
  const at = id => A.SCREENS.findIndex(s => s.id === id);
  A.SCREENS.splice(at("ingest") + 1, 0, { id: "pipeline", group: "spec", step: null, icon: "ai", roles: ["itsg"], t: () => L("AI test pipeline", "KI-Testpipeline"),
    badge: () => P.run && P.run.status === "running" ? { n: "●", hot: true } : null });
  A.SCREENS.splice(at("pipeline") + 1, 0, { id: "pipechanges", group: "spec", step: null, icon: "check", roles: ["itsg"], t: () => L("Review changes", "Änderungen prüfen"),
    badge: () => { const n = waiting().length; return n ? { n, hot: true } : null; } });
  A.SCREENS.splice(at("tests") + 1, 0, { id: "review", group: "tests", step: null, icon: "check", roles: ["itsg"], t: () => L("Test-case review", "Testfall-Prüfung"),
    badge: () => { const n = P.cases.filter(c => c.status === "draft").length; return n ? { n, hot: true } : null; } });
  A.SCREENS.push({ id: "devinbox", group: "dev", step: null, icon: "inbox", roles: ["dev"], t: () => L("Test cases from ITSG", "Testfälle von ITSG"),
    badge: () => { const n = P.inbox.filter(t => !t.my_ack && !P.seenInbox.includes(t.id)).length; return n ? { n, hot: true } : null; } });
  A.SCREENS.splice(at("devinbox"), 0,
    { id: "devchecklist", group: "dev", step: null, icon: "check", roles: ["dev"], t: () => L("Checklist", "Checkliste"),
      badge: () => { const n = (P.checklists || []).reduce((a, c) => a + c.rows.length - coveredN(c), 0); return n ? { n, hot: true } : null; } },
    { id: "devresults", group: "dev", step: null, icon: "report", roles: ["dev"], t: () => L("Results", "Ergebnisse"),
      badge: () => { const n = (P.results || []).filter(r => r.verdict === "fail").length; return n ? { n, hot: true } : null; } });
  A.SCREENS.splice(at("audit"), 0, { id: "validation", group: "cert", step: null, icon: "check", roles: ["itsg"], t: () => L("Test validation", "Testvalidierung"),
    badge: () => { const n = (P.subs || []).filter(s => s.status === "submitted").length; return n ? { n, hot: true } : null; } });
  A.GROUPS.dev = () => L("Developer", "Entwicklung");
  Object.assign(A.RENDER, { pipeline: vPipeline, pipechanges: vChanges, review: vReview, devinbox: vDevInbox, devchecklist: vChecklist, devresults: vResults, validation: vValidation });

  Object.assign(A.ACT, {
    chFilter: el => { P.chFilter = el.dataset.f; rerender(); },
    chDecide: el => decide([el.dataset.sec], el.dataset.d),

    if (t.id === "chSelAll") { const f = P.chFilter; (P.run ? P.run.items : []).filter(i => i.status === "review" && (f === "all" || chState(i) === f)).forEach(i => t.checked ? P.chSel.add(i.sec) : P.chSel.delete(i.sec)); rerender(); }
    else if (t.dataset && t.dataset.chsel) { if (t.checked) P.chSel.add(t.dataset.chsel); else P.chSel.delete(t.dataset.chsel); rerender(); }

    else if (t.dataset && t.dataset.selall) { const f = P.caseFilter; P.cases.filter(c => c.status !== "rejected" && (f === "all" || c.status === f || (f === "changed" && c.formula_changed))).forEach(c => t.checked ? P.sel.add(c.id) : P.sel.delete(c.id)); rerender(); }

  /* ---------- session: sign in as ITSG or Developer ---------- */

    subs: [], selSub: null, subDetail: null, subReveal: 0, subVerdicts: {}, dismissed: store.get("dismissed", []) });

  /* ---------- notifications ---------- */
  function notifications() {

      P.checklists.filter(c => !coveredN(c)).forEach(c => out.push({ key: "pkg:" + c.id, kind: "new", go: "devchecklist", sel: c.id,

  function paintNotify() {

  /* ---------- developer: checklist ---------- */

  const coveredN = c => c.rows.filter(r => (c.covered || {})[r.id]).length;

  function vChecklist() {

    const fresh = P.checklists.filter(x => !coveredN(x)), earlier = P.checklists.filter(x => coveredN(x));
    const list = P.checklists.length ? (fresh.length ? `<div class="list-group">${L("New from ITSG", "Neu von ITSG")}</div>${fresh.map(item).join("")}` : "")

  async function rewriteRecap(id) {

  async function setCovered(id, done) {
    const c = P.checklists.find(x => x.id === P.selPkg); if (!c) return;

    if (done) c.covered[id] = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 19); else delete c.covered[id];
    rerender();
    try { c.covered = await api(`/api/checklists/${encodeURIComponent(c.id)}/coverage`, { body: { id, done } }); A.renderShell(); paintNotify(); }
    catch (e) { A.toast(e.message); loadChecklists(); }

  function vResults() {
    const r = P.results, passed = r.filter(x => x.verdict === "pass").length, failed = r.length - passed;
    const last = r.length ? r.reduce((a, b) => (a.t > b.t ? a : b)).t : null;
    const rows = r.slice().sort((a, b) => (a.verdict === b.verdict ? (b.t > a.t ? 1 : -1) : a.verdict === "fail" ? -1 : 1));
    return `${head(L("Results", "Ergebnisse"), L("Your last tested cases as validated by ITSG. Failed tests come first: compare your value with the value ITSG verified for this spec version.", "Ihre zuletzt getesteten Fälle, von ITSG validiert. Nicht bestandene zuerst: Ihren Wert mit dem für diese Spezifikationsversion verifizierten Wert vergleichen."), `<button class="btn" data-act="pipeRefreshDev">↻ ${L("Refresh", "Aktualisieren")}</button>`)}

      <section class="panel"><div class="panel-body flush tbl-wrap">${rows.length ? `<table class="tbl" id="resTable"><thead><tr><th>${L("Result", "Ergebnis")}</th><th>${L("Test case", "Testfall")}</th><th>${L("Your value", "Ihr Wert")}</th><th>${L("ITSG value", "ITSG-Wert")}</th><th>${L("Comment", "Kommentar")}</th><th>${L("Validated", "Validiert")}</th></tr></thead><tbody>
        ${rows.map(x => `<tr><td>${x.verdict === "pass" ? pill("✓ " + L("passed", "bestanden"), "ok") : pill("✕ " + L("failed", "nicht bestanden"), "bad")}</td><td><b>${esc(x.title)}</b><div class="muted mono" style="font-size:11px">${esc(x.id)} · §${esc(x.section)}${x.version ? " · v" + esc(x.version) : ""}</div></td><td class="mono">${esc(x.value || "—")}</td><td class="mono">${esc(x.expected)}</td><td>${esc(x.comment || "")}</td><td class="muted" style="font-size:var(--fs-xs)">${esc(x.validated_by)}<br>${esc((x.t || "").replace("T", " ").slice(0, 16))}</td></tr>`).join("")}</tbody></table>`
        : `<div class="empty">${L("No validated results yet. They appear here once ITSG has validated a checklist you submitted.", "Noch keine validierten Ergebnisse. Sie erscheinen, sobald ITSG eine eingereichte Checkliste validiert hat.")}</div>`}</div></section>`;

  /* ---------- ITSG: test validation ---------- */
  async function loadSubs() {
    if (!P.online || S.role !== "itsg") return;
    try {
      P.subs = await api("/api/submissions");
      if (onScreen("validation") && !editing() && !P.subDetail) rerender(); else { A.renderShell(); paintNotify(); }
    } catch (e) { /* offline */ }
  }
  async function openSub(id, withExpected) {
    P.selSub = id;
    dismiss("sub:" + id);
    try { P.subDetail = await api(`/api/submissions/${encodeURIComponent(id)}${withExpected ? "?expected=1" : ""}`); } catch (e) { A.toast(e.message); return; }
    const fetched = P.subDetail.rows.some(r => r.expected !== undefined);
    P.subReveal = fetched && !withExpected ? P.subDetail.rows.length : 0;
    P.subVerdicts = Object.fromEntries(P.subDetail.rows.map(r => [r.id, { verdict: r.verdict || r.auto_verdict, comment: r.comment || "" }]));
    if (S.screen !== "validation") A.go("validation"); else rerender();
    if (withExpected) revealRows();
  }
  function revealRows() {  // fetched values appear row by row, so the comparison is visible in the demo
    if (!P.subDetail || P.subReveal >= P.subDetail.rows.length) { rerender(); return; }
    P.subReveal++; rerender();
    setTimeout(revealRows, 350);
  }
  function vValidation() {
    if (P.online === false) return `${head(L("Test validation", "Testvalidierung"), "")}${docsInner()}`;
    const list = P.subs.length ? P.subs.map(s => `<button class="list-item" data-act="pipeOpenSub" data-id="${esc(s.id)}" aria-selected="${s.id === P.selSub}"><span class="mono muted" style="font-size:11px">${esc(s.id)} · ${esc((s.t || "").replace("T", " ").slice(0, 16))}</span><b style="font-size:var(--fs-sm)">${esc(s.by)} · ${s.n} ${L("values", "Werte")}</b><div class="row" style="gap:4px">${s.status === "validated" ? pill("✓ " + L("validated", "validiert"), "ok") : pill(L("to validate", "zu validieren"), "accent")}${pill(esc(s.package), "mono")}</div></button>`).join("")
      : `<div class="empty">${L("No developer results yet.", "Noch keine Entwicklerergebnisse.")}</div>`;
    return `${head(L("Test validation", "Testvalidierung"), L("Developers ran the test cases in their payroll program and sent back the values it calculated. Fetch the values verified for this spec version and confirm each result; the verdicts go back to the developer.", "Entwickler haben die Testfälle in ihrem Abrechnungsprogramm ausgeführt und die berechneten Werte zurückgesendet. Die für diese Spezifikationsversion verifizierten Werte abrufen und jedes Ergebnis bestätigen; die Bewertungen gehen an den Entwickler zurück."), `<button class="btn" data-act="pipeRefreshSubs">↻ ${L("Refresh", "Aktualisieren")}</button>`)}
      <div class="split wide"><section class="panel"><div class="panel-head"><h4>${L("Submissions", "Einreichungen")}</h4></div><div class="panel-body flush">${list}</div></section>
      <div class="stack">${P.subDetail ? validationTable(P.subDetail) : `<section class="panel"><div class="empty">${L("Select a submission.", "Einreichung auswählen.")}</div></section>`}</div></div>`;
  }
  function validationTable(s) {
    const done = s.status === "validated", fetched = s.rows.some(r => r.expected !== undefined);
    const version = [...new Set(s.rows.map(r => r.version).filter(Boolean))].join(", ");
    const rows = s.rows.map((r, i) => {
      const shown = fetched && i < P.subReveal, v = P.subVerdicts[r.id] || {};
      const verdictCell = !shown ? `<span class="muted">—</span>` : done ? (r.verdict === "pass" ? pill("✓ pass", "ok") : pill("✕ fail", "bad"))
        : `<select class="select" data-verdict="${esc(r.id)}" style="min-width:96px"><option value="pass" ${v.verdict === "pass" ? "selected" : ""}>✓ pass</option><option value="fail" ${v.verdict === "fail" ? "selected" : ""}>✕ fail</option></select>`;
      return `<tr class="${shown ? (r.auto_verdict === "pass" ? "" : "row-fail") : ""}"><td class="mono muted">${i + 1}</td><td><b>${esc(r.title)}</b><div class="muted mono" style="font-size:11px">${esc(r.id)} · §${esc(r.section)}</div></td>
        <td><span class="mono">${esc(r.result_name || "")}</span></td><td class="mono"><b>${esc(r.value || "—")}</b>${r.note ? `<div class="muted" style="font-size:11px">${esc(r.note)}</div>` : ""}</td>
        <td class="mono">${shown ? `<b>${esc(r.expected)}</b><div class="muted" style="font-size:11px">${L("verified by", "verifiziert von")} ${esc(r.verified_by || "—")}</div>` : `<span class="muted">${L("not fetched", "nicht abgerufen")}</span>`}</td>
        <td>${shown ? (r.auto_verdict === "pass" ? pill("= " + L("match", "gleich"), "ok") : pill("≠ " + L("differs", "abweichend"), "bad")) : ""}</td><td>${verdictCell}</td>
        <td>${done ? esc(r.comment || "") : `<input class="input" data-vcomment="${esc(r.id)}" value="${esc(v.comment || "")}" ${shown ? "" : "disabled"}>`}</td></tr>`; }).join("");
    return validationShell(s, done, fetched, version, rows);
  }
  function validationShell(s, done, fetched, version, rows) {
    const all = fetched && P.subReveal >= s.rows.length;
    const pass = s.rows.filter(r => (P.subVerdicts[r.id] || {}).verdict === "pass").length;
    return `<section class="panel"><div class="panel-head"><div class="stack" style="gap:2px"><span class="eyebrow">${esc(s.id)} · ${esc(s.package)} · ${esc((s.t || "").replace("T", " ").slice(0, 16))}</span><h3>${L("Results from", "Ergebnisse von")} ${esc(s.by)}</h3></div>${done ? pill("✓ " + L("validated", "validiert"), "ok") : pill(L("to validate", "zu validieren"), "accent")}</div>
      <div class="panel-body"><div class="row between">${fetched ? `<span class="muted" style="font-size:var(--fs-sm)">${L("Expected values verified for version", "Verifizierte Erwartungswerte für Version")} <b>${esc(version || "?")}</b></span>` : `<span class="muted" style="font-size:var(--fs-sm)">${L("The developer's values are shown. Fetch the values ITSG verified for", "Die Werte des Entwicklers werden angezeigt. Die von ITSG verifizierten Werte abrufen für")} v${esc(version || "?")}.</span>`}
        ${fetched ? "" : `<button class="btn primary" id="valFetch" data-act="pipeFetchExpected">${ic("download")} ${L("Fetch expected values", "Erwartungswerte abrufen")} (v${esc(version || "?")})</button>`}</div></div>
      <div class="panel-body flush tbl-wrap"><table class="tbl" id="valTable"><thead><tr><th>#</th><th>${L("Test case", "Testfall")}</th><th>${L("Value", "Wert")}</th><th>${L("Developer", "Entwickler")}</th><th>${L("Expected", "Erwartet")}</th><th>${L("Check", "Prüfung")}</th><th>${L("Verdict", "Bewertung")}</th><th>${L("Comment", "Kommentar")}</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${done ? `<div class="panel-body"><div class="callout ok"><b>${L("Shared with", "Geteilt mit")} ${esc(s.by)}</b>${s.validation.passed} ${L("passed", "bestanden")} · ${s.validation.failed} ${L("failed", "nicht bestanden")} · ${esc(s.validation.by)} · ${esc((s.validation.t || "").replace("T", " ").slice(0, 16))}</div></div>`
        : all ? `<div class="panel-body"><div class="row between"><span style="font-size:var(--fs-sm)"><b>${pass}</b> ${L("pass", "bestanden")} · <b>${s.rows.length - pass}</b> ${L("fail", "nicht bestanden")}</span><button class="btn primary" id="valConfirm" data-act="pipeValidate">✓ ${L("Confirm & share results with", "Bestätigen & teilen mit")} ${esc(s.by)}</button></div></div>` : ""}</section>`;
  }
  async function confirmValidation() {
    const s = P.subDetail; if (!s) return false;
    try {
      const rows = s.rows.map(r => ({ id: r.id, ...(P.subVerdicts[r.id] || {}) }));
      P.subDetail = await api(`/api/submissions/${encodeURIComponent(s.id)}/validate`, { body: { rows } });
      A.log("examiner", L("Developer results validated", "Entwicklerergebnisse validiert"), `${s.id} (${s.by}): ${P.subDetail.validation.passed} pass · ${P.subDetail.validation.failed} fail`);
      A.toast(L("Results shared with ", "Ergebnisse geteilt mit ") + s.by);
      dismiss("sub:" + s.id);
      await loadSubs(); rerender(); return true;
    } catch (e) { A.toast(e.message); return false; }
  }

  /* ---------- developer demo (the Demo button while signed in as a developer) ---------- */
  const DEV = { idx: -1, pkg: null };
  function devSteps() {
    return [
      { sel: "#notifyHost .notify", title: L("New test cases from ITSG", "Neue Testfälle von ITSG"),
        body: L("ITSG verified new test cases for spec version 13.4 and sent them to you. A notification appears — click it to open your checklist.", "ITSG hat neue Testfälle für Version 13.4 verifiziert und an Sie gesendet. Eine Benachrichtigung erscheint — Klick öffnet die Checkliste."),
        before: async () => { A.go("devchecklist"); const pkg = await api("/api/demo", { body: { user: P.user } }); DEV.pkg = pkg.id; await loadChecklists(); P.dismissed = P.dismissed.filter(k => k !== "pkg:" + pkg.id); paintNotify(); },
        next: async () => openNotify("pkg:" + DEV.pkg, "devchecklist", DEV.pkg) },
      { sel: "#clRecap", title: L("AI recap: what changed, what to do", "KI-Zusammenfassung: was sich geändert hat, was zu tun ist"),
        body: L("Before you start, the AI briefs you: what changed in the spec, the steps to work through the checklist, and what your program must get right. It is written from the test cases only, so it never gives away ITSG's expected values.", "Vor dem Start fasst die KI zusammen: was sich in der Spezifikation geändert hat, die Schritte durch die Checkliste und was Ihr Programm richtig machen muss. Sie stützt sich nur auf die Testfälle und verrät nie die Erwartungswerte von ITSG."),
        before: async () => recapReady(DEV.pkg) },
      { sel: "#clTable", title: L("One row per test case", "Eine Zeile pro Testfall"),
        body: L("Each row is one test case with a one-line AI note on what it checks and the value your program must get right. Open “How to run it” for the set-up and the steps in your payroll program.", "Jede Zeile ist ein Testfall mit einer KI-Notiz, was er prüft, und dem Wert, den Ihr Programm richtig berechnen muss. „Durchführung“ öffnen für Vorbedingungen und Schritte im Abrechnungsprogramm."),
        before: async () => { const d = document.querySelector("#clTable details"); if (d) d.open = true; } },
      { sel: "#clTable", title: L("Tick what you have tested", "Abhaken, was getestet ist"),
        body: L("Once you have covered a case in your program, tick it. The demo ticks the first three. A tick only tracks that you tested the case — it says nothing about pass or fail.", "Sobald ein Fall im Programm abgedeckt ist, abhaken. Die Demo hakt die ersten drei ab. Ein Haken heißt nur, dass der Fall getestet ist — nicht, ob er bestanden hat."),
        before: async () => tickDemo(3) },
      { sel: "#clProgress", title: L("Keep track of what is open", "Den Überblick behalten"),
        body: L("The progress bar and the list on the left show how far you are with each package. Your ticks are saved under your name, so they are still there the next time you sign in.", "Fortschrittsbalken und Liste links zeigen, wie weit Sie mit jedem Paket sind. Ihre Haken werden unter Ihrem Namen gespeichert und sind bei der nächsten Anmeldung noch da."),
        finish: L("Done", "Fertig") }
    ];
  }
  function openNotify(key, go, sel) {
    dismiss(key);
    if (go === "devchecklist" || go === "devresults") { P.selPkg = sel; if (go === "devresults") loadResults().then(rerender); A.go(go); }
    else if (go === "validation") { P.subDetail = null; P.subReveal = 0; openSub(sel); }
  }
  async function tickDemo(n) {
    const c = P.checklists.find(x => x.id === DEV.pkg); if (!c) return;
    for (const r of c.rows.slice(0, n)) {
      await setCovered(r.id, true);
      const el = document.querySelector(`[data-cover="${CSS.escape(r.id)}"]`); if (el) el.closest("tr").classList.add("flash-row");
      await new Promise(ok => setTimeout(ok, 500));

  }
  function devCard() {
    const steps = devSteps(), s = steps[DEV.idx], last = DEV.idx === steps.length - 1;
    document.getElementById("tourHost").innerHTML = `<div class="tour-spot" id="devSpot"></div><div class="tour-card" role="dialog" aria-live="polite">
      <div class="tour-progress">${steps.map((_, i) => `<i class="${i <= DEV.idx ? "on" : ""}"></i>`).join("")}</div>
      <span class="eyebrow">${L("Developer demo", "Entwickler-Demo")} · ${DEV.idx + 1} / ${steps.length}</span><h3>${s.title}</h3><p>${s.body}</p>
      <div class="row between"><span></span><div class="actions"><button class="btn sm ghost" data-act="devEnd">${L("End", "Ende")}</button><button class="btn sm primary" data-act="devNext" id="devNextBtn">${last ? s.finish : L("Next", "Weiter")}</button></div></div></div>`;
  }
  function devSpot() {
    const s = devSteps()[DEV.idx], el = s && document.querySelector(s.sel), sp = document.getElementById("devSpot");
    if (!sp) return;
    if (!el) { sp.style.opacity = "0"; return; }
    el.scrollIntoView({ block: "center" });
    setTimeout(() => { const r = el.getBoundingClientRect(); Object.assign(sp.style, { opacity: "1", left: Math.max(4, r.left - 6) + "px", top: Math.max(4, r.top - 6) + "px", width: Math.min(innerWidth - 8, r.width + 12) + "px", height: Math.min(innerHeight - 8, r.height + 12) + "px" }); }, 250);
  }
  let devBusy = false;
  async function devShow(i) {
    const steps = devSteps();
    if (i >= steps.length) return devEnd();
    DEV.idx = i; devBusy = true;
    devCard();
    const btn = document.getElementById("devNextBtn"); if (btn) btn.disabled = true;
    try { if (steps[i].before) await steps[i].before(); } catch (e) { A.toast(e.message); }
    devCard(); devSpot(); devBusy = false;
  }
  async function devNext() {
    if (devBusy) return;
    const s = devSteps()[DEV.idx];
    devBusy = true;
    try { if (s.next && (await s.next()) === false) { devBusy = false; return; } } catch (e) { A.toast(e.message); }
    devBusy = false;
    setTimeout(() => devShow(DEV.idx + 1), 150);
  }
  function devEnd(toItsg) {
    DEV.idx = -1;
    document.getElementById("tourHost").innerHTML = "";
    if (toItsg === true) logout("istg");
  }
  function devStart() {
    if (!P.online) { A.toast(L("The demo needs the pipeline server (python pipeline/server.py)", "Die Demo braucht den Pipeline-Server (python pipeline/server.py)")); return; }
    devShow(0);
  }
  function afterRender() {
    if (S.screen === "pipeline") paintRun(false);
    if (S.screen === "review" && P.selCase && !P.caseDetail) openCase(P.selCase);
    if (S.screen === "validation" && P.selSub && !P.subDetail) openSub(P.selSub);
    paintNotify();
  }
  function init() {
    if (A.IS_PRESENTER) return;
    // deep links, e.g. ?role=dev&user=Kim or ?run=<id>#pipeline or ?case=<id>#review
    const q = new URLSearchParams(location.search);
    if (["itsg", "dev"].includes(q.get("role"))) P.session = { role: q.get("role"), user: q.get("user") || (q.get("role") === "dev" ? "dev" : "istg") };
    if (q.get("run")) { P.runId = q.get("run"); store.set("pipeRun", P.runId); }
    if (q.get("sub")) { P.selSub = q.get("sub"); P.openSubFetch = q.get("fetch") === "1"; S.screen = "validation"; }
    if (q.get("case")) { if (P.session && P.session.role === "dev") P.selInbox = q.get("case"); else P.selCase = q.get("case"); }
    // the Demo button (and the D key) runs the developer demo when signed in as a developer
    const itsgStart = TOUR.start;
    TOUR.start = () => (S.role === "dev" ? devStart() : itsgStart());
    window.addEventListener("keydown", e => { if (S.role === "dev" && (e.key === "d" || e.key === "D") && !e.target.matches("input, textarea, select")) { e.stopImmediatePropagation(); if (DEV.idx < 0) devStart(); } }, true);
    if (P.session) { P.user = P.session.user; store.set("session", P.session); S.role = P.session.role; store.set("role", S.role); A.render(); } else { P.user = ""; loginGate(); }
    shell();
    connect().then(() => {
      refreshSession();
      if (P.selSub && S.role === "itsg") openSub(P.selSub, P.openSubFetch);
      if (P.selInbox && S.role === "dev") openInbox(P.selInbox); else if (P.selCase && S.role === "itsg") openCase(P.selCase);
    });
    setInterval(() => { if (P.online === false) connect(); }, 5000);
    setInterval(() => pollRun(false), 1000);
    setInterval(() => {
      if (!P.online || !P.session) return;
      if (S.role === "dev") { loadChecklists(); loadResults(); }
      else if (S.role === "itsg") { loadSubs(); if (!onScreen("review")) loadCases(); }
    }, 5000);
    register();
  }
  return { init, upload, testButton, docsBlock, afterRender, shell, onRole, P, evHtml };
})();
window.PIPE = PIPE;

window.TOUR = TOUR;
APP.init();
TOUR.init();
PIPE.init();

</script>
