  /* ---------- live extraction via hessian.AI (OpenAI-compatible) ---------- */
  async function runLive(rule) {
    const key = store.get("aikey", "");
    const fn = C.FN[rule.fn];
    const secs = [rule.sec, ...C.SPEC.sections[rule.sec].links.filter(l => C.SPEC.sections[l])];
    const context = secs.map(s => `§${s} ${C.SPEC.sections[s].title}\n${C.sectionText(s)}`).join("\n\n");
    const tool = { type: "function", function: { name: "extract_rule_parameters", description: "Return the parameters of the pre-written rule function for this spec section. Every parameter needs a verbatim quote copied character for character from the section text.", parameters: { type: "object", properties: { function_id: { type: "string", enum: Object.keys(C.FN) }, params: { type: "object", properties: Object.fromEntries(Object.entries(fn.schema).map(([k, s]) => [k, { type: "number", description: `${s.unit}` }])) }, quotes: { type: "object", properties: Object.fromEntries(Object.keys(fn.schema).map(k => [k, { type: "string" }])) } }, required: ["function_id", "params", "quotes"] } } };
    const body = { model: S.ai.model, temperature: 0, messages: [{ role: "system", content: "You extract numeric parameters from German social-insurance specifications. Never compute results. Quote the source sentence fragment verbatim (copy exactly). Answer only via the tool." }, { role: "user", content: `Function: ${rule.fn} — ${fn.title.en}\nParameters needed: ${Object.keys(fn.schema).join(", ")}\n\nSpecification (only this section and its direct links):\n${context}` }], tools: [tool], tool_choice: { type: "function", function: { name: "extract_rule_parameters" } } };
    const headers = { "Content-Type": "application/json" };
    if (key) headers.Authorization = "Bearer " + key;
    const res = await fetch(S.ai.base.replace(/\/$/, "") + "/chat/completions", { method: "POST", headers, body: JSON.stringify(body) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json(), msg = j.choices && j.choices[0] && j.choices[0].message;
    let args = msg && msg.tool_calls && msg.tool_calls[0] ? msg.tool_calls[0].function.arguments : (msg && msg.content) || "";
    if (typeof args === "string") { const m = args.match(/\{[\s\S]*\}/); args = JSON.parse(m ? m[0] : args); }
    return { params: args.params || {}, quotes: args.quotes || {}, function_id: args.function_id };
  }

  /* ---------- PDF ingestion via pdf.js (optional CDN extra) ---------- */
  function loadPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    return new Promise((ok, fail) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload = () => { try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; ok(window.pdfjsLib); } catch (e) { fail(e); } };
      s.onerror = () => fail(new Error("pdf.js could not be loaded"));
      document.head.appendChild(s);
    });
  }
  async function ingestPdf(file) {
    const status = $("#pdfStatus");
    const say = h => { if (status) status.innerHTML = h; };
    say(`<div class="callout">${L("Loading pdf.js…", "Lade pdf.js…")}</div>`);
    try {
      const lib = await loadPdfJs();
      const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
      let links = 0, text = "", version = null;
      const heads = new Map();
      for (let p = 1; p <= doc.numPages; p++) {
        const page = await doc.getPage(p);
        const tc = await page.getTextContent();
        const t = tc.items.map(i => i.str + (i.hasEOL ? "\n" : " ")).join("");
        text += t + "\n";
        (t.match(/^\s*(\d+\.\d+(?:\.\d+){0,3})\s+[A-ZÄÖÜ„"].{3,80}$/gm) || []).forEach(h => { const m = h.trim().match(/^(\d+(?:\.\d+)+)\s+(.*)$/); if (m && !heads.has(m[1])) heads.set(m[1], { title: m[2].replace(/\.{3,}.*$/, "").trim(), page: p }); });
        const ann = await page.getAnnotations();
        links += ann.filter(a => a.subtype === "Link" && (a.dest || a.action === "GoTo" || (a.url == null && !a.unsafeUrl))).length;
        if (p % 10 === 0) say(`<div class="callout">${L("Reading page", "Lese Seite")} ${p} / ${doc.numPages} · ${heads.size} § · ${links} ${L("links", "Links")}</div>`);
      }
      const vm = text.match(/Version\s+(\d+\.\d+)/); version = vm ? vm[1] : null;
      const logRefs = (text.match(/(?:Änderungsübersicht|Änderungshistorie)[\s\S]{0,20000}/) || [""])[0].match(/\d+(?:\.\d+)+\s+[„"]/g) || [];
      S.ingested.push({ name: file.name, pages: doc.numPages, sections: heads.size, links, version });
      log("system", L("PDF ingested", "PDF eingelesen"), `${file.name}: ${doc.numPages} p, ${heads.size} §, ${links} links`);
      render();
      say(`<div class="callout ok"><b>${esc(file.name)}</b>${doc.numPages} ${L("pages", "Seiten")} · ${heads.size} ${L("numbered headings", "nummerierte Überschriften")} · ${fmtN(links)} ${L("internal links", "interne Links")} · ${L("version", "Version")} ${version || "?"} · ${logRefs.length} ${L("§ references in the change log", "§-Verweise im Änderungsprotokoll")}<span class="muted mono" style="font-size:11px">${[...heads.entries()].slice(0, 12).map(([k, v]) => `${k} ${esc(v.title)} (p. ${v.page})`).join(" · ")}${heads.size > 12 ? " …" : ""}</span></div>`);
    } catch (e) {
      say(`<div class="callout bad"><b>${L("Could not read the PDF here", "PDF konnte hier nicht gelesen werden")}</b>${esc(e.message)}. ${L("pdf.js needs the CDN. The pre-indexed v13.4 stays available.", "pdf.js braucht das CDN. Der vorindizierte Stand v13.4 bleibt verfügbar.")}</div>`);
    }
  }

    runLive: async () => {

      const rule = C.RULES.find(r => r.id === S.selRule);

      const id = el.dataset.rule, st = S.rules[id], rule = C.RULES.find(r => r.id === id);

      document.querySelectorAll(`[id^="edit-${id}-"]`).forEach(inp => { const k = inp.dataset.param, v = Number(inp.value); if (v !== rule.runA.params[k]) edits[k] = v; });

      const r0 = el.getBoundingClientRect(), mr = main.getBoundingClientRect();
      main.style.transformOrigin = `${r0.left + r0.width / 2 - mr.left}px ${r0.top + r0.height / 2 - mr.top}px`;
      main.style.transform = zoom === 1 ? "" : `scale(${zoom})`;
      setTimeout(() => { const r = el.getBoundingClientRect(); Object.assign(sp.style, { opacity: "1", left: Math.max(4, r.left - 6) + "px", top: Math.max(4, r.top - 6) + "px", width: Math.min(innerWidth - 8, r.width + 12) + "px", height: Math.min(innerHeight - 8, r.height + 12) + "px" }); }, reduce ? 0 : 620);
    }, reduce ? 0 : 420);
  }
  function show(i) {
    if (i < 0 || i >= STEPS.length) return end();
    idx = i;
    const s = STEPS[idx];
    $("#main").style.transform = "";
    if (s.screen !== "overview" || !s.after || s.sel !== "#drawer") A.closeDrawer();
    if (s.before) s.before();
    A.go(s.screen);
    card();
    setTimeout(() => { if (s.after) s.after(); spot(); }, 120);
    send(state());
  }
  function start() { if (idx < 0) A.log("system", L("Guided demo started", "Geführte Demo gestartet"), ""); show(0); }
  function end() { idx = -1; host().innerHTML = ""; $("#main").style.transform = ""; send(state()); }
  function refresh() { if (idx >= 0) { card(); spot(); send(state()); } }
  function openPresenter() {
    try { presenter = window.open(location.href.split("#")[0] + "#presenter", "eelra-presenter", "width=980,height=720"); } catch (e) { presenter = null; }
    if (!presenter) { presenterBlocked = true; A.toast(L("Presenter window blocked here — notes shown in the demo card.", "Referentenfenster hier blockiert — Notizen in der Demo-Karte.")); if (idx < 0) start(); else refresh(); return; }
    setTimeout(() => send(state()), 800);
  }

  /* ---------- presenter window ---------- */
  function presenterView() {
    document.body.innerHTML = `<div class="presenter" id="pv"></div>`;
    let cur = -1, lang = "en", t0 = Date.now();
    const tl = (o) => o ? (o[lang] || o.en) : "";
    const draw = () => {
      const s = STEPS[cur], n = STEPS[cur + 1];
      const el = Math.floor((Date.now() - t0) / 1000);
      document.getElementById("pv").innerHTML = `<div class="row between"><div class="stack" style="gap:2px"><span class="eyebrow">${lang === "de" ? "Referentenansicht" : "Presenter view"} · EEL Review Assistant</span><h2>${s ? `${cur + 1} / ${STEPS.length} · ${tl(s.title)}` : (lang === "de" ? "Demo noch nicht gestartet" : "Demo not started")}</h2></div><div class="clock" id="pvClock">${String(Math.floor(el / 60)).padStart(2, "0")}:${String(el % 60).padStart(2, "0")}</div></div>
        <div class="row"><button class="btn" data-cmd="prev">◀ ${lang === "de" ? "Zurück" : "Back"}</button><button class="btn primary" data-cmd="${cur < 0 ? "start" : "next"}">${cur < 0 ? (lang === "de" ? "Demo starten" : "Start demo") : (lang === "de" ? "Weiter" : "Next")} ▶</button><button class="btn" data-cmd="reset">${lang === "de" ? "Uhr zurücksetzen" : "Reset clock"}</button><button class="btn ghost" data-cmd="end">${lang === "de" ? "Beenden" : "End"}</button></div>
        <div class="stack">${s ? `<p style="font-size:1.1rem;color:var(--muted)">${tl(s.body)}</p><ul class="notes">${tl(s.notes).map(x => `<li>${x}</li>`).join("")}</ul>` : `<p class="notes">${lang === "de" ? "Im Hauptfenster „Demo“ klicken oder hier starten." : "Click “Demo” in the main window or start here."}</p>`}</div>
        <div class="next">${n ? `<b>${lang === "de" ? "Als Nächstes" : "Next"}:</b> ${tl(n.title)}` : (lang === "de" ? "Letzter Schritt" : "Last step")}</div>`;
    };
    const cmd = c => { const msg = { type: "cmd", cmd: c }; try { if (window.opener) window.opener.postMessage(msg, "*"); } catch (e) { /* ignore */ } try { if (chan) chan.postMessage(msg); } catch (e) { /* ignore */ } };
    const onMsg = d => { if (d && d.type === "tour") { cur = d.idx; lang = d.lang || lang; draw(); } };
    window.addEventListener("message", e => onMsg(e.data));
    if (chan) chan.onmessage = e => onMsg(e.data);
    document.addEventListener("click", e => { const b = e.target.closest("[data-cmd]"); if (!b) return; if (b.dataset.cmd === "reset") { t0 = Date.now(); draw(); return; } cmd(b.dataset.cmd); });
    document.addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); cmd("next"); } if (e.key === "ArrowLeft") cmd("prev"); });
    setInterval(() => { const c = document.getElementById("pvClock"); if (c) { const el = Math.floor((Date.now() - t0) / 1000); c.textContent = `${String(Math.floor(el / 60)).padStart(2, "0")}:${String(el % 60).padStart(2, "0")}`; } }, 1000);
    draw();
    cmd("hello");
  }

  /* ---------- wiring ---------- */
  function onCmd(d) {
    if (!d || d.type !== "cmd") return;
    if (d.cmd === "next") idx < 0 ? start() : show(idx + 1);
    else if (d.cmd === "prev") show(Math.max(0, idx - 1));
    else if (d.cmd === "start") start();
    else if (d.cmd === "end") end();
    else if (d.cmd === "hello") send(state());
  }
  function init() {
    if (A.IS_PRESENTER) return presenterView();
    window.addEventListener("message", e => onCmd(e.data));
    if (chan) chan.onmessage = e => onCmd(e.data);
    document.addEventListener("click", e => {
      const b = e.target.closest("[data-tour-act]"); if (!b) return;
      ({ next: () => show(idx + 1), prev: () => show(idx - 1), end, presenter: openPresenter })[b.dataset.tourAct]();
    });
    document.addEventListener("keydown", e => {
      if (e.target.matches("input, textarea, select")) return;
      if (e.key === "p" || e.key === "P") { openPresenter(); return; }
      if ((e.key === "d" || e.key === "D") && idx < 0) { start(); return; }
      if (idx < 0) return;
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); show(idx + 1); }
      else if (e.key === "ArrowLeft") show(idx - 1);
      else if (e.key === "Escape") end();
    });
    window.addEventListener("resize", () => { if (idx >= 0) spot(); });
    window.addEventListener("scroll", () => { if (idx >= 0) { const s = STEPS[idx], el = document.querySelector(s.sel), sp = document.getElementById("tourSpot"); if (el && sp) { const r = el.getBoundingClientRect(); Object.assign(sp.style, { left: Math.max(4, r.left - 6) + "px", top: Math.max(4, r.top - 6) + "px", width: Math.min(innerWidth - 8, r.width + 12) + "px", height: Math.min(innerHeight - 8, r.height + 12) + "px" }); } } }, { passive: true });
  }
  return { start, end, refresh, spot, init, STEPS };
})();
window.TOUR = TOUR;
APP.init();
TOUR.init();

</script>
