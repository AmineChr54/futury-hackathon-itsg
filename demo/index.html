<title>EEL Review Assistant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Demo: AI-assisted system review for income replacement benefits (DTA EEL), built for the ITSG challenge at Futury Build Days 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: sticky top bar · left pipeline rail (the nav IS the pipeline) · working canvas · right provenance drawer.
   Design tokens below are the single source of truth (Claude Design friendly: tokens → components). */
:root {
  /* colour */
  --bg: #f6f4f4;
  --surface: #ffffff;
  --surface-2: #f1eeee;
  --surface-3: #e9e4e4;
  --line: #e0d9d9;
  --line-strong: #c9c0c1;
  --fg: #1c1819;
  --fg-2: #3d3537;
  --muted: #6d6366;
  --accent: #b0142f;
  --accent-ink: #ffffff;
  --accent-soft: #f8e1e5;
  --accent-line: #e8a9b4;
  --ok: #1d7347; --ok-soft: #e0f1e7;
  --warn: #9a5b00; --warn-soft: #fbeed6;
  --bad: #b3261e; --bad-soft: #fde3e0;
  --info: #285a9c; --info-soft: #e2ebf7;
  --hl-cond: #dbe8fb; --hl-cond-line: #6f9ee0;
  --hl-param: #fde9b8; --hl-param-line: #d49a12;
  --hl-field: #ebe0fb; --hl-field-line: #9a72d8;
  --hl-exc: #fbe0e0; --hl-exc-line: #d76b6b;
  --shadow: 0 1px 2px rgba(40, 20, 24, .06), 0 6px 24px rgba(40, 20, 24, .07);
  --scrim: rgba(20, 12, 14, .62);
  /* type */
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  --fs-xs: .75rem; --fs-sm: .8125rem; --fs-md: .9375rem; --fs-lg: 1.125rem; --fs-xl: 1.5rem; --fs-2xl: 2rem;
  /* shape & space */
  --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;
  --rail-w: 236px; --drawer-w: 440px; --bar-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131112; --surface: #1b1819; --surface-2: #231f20; --surface-3: #2c2728; --line: #342e30; --line-strong: #4a4144;
    --fg: #f0ebec; --fg-2: #d6cfd0; --muted: #a59a9d;
    --accent: #f0566c; --accent-ink: #1b0a0d; --accent-soft: #3b1a20; --accent-line: #7c3341;
    --ok: #57c88f; --ok-soft: #15301f; --warn: #e8a73e; --warn-soft: #34270f; --bad: #f2685b; --bad-soft: #3b1916; --info: #80aef0; --info-soft: #172639;
    --hl-cond: #1b2f4d; --hl-cond-line: #5b8ad0; --hl-param: #3d3011; --hl-param-line: #c4901b; --hl-field: #2c2145; --hl-field-line: #9a7ad8; --hl-exc: #3d1d1d; --hl-exc-line: #d77070;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45); --scrim: rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131112; --surface: #1b1819; --surface-2: #231f20; --surface-3: #2c2728; --line: #342e30; --line-strong: #4a4144;
  --fg: #f0ebec; --fg-2: #d6cfd0; --muted: #a59a9d;
  --accent: #f0566c; --accent-ink: #1b0a0d; --accent-soft: #3b1a20; --accent-line: #7c3341;
  --ok: #57c88f; --ok-soft: #15301f; --warn: #e8a73e; --warn-soft: #34270f; --bad: #f2685b; --bad-soft: #3b1916; --info: #80aef0; --info-soft: #172639;
  --hl-cond: #1b2f4d; --hl-cond-line: #5b8ad0; --hl-param: #3d3011; --hl-param-line: #c4901b; --hl-field: #2c2145; --hl-field-line: #9a7ad8; --hl-exc: #3d1d1d; --hl-exc-line: #d77070;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45); --scrim: rgba(0,0,0,.7);
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 var(--fs-md)/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -.005em; }
h1 { font-size: var(--fs-2xl); } h2 { font-size: var(--fs-xl); } h3 { font-size: var(--fs-lg); } h4 { font-size: var(--fs-md); }
p { margin: 0; max-width: 68ch; }
table { font-size: inherit; border-collapse: collapse; }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-mono); font-size: .92em; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font: 600 var(--fs-xs)/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.de-quote { font-family: var(--font-body); font-style: italic; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- shell ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; height: var(--bar-h); display: flex; align-items: center; gap: var(--s-3);
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 13px/1 var(--font-mono); flex: none; }
.brand-name { font: 600 var(--fs-lg)/1 var(--font-display); white-space: nowrap; }
.brand-sub { font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-spacer { flex: 1; }
.bar-tools { display: flex; align-items: center; gap: var(--s-2); flex-wrap: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: var(--fs-sm); color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); font-weight: 600; }
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: calc(100% - var(--bar-h)); }
.rail { border-right: 1px solid var(--line); background: var(--surface); padding: var(--s-4) var(--s-3); position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--bar-h)); overflow: auto; }
.rail-group { display: grid; gap: 2px; margin-bottom: var(--s-4); }
.rail-label { padding: 0 var(--s-2) var(--s-1); }
.nav-btn { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: var(--r-md); cursor: pointer; color: var(--fg-2); font-size: var(--fs-sm); }
.nav-btn:hover { background: var(--surface-2); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.nav-step { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font: 600 11px/1 var(--font-mono); color: var(--muted); background: var(--surface); }
.nav-btn[aria-current="page"] .nav-step { border-color: var(--accent); color: var(--accent); }
.nav-btn.done .nav-step { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.nav-badge { font: 600 11px/1 var(--font-mono); padding: 3px 6px; border-radius: 999px; background: var(--surface-3); color: var(--fg-2); }
.nav-badge.hot { background: var(--accent); color: var(--accent-ink); }
.main { min-width: 0; padding-block: var(--s-5) var(--s-6); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transform-origin: 50% 0; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
.main-inner { max-width: 1240px; margin: 0 auto; display: grid; gap: var(--s-5); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s-4); flex-wrap: wrap; }
.page-head-text { display: grid; gap: 6px; min-width: 0; }
.page-head p { color: var(--muted); }
.actions { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; }

/* ---------- components ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); padding: 7px 12px; border-radius: var(--r-md); cursor: pointer; font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--fg-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 4px 9px; font-size: var(--fs-xs); }
.btn.ok { border-color: var(--ok); color: var(--ok); }
.btn.bad { border-color: var(--bad); color: var(--bad); }
.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-body { padding: var(--s-4); display: grid; gap: var(--s-3); min-width: 0; }
.panel-body.flush { padding: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-4); }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-4); }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-3); }
.split { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: var(--s-4); align-items: start; }
.stack { display: grid; gap: var(--s-3); min-width: 0; }
.row { display: flex; gap: var(--s-2); align-items: center; flex-wrap: wrap; min-width: 0; }
.row.between { justify-content: space-between; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font: 600 11px/1.6 var(--font-body); letter-spacing: .02em; white-space: nowrap; background: var(--surface-3); color: var(--fg-2); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.mono { font-family: var(--font-mono); font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.kpi { padding: var(--s-4); display: grid; gap: 4px; }
.kpi-value { font: 600 var(--fs-2xl)/1 var(--font-display); font-variant-numeric: tabular-nums; }
.kpi-label { font-size: var(--fs-sm); color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; font-size: var(--fs-sm); }
.tbl th { text-align: left; font: 600 var(--fs-xs)/1.3 var(--font-body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.clickable { cursor: pointer; }
.tbl tr.clickable:hover td { background: var(--surface-2); }
.tbl tr.sel td { background: var(--accent-soft); }
.list { display: grid; }
.list-item { display: grid; gap: 4px; padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; border-left: 3px solid transparent; background: transparent; border-top: 0; border-right: 0; width: 100%; }
.list-item:hover { background: var(--surface-2); }
.list-item[aria-selected="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.list-item:last-child { border-bottom: 0; }
.sev { width: 4px; align-self: stretch; border-radius: 2px; }
.callout { border: 1px solid var(--line); border-left: 4px solid var(--info); background: var(--info-soft); border-radius: var(--r-md); padding: var(--s-3) var(--s-4); font-size: var(--fs-sm); display: grid; gap: 4px; }
.callout.warn { border-left-color: var(--warn); background: var(--warn-soft); }
.callout.ok { border-left-color: var(--ok); background: var(--ok-soft); }
.callout.bad { border-left-color: var(--bad); background: var(--bad-soft); }
.callout.accent { border-left-color: var(--accent); background: var(--accent-soft); }
.code { font: 400 12.5px/1.55 var(--font-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s-3); overflow-x: auto; white-space: pre; margin: 0; }
.field-label { font-size: var(--fs-xs); color: var(--muted); }
.input, .select, .textarea { width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-md); padding: 7px 10px; font-size: var(--fs-sm); }
.textarea { min-height: 80px; resize: vertical; font-family: var(--font-mono); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: var(--fs-sm); }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font-size: var(--fs-sm); color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.empty { padding: var(--s-6); text-align: center; color: var(--muted); font-size: var(--fs-sm); }
.toast-host { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: grid; gap: 8px; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: var(--r-md); font-size: var(--fs-sm); box-shadow: var(--shadow); max-width: 360px; animation: toast-in .25s ease-out; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }

/* ---------- pipeline map ---------- */
.pipe { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
.pipe-step { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 10px; text-align: left; cursor: pointer; display: grid; gap: 4px; min-width: 0; }
.pipe-step:hover { border-color: var(--accent-line); }
.pipe-step .n { font: 600 11px/1 var(--font-mono); color: var(--accent); }
.pipe-step .t { font: 600 var(--fs-sm)/1.25 var(--font-display); }
.pipe-step .d { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.pipe-step .who { font-size: 10.5px; }
.pipe-step.ai { border-top: 3px solid var(--info); }
.pipe-step.det { border-top: 3px solid var(--ok); }
.pipe-step.human { border-top: 3px solid var(--warn); }
.legend { display: flex; gap: var(--s-4); flex-wrap: wrap; font-size: var(--fs-xs); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.compare { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--s-4); }
.compare ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: var(--fs-sm); }

/* ---------- spec text & highlights ---------- */
.spec { font: 400 var(--fs-md)/1.7 var(--font-body); max-width: 74ch; }
.spec p { margin-bottom: 12px; max-width: none; }
.spec-meta { font: 500 var(--fs-xs)/1.4 var(--font-mono); color: var(--muted); }
mark.hl { background: transparent; color: inherit; border-radius: 3px; padding: 1px 2px; cursor: pointer; box-shadow: inset 0 -2px 0 var(--hl-cond-line); }
mark.hl.cond { background: var(--hl-cond); box-shadow: inset 0 -2px 0 var(--hl-cond-line); }
mark.hl.param { background: var(--hl-param); box-shadow: inset 0 -2px 0 var(--hl-param-line); }
mark.hl.field { background: var(--hl-field); box-shadow: inset 0 -2px 0 var(--hl-field-line); }
mark.hl.exc { background: var(--hl-exc); box-shadow: inset 0 -2px 0 var(--hl-exc-line); }
mark.hl.flash { animation: flash 1.2s ease-out 2; }
@keyframes flash { 50% { outline: 2px solid var(--accent); outline-offset: 2px; } }
.hl-legend { display: flex; gap: var(--s-3); flex-wrap: wrap; font-size: var(--fs-xs); }
.hl-legend mark { cursor: default; }
.xref { color: var(--info); text-decoration: underline dotted; cursor: pointer; }
.redline del { background: var(--bad-soft); color: var(--bad); text-decoration: line-through; border-radius: 2px; }
.redline ins { background: var(--ok-soft); color: var(--ok); text-decoration: none; border-radius: 2px; font-weight: 500; }
.toc { font-size: var(--fs-sm); display: grid; gap: 1px; }
.toc button { text-align: left; border: 0; background: transparent; padding: 4px 8px; border-radius: var(--r-sm); cursor: pointer; display: grid; grid-template-columns: 54px 1fr auto; gap: 6px; color: var(--fg-2); }
.toc button:hover { background: var(--surface-2); }
.toc button[aria-current="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.toc .sub { padding-left: 20px; }
.ctx-meter { display: grid; gap: 6px; }
.meter { height: 8px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--info); border-radius: 999px; }

/* ---------- extraction / guards ---------- */
.runs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); }
.guard { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; font-size: var(--fs-sm); padding: 6px 0; }
.guard .gi { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--font-mono); background: var(--surface-3); color: var(--muted); }
.guard.ok .gi { background: var(--ok); color: var(--surface); }
.guard.bad .gi { background: var(--bad); color: var(--surface); }
.guard.run .gi { background: var(--info); color: var(--surface); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.param-row { display: grid; grid-template-columns: minmax(110px, 160px) 70px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: var(--fs-sm); }
.param-row:last-child { border-bottom: 0; }
.param-val { font: 600 var(--fs-md)/1 var(--font-mono); }
.param-val input { width: 64px; padding: 3px 6px; border: 1px solid var(--accent); border-radius: var(--r-sm); background: var(--surface); font: inherit; }
.typing::after { content: "▍"; animation: pulse .8s infinite; color: var(--accent); }
.badge-llm { background: var(--info-soft); color: var(--info); }
.badge-oracle { background: var(--ok-soft); color: var(--ok); }

/* ---------- provenance drawer ---------- */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(var(--drawer-w), 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 70; display: grid; grid-template-rows: auto minmax(0, 1fr); transform: translateX(105%); transition: transform .35s cubic-bezier(.2,.7,.2,1);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer.open { transform: none; }
.drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s-3); padding: var(--s-4); border-bottom: 1px solid var(--line); }
.drawer-body { overflow: auto; padding: var(--s-4); }
.trail { display: grid; gap: 0; }
.trail-step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; position: relative; padding-bottom: var(--s-4); }

  /* ---------- AU timeline (SVG) ---------- */
  function timeline(st, today, P, opt = {}) {

    const inc = new Set(res.chain.included);

    const all = [...st.priors.map(a => a.start), res.days.winStart];
    const x0 = Math.min(...all) - 12, x1 = Math.max(endUsed, st.current.start) + 12;
    const W = 760, H = opt.compact ? 76 : 96, pad = 8, sx = d => pad + (d - x0) / (x1 - x0) * (W - 2 * pad);
    const y = opt.compact ? 30 : 40, bh = 16;
    let svg = `<svg class="tl" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(L("Sick-leave timeline", "AU-Zeitstrahl"))}">`;
    svg += `<rect class="win" x="${sx(res.days.winStart)}" y="${y - 6}" width="${Math.max(0, sx(st.current.start) - sx(res.days.winStart))}" height="${bh + 12}" rx="4"/>`;
    svg += `<text x="${sx(res.days.winStart) + 4}" y="${y - 10}">${esc(L("12-month window", "12-Monats-Fenster"))} ${C.de(res.days.winStart)}</text>`;
    svg += `<line class="axis" x1="${pad}" x2="${W - pad}" y1="${y + bh + 10}" y2="${y + bh + 10}"/>`;
    st.priors.forEach((a, i) => {

      svg += `<text class="lbl" x="${sx(a.start)}" y="${y + bh + 24 + (i % 2) * 11}">${C.de(a.start).slice(0, 6)}</text>`;
    });
    svg += `<rect class="au cur" x="${sx(st.current.start)}" y="${y}" width="${Math.max(3, sx(endUsed + 1) - sx(st.current.start))}" height="${bh}" rx="3"><title>${esc(L("current", "aktuell"))} ${C.de(st.current.start)}–${C.de(endUsed)}</title></rect>`;

  /* ===================================================================================

  const PARAM_RULE = { six_months: "R-3.12-A", min_days: "R-3.12-A", lookback_months: "R-3.12-A", open_end_days: "R-3.12-A", efz_days: "R-3.12.5", weeks_before: "R-3.11.1", weeks_after: "R-3.11.1", weeks_after_special: "R-3.11.1" };

  const goldenInputs = () => `${esc(C.GOLDEN.name)} · ${L("current AU from", "aktuelle AU ab")} ${C.de(C.GOLDEN.state.current.start)} ${L("to", "bis")} ${C.de(C.GOLDEN.state.current.end)}<br>${C.GOLDEN.state.priors.map(a => `${C.de(a.start)}–${C.de(a.end)}${a.paper ? " (" + L("paper note", "Papier-AU") + ")" : ""}`).join("<br>")}`;

    }

      return { title: `${L("Confirmed EEL end", "Bestätigtes EEL-Ende")} ${C.de(r.end)}`, sub: "§3.7.3 · " + L("new in v13.4", "neu in v13.4"), steps: [{ kind: "src", ic: "§", title: `§3.7.3 · ${L("page", "Seite")} 92 · v13.4`, html: `<div class="trail-box de-quote">„${esc(rule.runA.quotes._rule)}“</div>` }, fnStep("eel.confirmedEnd"), inStep(`${L("AU until", "AU bis")} ${C.de(g.finalAuEnd)} · ${L("employment ends", "Beschäftigung endet")} ${C.de(g.employmentEnd)}`), calcStep(r.trace), resStep(C.de(r.end), "EEL-3.7.3-001, KK 62")] };

        { kind: "src", ic: "§", title: `${L("Specification", "Spezifikation")} §${c.sec}`, html: C.SPEC.sections[c.sec] ? `<div class="trail-box de-quote">${esc(C.SPEC.sections[c.sec].text[0].slice(0, 260))}…</div>` : `<div class="trail-box">${L("Field definition from the record layout (§3.1 / §3.12 tables).", "Felddefinition aus dem Satzaufbau (Tabellen §3.1 / §3.12).")}</div>` },
        fnStep(c.id === "V-CHAIN" ? "dbvo.chain" : c.id === "V-ORACLE" ? "dbvo.block" : c.id === "V-GATE" ? "dbvo.gates" : "dbvo.block"),
        inStep(`${L("File", "Datei")}: ${esc(sampleLabel())} · ${L("fields", "Felder")}: ${esc((c.where || ["—"]).join(", "))}`),
        resStep(`${c.ok ? "✓" : "✕"} ${esc(T(c.msg))}`, "")] };

      return { title: `${n} = ${S.params[n] != null ? S.params[n] : rule.runA.params[n]}`, sub: `${rid} · §${rule.sec}`, steps: [...paramSteps([n]), fnStep(rule.fn)] };
    }
    return null;
  }

      { kind: L("Vendor output", "Herstellerausgabe"), name: "TEEL0-Test1-DBVO", ver: "7654321 / 66666XXX", note: L("real ITSG sample file (DTA, ISO-8859-1)", "echte ITSG-Beispieldatei (DTA, ISO-8859-1)"), content: C.TEEL0, state: "current" },

  /* ---------- Specification viewer with AI highlights ---------- */
  const HIGHLIGHTS = {

    "3.11.1": [{ q: "beginnt 6 Wochen vor dem voraussichtlichen Entbindungstag", k: "param", rule: "R-3.11.1", crit: null }, { q: "Sie endet 8 Wochen nach der Entbindung", k: "param", rule: "R-3.11.1", crit: null }, { q: "12 Wochen nach der Entbindung", k: "param", rule: "R-3.11.1", crit: null }, { q: "das Datum der tatsächlichen Geburt zu melden", k: "exc", rule: null, crit: null }],
    "3.20": [{ q: "Datensatz-ID der ursprünglich übermittelten Meldung", k: "field", rule: null, crit: null }, { q: "angegebene Vorname anzugeben", k: "field", rule: null, crit: null }, { q: "angegebene Familienname anzugeben", k: "field", rule: null, crit: null }]
  };
  const HL_KIND = { cond: () => L("condition", "Bedingung"), param: () => L("parameter / number", "Parameter / Zahl"), field: () => L("required output field", "Pflichtfeld der Ausgabe"), exc: () => L("exception", "Ausnahme") };
  function highlightText(text, sec, extraQuote) {
    let html = esc(text);
    const hls = (HIGHLIGHTS[sec] || []).slice().sort((a, b) => b.q.length - a.q.length);
    const used = [];
    hls.forEach((h, i) => {
      const e = esc(h.q), idx = html.indexOf(e);
      if (idx < 0 || used.some(u => idx < u[1] && idx + e.length > u[0])) return;
      const tag = `<mark class="hl ${h.k}" data-act="hl" data-sec="${esc(sec)}" data-i="${(HIGHLIGHTS[sec] || []).indexOf(h)}" title="${esc(HL_KIND[h.k]())}">`;
      html = html.slice(0, idx) + tag + e + "</mark>" + html.slice(idx + e.length);
      used.forEach(u => { if (u[0] > idx) { u[0] += tag.length + 7; u[1] += tag.length + 7; } });
      used.push([idx, idx + tag.length + e.length + 7]);
    });
    if (extraQuote) { const e = esc(extraQuote); const i = html.indexOf(e); if (i >= 0) html = html.slice(0, i) + `<mark class="hl param flash" id="flashQuote">` + e + "</mark>" + html.slice(i + e.length); }
    return html.replace(/(\d+\.\d+(?:\.\d+)*)(?=\s„)/g, m => C.SPEC.sections[m] ? `<span class="xref" data-act="goSec" data-sec="${m}">${m}</span>` : m);
  }

      `<div class="seg" role="group" aria-label="Version"><button aria-pressed="${!old}" data-act="specVer" data-v="13.4">v13.4</button><button aria-pressed="${old}" data-act="specVer" data-v="13.3">v13.3 <span class="muted">(${L("illustr.", "illustr.")})</span></button></div>`)}

            <div class="spec">${paras ? paras.map(p => `<p>${old ? esc(p) : highlightText(p, sec, S.flashQuote)}</p>`).join("") : `<p class="muted">${L("This section has no text in the selected version.", "Dieser Abschnitt hat in dieser Version keinen Text.")}</p>`}</div>

            ${hlInfo ? `<div class="callout accent"><b>${HL_KIND[hlInfo.k]()}: „${esc(hlInfo.q)}“</b>${hlInfo.rule ? `${L("Feeds rule", "Speist Regel")} <b>${hlInfo.rule}</b> → <code>${C.RULES.find(r => r.id === hlInfo.rule).fn}</code>. ` : ""}${hlInfo.crit ? `${L("ITSG criterion", "ITSG-Kriterium")} <span class="mono">${hlInfo.crit}</span>. ` : ""}${L("Test cases citing", "Testfälle mit Bezug")} §${sec}: ${C.CATALOGUE.filter(r => r.sec === sec).map(r => r.id).join(", ") || "—"}${hlInfo.rule ? `<div class="row"><button class="btn sm" data-act="openRule" data-rule="${hlInfo.rule}">${L("Open rule", "Regel öffnen")}</button></div>` : ""}</div>` : ""}

  /* ---------- 2 · Change impact ---------- */
  function vChanges() {
    const list = CHANGES;
    const ch = list.find(c => c.sec === S.selChange) || list[0];
    const counts = Object.keys(SOURCE).map(k => [k, list.filter(c => c.source === k).length]);
    const imp = changeImpact(ch), risk = changeRisk(ch), ai = C.AI_CHANGE_TYPE[ch.sec];
    const K = 16, parts = ch.diff ? ch.diff.parts : [];
    const trimEq = (s, i) => { if (S.fullRedline) return s; const w = s.split(" "); if (w.length <= 2 * K + 4) return s; if (i === 0) return "… " + w.slice(-K).join(" "); if (i === parts.length - 1) return w.slice(0, K).join(" ") + " …"; return w.slice(0, K).join(" ") + " … " + w.slice(-K).join(" "); };
    const redline = ch.diff ? parts.map((p, i) => p.t === "=" ? esc(trimEq(p.s, i)) : p.t === "-" ? `<del>${esc(p.s)}</del>` : `<ins>${esc(p.s)}</ins>`).join(" ") : null;
    const ctxSecs = [ch.sec, ...((C.SPEC.sections[ch.sec] || { links: [] }).links.filter(l => C.SPEC.sections[l]))];
    const ctxTok = Math.round((ctxSecs.reduce((s, x) => s + C.sectionText(x).length, 0) + (C.SPEC_OLD.sections[ch.sec] || []).join(" ").length) / 4);
    return `${head(L("Change impact: v13.3 → v13.4", "Änderungen: v13.3 → v13.4"), L("Two independent sources, both deterministic: the official change log (parsed, not read by the AI) and a section-by-section diff of the old and new text. Where they disagree, you see it.", "Zwei unabhängige Quellen, beide deterministisch: das offizielle Änderungsprotokoll (geparst, nicht von der KI gelesen) und ein Abschnitts-Diff von altem und neuem Text. Wo sie abweichen, sehen Sie es."))}
      <div class="row" data-tour="sources">${counts.map(([k, n]) => `<span class="pill ${SOURCE[k].cls}">${n} · ${T(SOURCE[k])}</span>`).join("")}</div>
      <div class="split">
        <section class="panel"><div class="panel-head"><h4>${L("Changes", "Änderungen")}</h4><span class="muted" style="font-size:var(--fs-xs)">${L("diff-only first", "nur-Diff zuerst")}</span></div>
          <div class="list" role="listbox">${list.map(c => { const r = changeRisk(c); return `<button class="list-item" role="option" aria-selected="${c.sec === ch.sec}" data-act="selChange" data-sec="${c.sec}" ${c.sec === "3.12" ? 'data-tour="change312"' : ""}>
            <div class="row between"><b class="mono">§${c.sec}</b>${riskPill(r)}</div>
            <div style="font-size:var(--fs-sm)">${esc(c.title)}</div>
            <div class="row"><span class="pill ${SOURCE[c.source].cls}">${T(SOURCE[c.source])}</span><span class="pill">${typeLabel(changeType(c.sec))}</span><span class="pill">${changeImpact(c).count} ${L("tests", "Tests")}</span></div></button>`; }).join("")}</div></section>
        <section class="panel" data-tour="redline"><div class="panel-head"><div class="stack" style="gap:2px"><span class="eyebrow">§${ch.sec}</span><h3>${esc(ch.title)}</h3></div><div class="row"><span class="pill ${SOURCE[ch.source].cls}">${T(SOURCE[ch.source])}</span>${riskPill(risk)}</div></div>
          <div class="panel-body">
            ${ch.entry ? `<div class="callout"><b>${L("Change log entry", "Eintrag im Änderungsprotokoll")} (${esc(ch.entry.version)} · ${esc(ch.entry.date)})</b><span class="de-quote">${esc(ch.entry.raw.split(" | ")[2])}</span><span class="muted" style="font-size:var(--fs-xs)">${L("Parsed: § refs", "Geparst: §-Bezüge")} ${ch.entry.refs.map(r => r.sec).join(", ")} · ${L("description", "Beschreibung")} „${esc(ch.entry.description)}“</span></div>` : `<div class="callout bad"><b>${L("Not in the change log", "Nicht im Änderungsprotokoll")}</b>${L("Found only by comparing the text. Without the diff, this change would have gone unnoticed.", "Nur durch Textvergleich gefunden. Ohne Diff wäre diese Änderung übersehen worden.")}</div>`}
            ${redline ? `<div><div class="row between"><span class="field-label">${L("Redline", "Änderungsansicht")} v13.3 → v13.4</span><div class="row">${pill(L("v13.3 text illustrative", "v13.3-Text illustrativ"), "warn")}<button class="btn sm ghost" data-act="toggleRedline">${S.fullRedline ? L("Show changes only", "Nur Änderungen") : L("Show full text", "Ganzen Text zeigen")}</button></div></div><div class="spec redline trail-box" style="margin-top:6px">${redline}</div></div>` : `<div class="callout warn">${ch.source === "log-only" ? L("No wording change in the prose. The change probably lives in a field table or the record description — check manually.", "Keine Textänderung im Fließtext. Die Änderung steckt vermutlich in einer Feldtabelle oder der Datensatzbeschreibung — manuell prüfen.") : L("Section text not loaded in this demo (only DBVO, DBEE, DBMU and DBSD excerpts are embedded).", "Abschnittstext in dieser Demo nicht geladen (nur Auszüge DBVO, DBEE, DBMU, DBSD).")}</div>`}
            <div class="grid-3">
              <div class="stack"><span class="field-label">${L("Type of change", "Art der Änderung")} · ${pill(L("AI suggestion", "KI-Vorschlag"), "info")}</span>
                <select class="select" data-act="setType" data-sec="${ch.sec}" id="type-${ch.sec.replace(/\./g, "-")}">${["condition", "parameter", "new_rule", "removed_rule", "format", "clarification", "editorial"].map(t => `<option value="${t}" ${changeType(ch.sec) === t ? "selected" : ""}>${typeLabel(t)}</option>`).join("")}</select>
                ${ai ? `<span class="muted" style="font-size:var(--fs-xs)">${L("confidence", "Konfidenz")} ${Math.round(ai.conf * 100)} % · ${S.changeType[ch.sec] ? L("confirmed by examiner", "vom Prüfer bestätigt") : L("not yet confirmed", "noch nicht bestätigt")}</span>` : ""}</div>
              <div class="stack"><span class="field-label">${L("Test impact", "Testauswirkung")} · ${pill(L("deterministic", "deterministisch"), "ok")}</span><b>${imp.count} ${L("catalogue rows cite", "Katalogzeilen verweisen auf")} §${ch.sec}</b><span class="muted" style="font-size:var(--fs-xs)">${L("from the § references in the test catalogue", "aus den §-Verweisen im Testkatalog")}</span></div>
              <div class="stack"><span class="field-label">${L("Risk", "Risiko")} · ${pill(L("fixed rule", "feste Regel"), "ok")}</span>${riskPill(risk)}<span class="muted" style="font-size:var(--fs-xs)">${L("high = condition, parameter or format change with affected tests · medium = new/removed rule · low = editorial", "hoch = Bedingung, Parameter oder Format mit betroffenen Tests · mittel = neue/entfernte Regel · gering = redaktionell")}</span></div>
            </div>
            ${ai ? `<div class="callout accent"><b>${L("Why the AI suggests", "Warum die KI vorschlägt")}: ${typeLabel(ai.type)}</b>${T(ai.why)}</div>` : ""}
            ${imp.count ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${L("Test case", "Testfall")}</th><th>${L("Kind", "Art")}</th><th>${L("Title", "Titel")}</th></tr></thead><tbody>${imp.rows.map(r => `<tr><td class="mono">${r.id}</td><td>${r.kind === "C" ? L("criterion", "Kriterium") : L("message", "Meldung")}</td><td>${esc(T(r.title))}</td></tr>`).join("")}</tbody></table></div>` : ""}
            <div class="row between"><span class="muted" style="font-size:var(--fs-xs)">${L("Context sent to the model", "Kontext an das Modell")}: ${ctxSecs.map(x => "§" + x).join(" + ")} + v13.3 §${ch.sec} · ~${fmtN(ctxTok)} ${L("tokens", "Tokens")}</span>
              <div class="actions"><button class="btn" data-act="confirmType" data-sec="${ch.sec}">${ic("check")} ${L("Confirm type", "Typ bestätigen")}</button>${C.RULES.some(r => r.sec === ch.sec) ? `<button class="btn primary" data-act="openRule" data-rule="${C.RULES.find(r => r.sec === ch.sec).id}">${ic("ai")} ${L("Extract rules", "Regeln extrahieren")}</button>` : ""}</div></div>
          </div></section>
      </div>`;
  }

  /* ---------- 3 · Rule extraction ---------- */
  function guardRow(state, label, how) { return `<div class="guard ${state}"><span class="gi">${state === "ok" ? "✓" : state === "bad" ? "✕" : "…"}</span><span><b>${label}</b>${how ? `<br><span class="muted">${how}</span>` : ""}</span></div>`; }
  function runPanel(rule, run, g, title, sub) {
    const keys = Object.keys(run.quotes);
    return `<div class="panel"><div class="panel-head"><div class="stack" style="gap:2px"><b>${title}</b><span class="muted" style="font-size:var(--fs-xs)">${sub}</span></div>${g.ok ? pill("✓ " + L("all guards", "alle Prüfungen"), "ok") : pill("✕ " + L("guard failed", "Prüfung fehlgeschlagen"), "bad")}</div>
      <div class="panel-body">${keys.map(k => { const p = g.params[k]; return `<div class="stack" style="gap:4px;padding-bottom:8px;border-bottom:1px dashed var(--line)"><div class="row between"><code>${k === "_rule" ? L("rule", "Regel") : k}</code>${k === "_rule" ? "" : `<span class="param-val">${run.params[k]}</span>`}</div>
        <span class="de-quote" style="font-size:var(--fs-sm)">„${esc(p.quote)}“</span>
        <div class="row">${pill((p.quoteOk ? "✓ " : "✕ ") + L("verbatim", "wörtlich"), p.quoteOk ? "ok" : "bad")}${k === "_rule" ? "" : pill((p.numOk.ok ? "✓ " : "✕ ") + esc(p.numOk.how), p.numOk.ok ? "ok" : "bad") + pill((p.schemaOk.ok ? "✓ " : "✕ ") + esc(p.schemaOk.how), p.schemaOk.ok ? "ok" : "bad")}</div></div>`; }).join("")}</div></div>`;
  }
  function vExtract() {
    const rule = C.RULES.find(r => r.id === S.selRule), st = S.rules[rule.id];
    const B = st.live ? st.live.run : rule.runB;
    const ev = C.evaluateRule(rule, rule.runA, B);
    const f = C.FN[rule.fn], tests = TESTS.filter(t => t.fn === rule.fn);
    const keys = Object.keys(rule.runA.params);
    const anim = S.extracting;
    const sec = C.SPEC.sections[rule.sec];
    return `${head(L("Rule extraction", "Regelextraktion"), L("The language model never computes. It returns a function id, parameters and a verbatim quote for each. Deterministic guards check every answer before an examiner sees it.", "Das Sprachmodell rechnet nie. Es liefert eine Funktions-ID, Parameter und je ein wörtliches Zitat. Deterministische Prüfungen kontrollieren jede Antwort, bevor ein Prüfer sie sieht."),
      `<button class="btn" data-act="runExtract">${ic("ai")} ${L("Re-run extraction", "Extraktion erneut ausführen")}</button><button class="btn" data-act="runLive">${ic("ai")} ${L("Run live (hessian.AI)", "Live ausführen (hessian.AI)")}</button>`)}
      <div class="split">
        <section class="panel"><div class="panel-head"><h4>${L("Extracted rules", "Extrahierte Regeln")}</h4></div>
          <div class="list">${C.RULES.map(r => { const e = C.evaluateRule(r, r.runA, S.rules[r.id].live ? S.rules[r.id].live.run : r.runB); return `<button class="list-item" aria-selected="${r.id === rule.id}" data-act="selRule" data-rule="${r.id}"><div class="row between"><b class="mono">${r.id}</b>${statusPill(S.rules[r.id].status)}</div><span style="font-size:var(--fs-sm)">${esc(T(r.label))}</span><div class="row"><span class="pill mono">${r.fn}</span>${pill({ verified: L("guards ✓ · A = B", "Prüfungen ✓ · A = B"), partly: L("one run failed a guard", "ein Lauf mit Fehler"), conflict: L("A ≠ B conflict", "A ≠ B Konflikt"), failed: L("guards failed", "Prüfungen fehlgeschlagen") }[e.status], { verified: "ok", partly: "warn", conflict: "bad", failed: "bad" }[e.status])}</div></button>`; }).join("")}</div></section>
        <div class="stack">
          <section class="panel" data-tour="guards"><div class="panel-head"><div class="stack" style="gap:2px"><span class="eyebrow">${rule.id} · §${rule.sec} · ${L("page", "Seite")} ${sec.page}</span><h3>${esc(T(rule.label))}</h3></div>${statusPill(st.status)}</div>
            <div class="panel-body">
              <div class="row"><span class="field-label">${L("Function picked by the model", "Vom Modell gewählte Funktion")}:</span><code>${rule.fn}@${f.version}</code><span class="mono muted" style="font-size:var(--fs-xs)">sha256 ${f.hash.slice(0, 12)}…</span></div>
              <div class="grid-2" id="guardList">
                <div>${guardRow(anim ? "run" : (ev.gA.params && Object.values(ev.gA.params).every(p => p.quoteOk) ? "ok" : "bad"), L("1 · Quote is verbatim in the spec", "1 · Zitat steht wörtlich in der Spezifikation"), L("normalised string match against §", "normalisierter Textvergleich mit §") + rule.sec)}
                ${guardRow(anim ? "run" : (Object.values(ev.gA.params).every(p => p.numOk.ok) ? "ok" : "bad"), L("2 · Number appears in the quote", "2 · Zahl steht im Zitat"), L("digits or German number words × unit (Woche = 7 Tage)", "Ziffern oder Zahlwörter × Einheit (Woche = 7 Tage)"))}</div>
                <div>${guardRow(anim ? "run" : (Object.values(ev.gA.params).every(p => p.schemaOk.ok) ? "ok" : "bad"), L("3 · Parameter exists and is in range", "3 · Parameter existiert und liegt im Bereich"), L("schema of", "Schema von") + " " + rule.fn)}
                ${guardRow(anim ? "run" : (ev.ag.ok ? "ok" : "bad"), L("4 · Two runs agree (A = B)", "4 · Zwei Läufe stimmen überein (A = B)"), ev.ag.ok ? L("identical values", "identische Werte") : L("differs", "weicht ab") + ": " + ev.ag.diff.join(", "))}
                ${guardRow(anim ? "run" : (tests.every(t => t.ok) ? "ok" : "bad"), L("5 · Function unit tests pass", "5 · Funktionstests bestanden"), tests.length ? `${tests.filter(t => t.ok).length}/${tests.length}` : L("integration tests", "Integrationstests"))}</div>
              </div>
              ${ev.status === "partly" ? `<div class="callout warn"><b>${L("Run B paraphrased a quote", "Lauf B hat ein Zitat umformuliert")}</b>${L("The quote guard rejected it, because the text does not appear in the spec. Run A's verbatim quote carries the parameter; the examiner sees both.", "Die Zitatprüfung hat es abgelehnt, weil der Text so nicht in der Spezifikation steht. Das wörtliche Zitat aus Lauf A trägt den Parameter; der Prüfer sieht beide.")}</div>` : ""}
              ${ev.status === "conflict" ? `<div class="callout bad"><b>${L("Runs disagree", "Läufe widersprechen sich")}: ${ev.ag.diff.join(", ")}</b>${L("Run B read a number that is not in its own quote. The rule cannot be approved until the examiner resolves the conflict.", "Lauf B hat eine Zahl gelesen, die nicht in seinem eigenen Zitat steht. Die Regel kann erst freigegeben werden, wenn der Prüfer den Konflikt löst.")}</div>` : ""}
            </div></section>
          <div class="runs">${runPanel(rule, rule.runA, ev.gA, L("Run A", "Lauf A"), "Kolibri-1 · prompt A · " + L("recorded", "aufgezeichnet"))}${runPanel(rule, B, ev.gB, st.live ? L("Live run", "Live-Lauf") : L("Run B", "Lauf B"), st.live ? esc(st.live.model) + " · " + L("live", "live") : "Kolibri-1 · prompt B · " + L("recorded", "aufgezeichnet"))}</div>
          <section class="panel" data-tour="approve"><div class="panel-head"><h4>${L("Examiner decision", "Entscheidung des Prüfers")}</h4>${pill(L("once per rule, not per test", "einmal je Regel, nicht je Test"), "")}</div>
            <div class="panel-body">
              ${keys.length ? keys.map(k => `<div class="param-row"><code>${k}</code><span class="param-val">${st.status === "pending" ? `<input type="number" id="edit-${rule.id}-${k}" data-param="${k}" value="${st.edited[k] != null ? st.edited[k] : (S.params[k] != null ? S.params[k] : rule.runA.params[k])}">` : S.params[k]}</span><span class="de-quote muted" style="font-size:var(--fs-xs)">„${esc(rule.runA.quotes[k])}“</span>${prov(`param:${rule.id}:${k}`, L("trail", "Herkunft"))}</div>`).join("") : `<p class="muted">${L("No numeric parameters — the rule itself is the function.", "Keine Zahlparameter — die Regel ist die Funktion selbst.")}</p>`}
              <textarea class="textarea" id="rejectReason-${rule.id}" placeholder="${esc(L("Reason (required to reject)", "Begründung (für Ablehnung erforderlich)"))}" ${st.status !== "pending" ? "hidden" : ""}></textarea>
              <div class="actions">${st.status === "pending" ? `<button class="btn primary" data-act="approve" data-rule="${rule.id}" ${ev.status === "conflict" ? "disabled" : ""}>${ic("check")} ${L("Approve", "Freigeben")}</button><button class="btn bad" data-act="reject" data-rule="${rule.id}">✕ ${L("Reject", "Ablehnen")}</button>${ev.status === "conflict" ? `<button class="btn" data-act="resolve" data-rule="${rule.id}">${L("Resolve: use run A", "Lösen: Lauf A übernehmen")}</button>` : ""}` : `<span class="muted">${st.status === "approved" ? L("Approved", "Freigegeben") : L("Rejected", "Abgelehnt") + ": " + esc(st.reason)}</span><button class="btn sm ghost" data-act="reopen" data-rule="${rule.id}">${L("Reopen", "Wieder öffnen")}</button>`}</div>
            </div></section>
          <section class="panel"><div class="panel-head"><h4>§${rule.sec} · ${L("source text with quotes", "Quelltext mit Zitaten")}</h4><button class="btn sm ghost" data-act="goSec" data-sec="${rule.sec}">${L("Open in viewer", "Im Viewer öffnen")}</button></div>
            <div class="panel-body"><div class="spec" style="font-size:var(--fs-sm)">${sec.text.map(p => `<p>${highlightText(p, rule.sec)}</p>`).join("")}</div></div></section>
        </div>
      </div>`;
  }

  /* ---------- 4 · Function library ---------- */
  function vFunctions() {
    const fns = Object.values(C.FN);
    return `${head(L("Function library", "Funktionsbibliothek"), L("Pre-written for the EEL sub-domain. Each function is versioned, hashed and unit-tested — the tests below run in your browser right now, including ITSG's own reference case.", "Für die EEL-Domäne vorab geschrieben. Jede Funktion ist versioniert, gehasht und getestet — die Tests unten laufen gerade in Ihrem Browser, inklusive des ITSG-Referenzfalls."),
      `<button class="btn" data-act="rerunTests">${ic("test")} ${L("Run tests again", "Tests erneut ausführen")}</button>`)}
      <section class="panel"><div class="panel-body flush tbl-wrap"><table class="tbl"><thead><tr><th>${L("Function", "Funktion")}</th><th>§</th><th>${L("Parameters", "Parameter")}</th><th>SHA-256</th><th>${L("Tests", "Tests")}</th></tr></thead><tbody>
        ${fns.map(f => { const t = TESTS.filter(x => x.fn === f.id); return `<tr><td><code>${f.id}@${f.version}</code><br><span class="muted" style="font-size:var(--fs-xs)">${esc(T(f.title))}</span></td><td>${secLink(f.section)}</td><td class="mono" style="font-size:var(--fs-xs)">${Object.entries(f.schema).map(([k, s]) => `${k}: ${S.params[k] != null ? S.params[k] : "—"} ${s.unit}`).join("<br>") || "—"}</td><td class="mono muted" style="font-size:var(--fs-xs)">${f.hash.slice(0, 16)}…</td><td>${t.length ? (t.every(x => x.ok) ? pill(`✓ ${t.length}/${t.length}`, "ok") : pill(`✕ ${t.filter(x => x.ok).length}/${t.length}`, "bad")) : "—"}</td></tr>`; }).join("")}
      </tbody></table></div></section>
      <section class="panel" data-tour="unittests"><div class="panel-head"><h3>${L("Unit tests", "Unit-Tests")}</h3>${TESTS.every(t => t.ok) ? pill(`✓ ${TESTS.length}/${TESTS.length} ${L("passing", "bestanden")}`, "ok") : pill(`${TESTS.filter(t => t.ok).length}/${TESTS.length}`, "bad")}</div>
        <div class="panel-body flush tbl-wrap"><table class="tbl"><tbody>${TESTS.map(t => `<tr><td style="width:36px">${t.ok ? `<span style="color:var(--ok)">✓</span>` : `<span style="color:var(--bad)">✕</span>`}</td><td class="mono" style="font-size:var(--fs-xs);white-space:nowrap">${t.fn}</td><td>${esc(t.name)}${t.err ? `<br><span class="muted">${esc(t.err)}</span>` : ""}</td></tr>`).join("")}</tbody></table></div></section>
      <div class="callout"><b>${L("Parameter set in use", "Verwendeter Parametersatz")}: v${S.paramVersion}</b>${Object.entries(S.params).map(([k, v]) => `<code>${k}=${v}</code>`).join(" · ")}<span class="muted">${L("Editing a parameter during approval creates a new version and recomputes every expected value.", "Wird ein Parameter bei der Freigabe geändert, entsteht eine neue Version und alle Erwartungswerte werden neu berechnet.")}</span></div>`;
  }

  /* ---------- 5 · Test cases ---------- */
  function catalogueCSV() {
    const rows = [["id", "section", "kind", "itsg_uuid", "title_en", "title_de", "since", "status_v13.4", "origin"]].concat(C.CATALOGUE.map(r => [r.id, r.sec, r.kind, r.uuid || "", r.title.en, r.title.de, r.since, rowStatus(r), r.origin]));
    return rows.map(r => r.map(c => /[;"\n]/.test(c) ? `"${String(c).replace(/"/g, "\"\"")}"` : c).join(";")).join("\n");
  }
  function vTests() {
    const tab = S.testTab;
    if (!S.variants.length) S.variants = C.generateVariants(S.seed, S.params, 6);
    const tabs = [["catalogue", L("Catalogue", "Katalog")], ["variants", L("Fresh variants", "Frische Varianten")], ["golden", L("ITSG reference case", "ITSG-Referenzfall")]];
    let body = "";
    if (tab === "catalogue") {
      const vendorView = S.role === "vendor";
      body = `<section class="panel"><div class="panel-head"><div class="row">${pill(C.CATALOGUE.filter(r => rowStatus(r) === "new").length + " " + L("new in 13.4", "neu in 13.4"), "accent")}${pill(C.CATALOGUE.filter(r => rowStatus(r) === "changed").length + " " + L("affected by changes", "von Änderungen betroffen"), "warn")}${pill(C.CATALOGUE.length + " " + L("rows (EEL subset)", "Zeilen (EEL-Teilmenge)"), "")}</div>
        <div class="actions">${vendorView ? "" : `<button class="btn sm" data-act="importCsv">${ic("upload")} ${L("Import CSV", "CSV importieren")}</button>`}<button class="btn sm" data-act="exportCsv">${ic(FRAMED ? "copy" : "download")} ${FRAMED ? L("Copy CSV", "CSV kopieren") : L("Export CSV", "CSV exportieren")}</button></div></div>
        <div class="panel-body flush tbl-wrap"><table class="tbl"><thead><tr><th>ID</th><th>§</th><th>${L("Kind", "Art")}</th><th>${L("Title", "Titel")}</th><th>${L("Since", "Seit")}</th><th>${L("Status", "Status")}</th></tr></thead><tbody>
        ${C.CATALOGUE.map(r => { const s = rowStatus(r); return `<tr><td class="mono" style="white-space:nowrap">${r.id}</td><td>${secLink(r.sec)}</td><td>${r.kind === "C" ? pill(L("criterion", "Kriterium"), "info") : pill(L("message", "Meldung"), "")}</td><td>${esc(T(r.title))}${r.uuid ? `<br><span class="mono muted" style="font-size:11px">${r.uuid}</span>` : ""}</td><td class="mono">${r.since}</td><td>${s === "new" ? pill(L("new", "neu"), "accent") : s === "changed" ? pill(L("re-check", "erneut prüfen"), "warn") : pill(L("unchanged", "unverändert"), "")}</td></tr>`; }).join("")}
        </tbody></table></div></section>`;
    } else if (tab === "variants") {
      body = `<section class="panel" data-tour="variants"><div class="panel-head"><div class="stack" style="gap:2px"><b>${L("Same criteria, new data every cycle", "Gleiche Kriterien, jede Runde neue Daten")}</b><span class="muted" style="font-size:var(--fs-xs)">${L("Boundary templates × seeded generator. Expected results come from the functions, so vendors can't fit outputs to answers they've never seen.", "Grenzfall-Vorlagen × Generator mit Seed. Erwartungswerte kommen aus den Funktionen — Hersteller können Ausgaben nicht an unbekannte Antworten anpassen.")}</span></div>
        <div class="row"><label class="field-label" for="seedInput">${L("Seed", "Seed")}</label><input class="input mono" id="seedInput" type="number" value="${S.seed}" style="width:100px"><button class="btn primary" data-act="newVariants">${ic("play")} ${L("Generate new variants", "Neue Varianten erzeugen")}</button></div></div>
        <div class="panel-body"><div class="grid-2">${S.variants.map(v => { const r = v.result; return `<div class="panel" style="border-color:${r.allowed ? "var(--line)" : "var(--line)"}"><div class="panel-head"><div class="stack" style="gap:2px"><span class="mono" style="font-size:var(--fs-xs)">${v.id}</span><b>${esc(v.name)}</b></div>${pill(T(v.template.label), "info")}</div>
          <div class="panel-body">${timeline(v.state, v.today, S.params, { compact: true })}
            <div class="row between"><span>${L("Expected", "Erwartet")}: ${prov("variant:" + v.id, r.allowed ? L("request 41", "Anfrage 41") + ` · ${r.chain.included.length} ${L("period(s)", "Zeitr.")}` : L("no request 41", "keine Anfrage 41"))}</span>${r.allowed ? pill("41", "ok") : pill("—", "")}</div>
            ${v.expected ? `<div class="code" style="font-size:11px">${esc(v.expected)}</div>` : `<div class="muted" style="font-size:var(--fs-xs)">${L("Failing gate", "Nicht erfüllt")}: ${r.gates.filter(x => !x.ok).map(x => x.id).join(", ")}</div>`}</div></div>`; }).join("")}</div></div></section>`;
    } else {
      const g = C.GOLDEN, r = C.gates(g.state, g.today, S.params);
      body = `<section class="panel"><div class="panel-head"><div class="stack" style="gap:2px"><span class="eyebrow">TC-3.12-001 · ${L("from ITSG", "von ITSG")}</span><h3>${esc(g.name)} — ${L("prior-illness request", "Vorerkrankungsanfrage")}</h3></div>${pill(L("employment ends", "Beschäftigung endet") + " " + C.de(g.employmentEnd), "")}</div>
        <div class="panel-body">${timeline(g.state, g.today, S.params)}
          <div class="grid-2"><dl class="kv"><dt>${L("Request 41", "Anfrage 41")}</dt><dd>${prov("golden.allowed", r.allowed ? L("allowed", "erlaubt") : L("not allowed", "nicht erlaubt"))}</dd><dt>${L("Periods", "Zeiträume")}</dt><dd>${prov("golden.chain", String(r.chain.included.length))}</dd><dt>${L("Days", "Tage")}</dt><dd>${prov("golden.total", r.days.total + " ≥ " + S.params.min_days)}</dd><dt>${L("Sick pay end", "EFZ-Ende")}</dt><dd>${prov("golden.efz30", C.de(C.efzEnd(g.state.current.start, 22, S.params).end))} → ${prov("golden.efz27", C.de(C.efzEnd(g.state.current.start, 25, S.params).end))}</dd><dt>${L("EEL end (62)", "EEL-Ende (62)")}</dt><dd>${prov("golden.eelend", C.de(C.eelEnd(g.finalAuEnd, g.employmentEnd).end))}</dd></dl>
          <div class="stack"><span class="field-label">${L("Expected DBVO block (oracle)", "Erwarteter DBVO-Baustein (Orakel)")}</span><div class="code" style="font-size:11px;white-space:pre-wrap;word-break:break-all">${esc(C.dbvoBlock(g.state, S.params))}</div>${pill("✓ " + L("identical to ITSG's real file", "identisch mit ITSG-Datei"), "ok")}</div></div></div></section>`;
    }
    return `${head(L("Test cases", "Testfälle"), L("The catalogue is updated, not rewritten: rows citing a changed § are flagged, new rules add rows, and boundary variants are generated fresh.", "Der Katalog wird aktualisiert, nicht neu geschrieben: Zeilen mit geändertem § werden markiert, neue Regeln ergänzen Zeilen, Grenzfall-Varianten entstehen neu."))}
      <div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button class="tab" role="tab" aria-selected="${tab === k}" data-act="testTab" data-tab="${k}">${t}</button>`).join("")}</div>${body}`;
  }

  /* ---------- 6 · Inbox ---------- */
  function vInbox() {
    const vendor = S.role === "vendor";
    const pkg = `<div class="stack"><div class="row">${pill(L("Scenario sheet", "Szenarienblatt") + ` · ${S.variants.length + 1}`, "")}${pill(L("Expected output files (DTA)", "Erwartete Ausgabedateien (DTA)"), "")}${pill(L("Criteria checklist", "Kriterien-Checkliste"), "")}${pill(L("Machine-importable JSON (optional)", "Maschinenlesbares JSON (optional)"), "info")}</div><span class="muted" style="font-size:var(--fs-xs)">${L("Whether vendors can import scenarios automatically is an open question for ITSG — manual UI entry is the slowest step today.", "Ob Hersteller Szenarien automatisch importieren können, ist eine offene Frage an ITSG — manuelle Eingabe ist heute der langsamste Schritt.")}</span></div>`;
    const seq = `<div class="seq">${C.SEQUENCE.map((m, i) => `${i ? `<span class="arrow">→</span>` : ""}<span class="pill ${m.from === "AG" ? "ok" : "info"} mono" title="${esc(T(m.note))}">${m.from} ${m.ag}${m.storno ? " ⨯" : ""}</span>`).join("")}</div>`;
    const thread = C.SEQUENCE.map(m => `<div class="msg"><div class="avatar ${m.from === "AG" ? "ven" : "kk"}">${m.from === "AG" ? "AG" : "KK"}</div><div class="stack" style="gap:4px"><div class="row between"><b>${m.from === "AG" ? "LohnWerk 2027.1" : L("Health insurer (simulated)", "Krankenkasse (simuliert)")} · ${L("Abgabegrund", "Abgabegrund")} ${m.ag}</b>${m.storno ? pill(L("cancellation", "Stornierung"), "warn") : ""}</div><span style="font-size:var(--fs-sm)">${esc(T(m.note))}</span><span class="mono muted" style="font-size:11px">${m.dsid ? "DSID " + m.dsid : ""}${m.ref ? (m.dsid ? " · " : "") + (m.storno ? "DSID-UR " : "REF-ID ") + m.ref : ""} · AZVU 1234-5678-007</span></div></div>`).join("");
    if (!vendor) return `${head(L("Inbox", "Postfach"), L("Publish the test package to vendors. They receive scenarios, expected outputs and the checklist; the simulated health insurer answers their messages.", "Testpaket an Hersteller veröffentlichen. Sie erhalten Szenarien, Erwartungswerte und Checkliste; die simulierte Krankenkasse beantwortet ihre Meldungen."))}
      <div class="grid-2"><section class="panel" data-tour="publish"><div class="panel-head"><h3>${L("Test package EEL 2027-01", "Testpaket EEL 2027-01")}</h3>${S.published ? pill("✓ " + L("published", "veröffentlicht"), "ok") : pill(L("draft", "Entwurf"), "warn")}</div>
        <div class="panel-body">${pkg}<div class="stack">${C.VENDORS.map(v => `<label class="row"><input type="checkbox" checked id="pub-${v.id}"> <b>${esc(v.name)} ${esc(v.release)}</b> <span class="muted" style="font-size:var(--fs-xs)">${T(v.size)} · ${v.prev ? L("recertification", "Rezertifizierung") : L("first certification: full catalogue", "Erstzertifizierung: ganzer Katalog")}</span></label>`).join("")}</div>
        <div class="actions"><button class="btn primary" data-act="publish" ${S.published ? "disabled" : ""}>${ic("inbox")} ${S.published ? L("Published", "Veröffentlicht") : L("Publish to vendors", "An Hersteller veröffentlichen")}</button>${Object.values(S.rules).some(r => r.status === "pending") ? `<span class="muted" style="font-size:var(--fs-xs)">${L("Note: some rules are still awaiting approval.", "Hinweis: Einige Regeln warten noch auf Freigabe.")}</span>` : ""}</div></div></section>
      <section class="panel"><div class="panel-head"><h3>${L("Message chain for TC-3.12-001", "Meldungskette zu TC-3.12-001")}</h3></div><div class="panel-body">${seq}<span class="muted" style="font-size:var(--fs-xs)">${L("From ITSG's test constellation. IDs link each reply to its request.", "Aus der ITSG-Testkonstellation. IDs verbinden jede Antwort mit ihrer Anfrage.")}</span></div><div class="panel-body flush">${thread}</div></section></div>`;
    return `${head(L("Inbox — LohnWerk", "Postfach — LohnWerk"), L("What a vendor sees: the package from ITSG, and replies from the (simulated) health insurer.", "Was ein Hersteller sieht: das Paket von ITSG und Antworten der (simulierten) Krankenkasse."))}
      <section class="panel"><div class="panel-body flush">
        ${S.published ? `<div class="msg"><div class="avatar itsg">IT</div><div class="stack"><div class="row between"><b>ITSG ${L("System review", "Systemuntersuchung")} · ${L("Test package EEL 2027-01", "Testpaket EEL 2027-01")}</b>${pill(L("new", "neu"), "accent")}</div>${pkg}<div class="actions"><button class="btn primary" data-act="go" data-screen="validate">${ic("upload")} ${L("Upload output file", "Ausgabedatei hochladen")}</button><button class="btn" data-act="go" data-screen="tests">${L("View scenarios", "Szenarien ansehen")}</button></div></div></div>` : `<div class="empty">${L("No package yet. Switch to the ITSG role and publish one.", "Noch kein Paket. In die ITSG-Rolle wechseln und eines veröffentlichen.")}</div>`}
        ${thread}</div></section>`;
  }

  /* ---------- 7 · Compare output ---------- */
  function sampleText() {
    if (S.sample === "teel0") return C.TEEL0;
    if (S.sample === "custom" && S.customFile) return S.customFile.text;
    const b = C.brokenVariants().find(x => x.id === S.sample);
    return b ? b.text : C.TEEL0;
  }
  function sampleLabel() { if (S.sample === "teel0") return "TEEL0-Test1-DBVO"; if (S.sample === "custom" && S.customFile) return S.customFile.name; const b = C.brokenVariants().find(x => x.id === S.sample); return b ? T(b.label) : ""; }
  let VAL_CACHE = null;
  function currentValidation() { const key = S.sample + (S.customFile ? S.customFile.name : "") + JSON.stringify(S.params); if (!VAL_CACHE || VAL_CACHE.key !== key) VAL_CACHE = { key, v: C.validateMessage(sampleText(), C.GOLDEN, S.params) }; return VAL_CACHE.v; }
  function byteView(rec, badNames) {
    if (!rec) return "";
    const spans = [];
    rec.fields.forEach(f => spans.push(Object.assign({ blk: false }, f)));
    rec.blocks.forEach(b => { b.fields.forEach((f, i) => spans.push(Object.assign({ blk: i === 0, block: b.id }, f))); (b.groups || []).forEach(g => g.fields.forEach(f => spans.push(Object.assign({ blk: false, block: b.id }, f)))); });
    spans.sort((a, b) => a.from - b.from);
    let out = "", pos = 1;
    spans.forEach((f, i) => {
      if (f.from > pos) out += esc(rec.raw.slice(pos - 1, f.from - 1));
      const bad = badNames && badNames.includes(f.name);
      out += `<span class="${f.blk ? "blk" : ""}${bad ? " bad" : ""}${S.selField === f.name + f.from ? " focus" : ""}" data-act="field" data-i="${i}" data-name="${esc(f.name)}" data-from="${f.from}" title="${esc(f.name)} ${f.from}–${f.to}">${esc(rec.raw.slice(f.from - 1, f.to)).replace(/ /g, "·")}</span>`;
      pos = f.to + 1;
    });
    if (pos <= rec.raw.length) out += esc(rec.raw.slice(pos - 1));
    return out;
  }
  function vValidate() {
    const v = currentValidation(), dslw = v.parsed.records.find(r => r.kind === "DSLW");
    const bad = v.checks.filter(c => !c.ok).flatMap(c => c.where || []);
    const samples = [["teel0", L("Real ITSG file TEEL0-Test1-DBVO", "Echte ITSG-Datei TEEL0-Test1-DBVO")], ...C.brokenVariants().map(b => [b.id, L("Broken: ", "Fehlerhaft: ") + T(b.label)])];
    if (S.customFile) samples.push(["custom", S.customFile.name]);
    let fieldInfo = "";
    if (S.selField && dslw) {
      const all = [...dslw.fields, ...dslw.blocks.flatMap(b => [...b.fields, ...(b.groups || []).flatMap(g => g.fields)])];
      const f = all.find(x => x.name + x.from === S.selField);
      if (f) fieldInfo = `<dl class="kv"><dt>${L("Field", "Feld")}</dt><dd><code>${esc(f.name)}</code></dd><dt>${L("Position", "Position")}</dt><dd class="mono">${f.from}–${f.to} (${f.to - f.from + 1} ${L("chars", "Zeichen")})</dd><dt>${L("Value", "Wert")}</dt><dd class="mono">„${esc(f.value)}“</dd><dt>§</dt><dd>${f.sec && f.sec !== "—" ? secLink(f.sec) : L("not commented in the Verfahrensbeschreibung", "in der Verfahrensbeschreibung nicht kommentiert")}</dd></dl>`;
    }
    const diffLine = (a, b) => { let o = ""; for (let i = 0; i < Math.max(a.length, b.length); i++) { const x = b[i] || " "; o += a[i] === b[i] ? esc(x) : `<span style="background:var(--bad);color:var(--surface)">${esc(x)}</span>`; } return o; };
    return `${head(L("Compare output", "Ausgabe prüfen"), L("The vendor's standardized output file is parsed field by field and compared with the expected output computed by the functions. This mirrors ITSG's existing comparator; our expected file uses the same DTA format so it can feed that comparator too.", "Die standardisierte Ausgabedatei wird Feld für Feld gelesen und mit dem von den Funktionen berechneten Erwartungswert verglichen. Das bildet den bestehenden ITSG-Vergleicher nach; unsere Erwartungsdatei hat dasselbe DTA-Format und kann ihn ebenfalls speisen."),
      `<button class="btn" data-act="pickDta">${ic("upload")} ${L("Upload DTA file", "DTA-Datei hochladen")}</button>`)}
      <div class="grid-2">
        <section class="panel"><div class="panel-head"><h4>${L("File", "Datei")}</h4></div><div class="panel-body">
          <select class="select" id="sampleSel" data-act="sample">${samples.map(([k, t]) => `<option value="${k}" ${S.sample === k ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
          <div class="drop" id="dtaDrop" data-act="pickDta" role="button" tabindex="0">${ic("upload")}<span>${L("Drop a vendor DTA file (ISO-8859-1, fixed-width)", "Hersteller-DTA-Datei ablegen (ISO-8859-1, feste Länge)")}</span></div></div></section>
        <section class="panel" data-tour="verdict"><div class="panel-head"><h4>${L("Verdict", "Ergebnis")}</h4>${v.ok ? `<span class="verdict ok" style="font-size:var(--fs-lg)">✓ ${L("PASS", "BESTANDEN")}</span>` : `<span class="verdict bad" style="font-size:var(--fs-lg)">✕ ${L("FAIL", "NICHT BESTANDEN")}</span>`}</div>
          <div class="panel-body"><dl class="kv"><dt>${L("Product ID", "Produkt-ID")}</dt><dd class="mono">${esc(v.meta.product || "—")}</dd><dt>${L("Modification ID", "Modifikations-ID")}</dt><dd class="mono">${esc(v.meta.modification || "—")}</dd><dt>Abgabegrund</dt><dd class="mono">${esc(v.meta.abgabegrund || "—")}</dd><dt>DSID</dt><dd class="mono" style="font-size:var(--fs-xs)">${esc(v.meta.dsid || "—")}</dd><dt>${L("Checks", "Prüfungen")}</dt><dd>${v.checks.filter(c => c.ok).length}/${v.checks.length} ${L("passed", "bestanden")}</dd></dl></div></section>
      </div>
      <section class="panel" data-tour="checks"><div class="panel-head"><h3>${L("Checks", "Prüfungen")}</h3><span class="muted" style="font-size:var(--fs-xs)">${L("click a row for its provenance", "Zeile anklicken für Herkunft")}</span></div>
        <div class="panel-body flush tbl-wrap"><table class="tbl"><thead><tr><th></th><th>ID</th><th>${L("Check", "Prüfung")}</th><th>§</th><th>${L("ITSG criterion", "ITSG-Kriterium")}</th></tr></thead><tbody>
        ${v.checks.map(c => `<tr class="clickable" data-act="prov" data-key="check:${c.id}"><td>${c.ok ? `<span style="color:var(--ok)">✓</span>` : `<span style="color:var(--bad)">✕</span>`}</td><td class="mono">${c.id}</td><td>${esc(T(c.msg))}</td><td>${secLink(c.sec)}</td><td class="mono muted" style="font-size:11px">${c.uuid ? c.uuid.slice(0, 8) + "…" : ""}</td></tr>`).join("")}</tbody></table></div></section>
      <section class="panel" data-tour="bytes"><div class="panel-head"><h3>${L("Byte view: DSLW record", "Byte-Ansicht: DSLW-Satz")}</h3><span class="muted" style="font-size:var(--fs-xs)">${dslw ? dslw.length + " " + L("chars", "Zeichen") : ""} · ${L("spaces shown as ·", "Leerzeichen als ·")}</span></div>
        <div class="panel-body"><div class="bytes">${byteView(dslw, bad)}</div><div class="fieldinfo">${fieldInfo || `<span class="muted" style="font-size:var(--fs-sm)">${L("Click a field to see its name, position and § reference.", "Feld anklicken für Name, Position und §-Verweis.")}</span>`}</div>
        ${v.meta.expected && v.meta.actual && v.meta.expected !== v.meta.actual ? `<div class="stack"><span class="field-label">${L("Expected (oracle)", "Erwartet (Orakel)")}</span><div class="code" style="font-size:11px;white-space:pre-wrap;word-break:break-all">${esc(v.meta.expected)}</div><span class="field-label">${L("Actual (vendor file) — differences in red", "Tatsächlich (Herstellerdatei) — Abweichungen rot")}</span><div class="code" style="font-size:11px;white-space:pre-wrap;word-break:break-all">${diffLine(v.meta.expected, v.meta.actual)}</div></div>` : ""}</div></section>`;
  }

  /* ---------- 8 · On-site audit ---------- */
  function scopeFor(vendor) {
    if (!vendor.prev) return C.CATALOGUE.map(r => ({ row: r, why: ["full"] }));
    return C.CATALOGUE.map(r => {
      const why = [];
      if (vendor.prev.failed.includes(r.id)) why.push("failed");
      const s = rowStatus(r); if (s === "new") why.push("new"); if (s === "changed") why.push("changed");
      return { row: r, why };
    }).filter(x => x.why.length);
  }
  const WHY = { failed: () => pill(L("failed last time", "letztes Mal nicht bestanden"), "bad"), new: () => pill(L("new", "neu"), "accent"), changed: () => pill(L("changed", "geändert"), "warn"), full: () => pill(L("first certification", "Erstzertifizierung"), "info") };
  function autoResult(vendor, row) {
    // LohnWerk's uploaded file → message checks for §3.12 fill in automatically.
    if (vendor.id === "lw" && row.sec.startsWith("3.12")) { const v = C.validateMessage(C.TEEL0, C.GOLDEN, S.params); return v.ok ? "pass" : "fail"; }
    if (vendor.id === "lw" && row.id === "EEL-3.20-002") return "fail";
    if (vendor.id === "gp" && row.id === "EEL-3.11.1-003") return "fail";
    return "pass";
  }
  function auditState(vendor) {
    if (!S.audit[vendor.id]) S.audit[vendor.id] = Object.fromEntries(scopeFor(vendor).map(x => [x.row.id, { res: autoResult(vendor, x.row), note: "", auto: x.row.sec.startsWith("3.12") && vendor.id === "lw" }]));
    return S.audit[vendor.id];
  }
  const vendorSeg = () => `<div class="seg" role="group" aria-label="Vendor">${C.VENDORS.map(v => `<button aria-pressed="${S.vendor === v.id}" data-act="vendor" data-v="${v.id}">${esc(v.name)}</button>`).join("")}</div>`;
  function vAudit() {
    const vendor = C.VENDORS.find(v => v.id === S.vendor), scope = scopeFor(vendor), st = auditState(vendor);
    const pass = scope.filter(x => st[x.row.id] && st[x.row.id].res === "pass").length, fail = scope.length - pass;
    return `${head(L("On-site audit", "Vor-Ort-Prüfung"), L("ITSG's criteria are not sent by vendors — an examiner checks them at the vendor. The scope is computed: what failed last time, what changed, and what is new. A new product gets the whole catalogue.", "ITSG-Kriterien werden nicht von Herstellern gesendet — ein Prüfer prüft sie vor Ort. Der Umfang wird berechnet: was letztes Mal fehlschlug, was sich änderte, was neu ist. Ein neues Produkt bekommt den ganzen Katalog."), vendorSeg())}
      <div class="grid-4"><div class="panel kpi"><div class="kpi-value">${scope.length}</div><div class="kpi-label">${L("criteria in scope", "Kriterien im Umfang")}</div></div><div class="panel kpi"><div class="kpi-value" style="color:var(--ok)">${pass}</div><div class="kpi-label">${L("pass", "bestanden")}</div></div><div class="panel kpi"><div class="kpi-value" style="color:var(--bad)">${fail}</div><div class="kpi-label">${L("fail", "nicht bestanden")}</div></div><div class="panel kpi"><div class="kpi-value">${vendor.prev ? Math.round((1 - scope.length / C.CATALOGUE.length) * 100) + " %" : "0 %"}</div><div class="kpi-label">${L("of the catalogue skipped (unchanged & passed)", "des Katalogs entfällt (unverändert & bestanden)")}</div></div></div>
      <section class="panel" data-tour="checklist"><div class="panel-head"><h3>${esc(vendor.name)} ${esc(vendor.release)} · ${L("product", "Produkt")} <span class="mono">${vendor.product}</span></h3><span class="muted" style="font-size:var(--fs-xs)">${vendor.prev ? L("last audit", "letzte Prüfung") + " " + vendor.prev.year + ": " + (vendor.prev.failed.length ? vendor.prev.failed.join(", ") + " " + L("failed", "nicht bestanden") : L("all passed", "alle bestanden")) : L("no previous certificate", "kein bisheriges Zertifikat")}</span></div>
        <div class="panel-body flush tbl-wrap"><table class="tbl"><thead><tr><th>ID</th><th>${L("Criterion", "Kriterium")}</th><th>${L("Why in scope", "Warum im Umfang")}</th><th>${L("Result", "Ergebnis")}</th></tr></thead><tbody>
        ${scope.map(x => { const s = st[x.row.id]; return `<tr><td class="mono" style="white-space:nowrap">${x.row.id}</td><td>${esc(T(x.row.title))}${s.auto ? `<br><span class="muted" style="font-size:11px">${L("pre-filled from the compared DTA file", "aus der geprüften DTA-Datei vorbelegt")}</span>` : ""}</td><td><div class="row">${x.why.map(w => WHY[w]()).join("")}</div></td><td><div class="seg"><button aria-pressed="${s.res === "pass"}" data-act="auditSet" data-id="${x.row.id}" data-r="pass">✓</button><button aria-pressed="${s.res === "fail"}" data-act="auditSet" data-id="${x.row.id}" data-r="fail">✕</button></div></td></tr>`; }).join("")}
        </tbody></table></div></section>
      <div class="callout">${L("At full scale the same rule applies to ~4,000 criteria: a vendor that failed 2 of 3,000 last year gets those 2 plus everything changed or new — not the whole catalogue again.", "In voller Größe gilt dieselbe Regel für ~4.000 Kriterien: Ein Hersteller, der letztes Jahr 2 von 3.000 nicht bestand, bekommt diese 2 plus alles Geänderte oder Neue — nicht den ganzen Katalog erneut.")}</div>`;
  }

  /* ---------- Report & next scope ---------- */
  function reportData(vendor) {
    const scope = scopeFor(vendor), st = auditState(vendor);
    const results = scope.map(x => ({ id: x.row.id, sec: x.row.sec, title: x.row.title.en, why: x.why, result: st[x.row.id].res }));
    const failed = results.filter(r => r.result === "fail");
    return { vendor: vendor.name, release: vendor.release, product_id: vendor.product, modification_id: vendor.modification, spec: `${C.SPEC.doc} v${C.SPEC.version}`, parameter_set: `v${S.paramVersion}`, params: S.params, function_versions: Object.fromEntries(Object.values(C.FN).map(f => [f.id, f.version + "#" + f.hash.slice(0, 12)])), date: C.iso(C.D("2026-12-14")), in_scope: results.length, passed: results.length - failed.length, failed: failed.map(f => f.id), results, next_scope: { carry_over_failed: failed.map(f => f.id), rule: "failed + changed + new" }, verdict: failed.length ? "not certified" : "certified 2027" };
  }
  function vReport() {
    const vendor = C.VENDORS.find(v => v.id === S.vendor), d = reportData(vendor);
    const canonical = JSON.stringify(d), seal = C.sha256(canonical);
    const okV = !d.failed.length;
    return `${head(L("Report & next scope", "Bericht & nächster Umfang"), L("A traceable test record for the system review. The seal is a SHA-256 over the full record, so any later change is detectable.", "Ein nachvollziehbarer Prüfnachweis für die Systemuntersuchung. Das Siegel ist ein SHA-256 über den ganzen Datensatz, spätere Änderungen sind erkennbar."),
      `${vendorSeg()}${FRAMED ? "" : `<button class="btn" data-act="print">${ic("printer")} ${L("Print", "Drucken")}</button>`}<button class="btn" data-act="copyReport">${ic("copy")} ${L("Copy JSON", "JSON kopieren")}</button>`)}
      <article class="report" data-tour="report">

  /* ---------- Coverage ---------- */
  function vCoverage() {
    const rows = C.SPEC.index.filter(([n]) => n.split(".").length === 2).map(([n, t, p]) => {
      const cat = C.CATALOGUE.filter(r => r.sec === n || r.sec.startsWith(n + "."));
      return { n, t, p, c: cat.filter(r => r.kind === "C").length, m: cat.filter(r => r.kind === "M").length, changed: CHANGES.some(c => c.sec === n || c.sec.startsWith(n + ".")) };
    });
    const covered = rows.filter(r => r.c + r.m > 0).length;
    const heat = n => `<span class="heat" style="background:${n === 0 ? "var(--bad-soft)" : n < 3 ? "var(--warn-soft)" : "var(--ok-soft)"};color:${n === 0 ? "var(--bad)" : n < 3 ? "var(--warn)" : "var(--ok)"}">${n}</span>`;
    return `${head(L("Coverage", "Abdeckung"), L("Every § section against the test cases that cite it. Uncovered sections are flagged, which is the evidence behind “100% covered”.", "Jeder §-Abschnitt gegen die Testfälle, die ihn zitieren. Nicht abgedeckte Abschnitte werden markiert — der Nachweis hinter „100 % abgedeckt“."))}
      <div class="row">${pill(`${covered}/${rows.length} ${L("sections covered", "Abschnitte abgedeckt")}`, covered === rows.length ? "ok" : "warn")}${pill(L("demo catalogue is a subset", "Demo-Katalog ist eine Teilmenge"), "")}</div>
      <section class="panel"><div class="panel-body flush" style="overflow-x:auto"><div class="cov"><div class="h">§ ${L("section", "Abschnitt")}</div><div class="h">${L("criteria", "Kriterien")}</div><div class="h">${L("message tests", "Meldungstests")}</div><div class="h">${L("changed in 13.4", "geändert 13.4")}</div><div class="h">${L("status", "Status")}</div>
        ${rows.map(r => `<div><span class="mono">${r.n}</span> ${esc(r.t)} <span class="muted mono" style="font-size:11px">S. ${r.p}</span></div><div>${heat(r.c)}</div><div>${heat(r.m)}</div><div>${r.changed ? pill(L("yes", "ja"), "warn") : ""}</div><div>${r.c + r.m ? pill(L("covered", "abgedeckt"), "ok") : pill(L("no tests", "keine Tests"), "bad")}</div>`).join("")}</div></div></section>`;
  }
