  }

  /* ---------- Report & next scope ---------- */
  function reportData(vendor) {
    const scope = scopeFor(vendor), st = auditState(vendor);
    const results = scope.map(x => ({ id: x.row.id, sec: x.row.sec, title: x.row.title.en, why: x.why, result: st[x.row.id].res }));
    const failed = results.filter(r => r.result === "fail");
    const mv = vendor.id === "sap" ? C.validateMessage(C.TEEL0, C.GOLDEN, S.params) : null;
    return { message_tests: mv ? { file: "TEEL0-Test1-DBVO", passed: mv.checks.filter(c => c.ok).length, total: mv.checks.length } : null, vendor: vendor.name, release: vendor.release, product_id: vendor.product, modification_id: vendor.modification, spec: `${C.SPEC.doc} v${C.SPEC.version}`, parameter_set: `v${S.paramVersion}`, params: S.params, function_versions: Object.fromEntries(Object.values(C.FN).map(f => [f.id, f.version + "#" + f.hash.slice(0, 12)])), date: C.iso(C.D("2026-12-14")), in_scope: results.length, passed: results.length - failed.length, failed: failed.map(f => f.id), results, next_scope: { carry_over_failed: failed.map(f => f.id), rule: "failed + changed + new" }, verdict: failed.length ? "not certified" : "certified 2027" };
  }
  function vReport() {
    const isV = S.role === "vendor", vendor = vendorOf(isV ? S.vendorUser : S.vendor), d = reportData(vendor);
    const canonical = JSON.stringify(d), seal = C.sha256(canonical);
    const okV = !d.failed.length;
    const summary = reportSummary;
    const ruleFor = id => { for (const list of Object.values(HIGHLIGHTS)) { const h = list.find(x => x.rule && (x.t || []).includes(id)); if (h) return h.rule; } return null; };
    const all = C.VENDORS.map(v => ({ v, d: reportData(v) }));
    const w = work(vendor.id), sentRows = MSG_RULES.filter(r => w[r].result);
    const myTests = isV ? `<section class="panel no-print"><div class="panel-head"><h3>${L("Result files you sent", "Gesendete Ergebnisdateien")}</h3>${pill(`${sentRows.length}/${MSG_RULES.length}`, "")}</div>
        <div class="panel-body flush tbl-wrap">${sentRows.length ? `<table class="tbl"><tbody>${sentRows.map(r => { const x = w[r]; return `<tr><td class="mono">${ruleCase(r).id}</td><td>${esc(x.file)}${x.result.ok ? "" : x.result.words.map(y => `<br><span class="muted" style="font-size:var(--fs-xs)">• ${esc(T(y))}</span>`).join("")}</td><td>${okPill(x.result.ok)}</td></tr>`; }).join("")}</tbody></table>` : `<div class="empty">${L("No result files sent yet.", "Noch keine Ergebnisdateien gesendet.")} <button class="btn sm" data-act="go" data-screen="vwork">${L("My test cases", "Meine Testfälle")}</button></div>`}</div></section>` : "";
    return `${head(isV ? L("My results", "Meine Ergebnisse") : L("Reports & certificates", "Berichte & Zertifikate"), isV ? L("Your own results only: the files you sent, and ITSG's on-site audit report. Printable and as JSON.", "Nur Ihre eigenen Ergebnisse: Ihre gesendeten Dateien und der Prüfbericht von ITSG. Druckbar und als JSON.") : L("Pass/fail per vendor, per test case — printable and as JSON for each customer. The seal is a SHA-256 over the full record, so any later change is detectable.", "Bestanden/nicht bestanden je Hersteller und Testfall — druckbar und als JSON für jeden Kunden. Das Siegel ist ein SHA-256 über den ganzen Datensatz, spätere Änderungen sind erkennbar."),
      `${isV ? "" : vendorSeg()}${FRAMED ? "" : `<button class="btn" data-act="print">${ic("printer")} ${L("Print", "Drucken")}</button>`}<button class="btn" data-act="reportJson">${ic(FRAMED ? "copy" : "download")} ${L("JSON for", "JSON für")} ${esc(vendor.name)}</button>`)}
      ${demoNote()}${myTests}${isV ? "" : reportsPanel(vendor)}
      ${isV ? "" : `<section class="panel no-print" data-tour="allvendors"><div class="panel-head"><h3>${L("On-site audit · all vendors", "Vor-Ort-Prüfung · alle Hersteller")}</h3><span class="muted" style="font-size:var(--fs-xs)">${L("click a row to open its report", "Zeile anklicken für den Bericht")}</span></div>
        <div class="panel-body flush tbl-wrap"><table class="tbl"><thead><tr><th>${L("Vendor", "Hersteller")}</th><th>${L("In scope", "Im Umfang")}</th><th>${L("Passed", "Bestanden")}</th><th>${L("Failed", "Nicht bestanden")}</th><th>${L("Summary", "Zusammenfassung")}</th><th>${L("Verdict", "Ergebnis")}</th></tr></thead><tbody>
        ${all.map(({ v, d: r }) => `<tr class="clickable" data-act="vendor" data-v="${v.id}" ${v.id === vendor.id ? 'style="background:var(--accent-soft)"' : ""}><td><b>${esc(v.name)}</b> ${esc(v.release)}</td><td class="num">${r.in_scope}</td><td class="num" style="color:var(--ok)">${r.passed}</td><td class="num" style="color:${r.failed.length ? "var(--bad)" : "var(--muted)"}">${r.failed.length}</td><td style="font-size:var(--fs-sm)">${esc(summary(r))}</td><td>${r.failed.length ? pill(L("not certified", "nicht zertifiziert"), "bad") : pill(L("certified 2027", "zertifiziert 2027"), "ok")}</td></tr>`).join("")}</tbody></table></div></section>`}
      <article class="report" data-tour="report">
        <div class="report-head"><div class="stack"><span class="eyebrow">${L("System review · test report", "Systemuntersuchung · Prüfbericht")}</span><h2>${esc(d.vendor)} ${esc(d.release)}</h2><span class="muted mono" style="font-size:var(--fs-sm)">${L("Product", "Produkt")} ${d.product_id} · ${L("Modification", "Modifikation")} ${d.modification_id} · ${esc(d.spec)} · ${L("parameters", "Parameter")} ${d.parameter_set}</span></div>
          <div class="stack" style="justify-items:end"><span class="verdict ${okV ? "ok" : "bad"}">${okV ? L("Certified for 2027", "Zertifiziert für 2027") : L("Not certified", "Nicht zertifiziert")}</span><span class="muted" style="font-size:var(--fs-xs)">${d.passed} ✓ · ${d.failed.length} ✕ ${L("of", "von")} ${d.in_scope} ${L("in scope", "im Umfang")}</span></div></div>
        <p style="font-size:var(--fs-lg)"><b>${esc(summary(d))}.</b>${d.message_tests ? ` <span class="muted" style="font-size:var(--fs-sm)">${L("Message tests", "Meldungstests")} (${d.message_tests.file}): ${d.message_tests.passed}/${d.message_tests.total} ${L("checks passed", "Prüfungen bestanden")}.</span>` : ""}</p>
        ${d.failed.length ? `<div class="callout bad"><b>${L("Failed criteria", "Nicht bestandene Kriterien")}</b>${d.results.filter(r => r.result === "fail").map(r => `<span><code>${r.id}</code> §${r.sec} — ${esc(T(C.CATALOGUE.find(c => c.id === r.id).title))}</span>`).join("")}</div>` : ""}
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>ID</th><th>§</th><th>${L("Criterion", "Kriterium")}</th><th>${L("Scope reason", "Umfangsgrund")}</th><th>${L("Result", "Ergebnis")}</th></tr></thead><tbody>${d.results.map(r => { const rid = ruleFor(r.id); return `<tr><td class="mono">${r.id}</td><td class="mono">${r.sec}</td><td>${esc(T(C.CATALOGUE.find(c => c.id === r.id).title))}${rid ? `<br><span class="muted" style="font-size:11px">${L("rule", "Regel")} ${rid}</span>` : ""}</td><td>${r.why.map(w => WHY[w]()).join(" ")}</td><td>${okPill(r.result === "pass")}</td></tr>`; }).join("")}</tbody></table></div>
        <div class="stack" data-tour="nextscope"><h3>${L("Next audit scope", "Umfang der nächsten Prüfung")}</h3><p class="muted" style="font-size:var(--fs-sm)">${L("Next visit re-checks what failed now, plus whatever the next spec version changes or adds. Everything else stays certified.", "Beim nächsten Besuch wird geprüft, was jetzt fehlschlug, plus was die nächste Spezifikation ändert oder ergänzt. Alles andere bleibt zertifiziert.")}</p>
          <div class="row">${d.failed.length ? d.failed.map(id => `<span class="scope-chip"><span class="dot" style="color:var(--bad)"></span><code>${id}</code></span>`).join("") : `<span class="scope-chip"><span class="dot" style="color:var(--ok)"></span>${L("no carry-over", "keine Übernahme")}</span>`}<span class="scope-chip">+ ${L("changed in v13.5", "geändert in v13.5")}</span><span class="scope-chip">+ ${L("new in v13.5", "neu in v13.5")}</span></div></div>
        <div class="grid-2"><div class="stack"><span class="field-label">${L("Function versions used", "Verwendete Funktionsversionen")}</span><div class="seal">${Object.entries(d.function_versions).map(([k, v]) => `${k}@${v}`).join("<br>")}</div></div>
          <div class="stack"><span class="field-label">${L("Integrity seal (SHA-256 of this record)", "Integritätssiegel (SHA-256 dieses Datensatzes)")}</span><div class="seal" style="color:var(--fg)">${seal}</div><span class="field-label">${L("Examiner", "Prüfer")}</span><div style="border-bottom:1px solid var(--line-strong);height:28px"></div><span class="muted" style="font-size:var(--fs-xs)">${L("System examiner, ITSG", "Systemprüfer, ITSG")} · ${C.de(C.D("2026-12-14"))}</span></div></div>
      </article>`;
  }

  /* ---------- Coverage ---------- */
  function vCoverage() {
    const rows = C.SPEC.index.filter(([n]) => n.split(".").length === 2).map(([n, t, p]) => {
      const cat = C.CATALOGUE.filter(r => r.sec === n || r.sec.startsWith(n + "."));
      return { n, t, p, c: cat.filter(r => r.kind === "C").length, m: cat.filter(r => r.kind === "M").length, changed: CHANGES.some(c => c.sec === n || c.sec.startsWith(n + ".")) };
    });
    const covered = rows.filter(r => r.c + r.m > 0).length;
    const heat = n => `<span class="heat" style="background:${n === 0 ? "var(--bad-soft)" : n < 3 ? "var(--warn-soft)" : "var(--ok-soft)"};color:${n === 0 ? "var(--bad)" : n < 3 ? "var(--warn)" : "var(--ok)"}">${n}</span>`;
    return `${head(L("Coverage", "Abdeckung"), L("Every § section against the test cases that cite it. Uncovered sections are flagged, which is the evidence behind “100% covered”.", "Jeder §-Abschnitt gegen die Testfälle, die ihn zitieren. Nicht abgedeckte Abschnitte werden markiert — der Nachweis hinter „100 % abgedeckt“."))}
      <div class="row">${pill(`${covered}/${rows.length} ${L("sections covered", "Abschnitte abgedeckt")}`, covered === rows.length ? "ok" : "warn")}${pill(L("demo catalogue is a subset", "Demo-Katalog ist eine Teilmenge"), "")}</div>
      <section class="panel"><div class="panel-body flush" style="overflow-x:auto"><div class="cov"><div class="h">§ ${L("section", "Abschnitt")}</div><div class="h">${L("criteria", "Kriterien")}</div><div class="h">${L("message tests", "Meldungstests")}</div><div class="h">${L("changed in 13.4", "geändert 13.4")}</div><div class="h">${L("status", "Status")}</div>
        ${rows.map(r => `<div><span class="mono">${r.n}</span> ${esc(r.t)} <span class="muted mono" style="font-size:11px">S. ${r.p}</span></div><div>${heat(r.c)}</div><div>${heat(r.m)}</div><div>${r.changed ? pill(L("yes", "ja"), "warn") : ""}</div><div>${r.c + r.m ? pill(L("covered", "abgedeckt"), "ok") : pill(L("no tests", "keine Tests"), "bad")}</div>`).join("")}</div></div></section>`;
  }

  /* ---------- Audit trail ---------- */
  function vLog() {
    return `${head(L("Audit trail", "Prüfpfad"), L("Every AI run, approval, edit and publication, hash-chained: each entry includes the previous entry's hash, so removing or editing one breaks the chain.", "Jeder KI-Lauf, jede Freigabe, Änderung und Veröffentlichung, per Hash verkettet: Jeder Eintrag enthält den Hash des vorherigen; Löschen oder Ändern bricht die Kette."))}
      <section class="panel"><div class="panel-body flush">${S.log.length ? S.log.slice().reverse().map(e => `<div class="log-item"><span class="log-time">${e.t.slice(11, 19)}</span><span class="avatar ${e.actor === "AI" ? "kk" : e.actor === "system" ? "" : "itsg"}" style="width:24px;height:24px;font-size:9px">${e.actor === "AI" ? "AI" : e.actor === "system" ? "⚙" : "EX"}</span><div class="stack" style="gap:2px"><span><b>${esc(e.action)}</b> ${esc(e.detail)}</span><span class="log-hash">${e.hash.slice(0, 24)}… ← ${e.prev.slice(0, 12)}…</span></div></div>`).join("") : `<div class="empty">${L("Nothing yet. Approve a rule or publish a package.", "Noch nichts. Regel freigeben oder Paket veröffentlichen.")}</div>`}</div></section>`;
  }

  /* ===================================================================================
     MESSAGES + VENDOR SIDE — email-like threads between ITSG and each vendor, in memory.
     One window: the role switch shows the other side. SAP and Lexware are illustrative
     examples; every result shown for them is imagined.
     =================================================================================== */
  const vendorOf = id => C.VENDORS.find(v => v.id === id);
  const side = () => S.role === "itsg" ? "itsg" : "vendor";
  const MSG_RULES = ["R-3.12-A", "R-3.12-B"]; // answered with a DTA file; the other rules are checked on site
  const DEADLINE = C.D("2026-12-31");
  const CLOCK0 = C.D("2026-12-01") * 1440 + 9 * 60; // demo clock in minutes
  const demoNote = () => `<p class="muted" style="font-size:var(--fs-xs)">ⓘ ${L("Demo: SAP and Lexware are illustrative examples; all results shown for them are imagined.", "Demo: SAP und Lexware sind illustrative Beispiele; alle gezeigten Ergebnisse sind erfunden.")}</p>`;
  const tick = () => (S.clock = (S.clock || CLOCK0) + 7);
  const today = () => Math.floor((S.clock || CLOCK0) / 1440);
  const fmtAt = m => `${C.de(Math.floor(m / 1440))} ${String(Math.floor(m % 1440 / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
  const txt = b => typeof b === "string" ? b : T(b);
  const reportSummary = r => r.failed.length ? `${r.passed} ${L("of", "von")} ${r.in_scope} ${L("passed — everything passes except", "bestanden — alles besteht außer")} ${r.failed.join(", ")}` : `${L("All", "Alle")} ${r.in_scope} ${L("passed", "bestanden")}`;

  /* ---------- the exchange with vendors, shared through the pipeline server ----------
     Signed in on the server, every change (conversation, message, result file, published package, certificate,
     the vendor's progress) is written to the server in order, and the page polls the shared state: ITSG and each
     vendor see the same conversations from different machines. Without a server everything stays in this page. */
  const XAPI = location.protocol.startsWith("http") ? "" : "http://localhost:8787";
  const XS = { queue: Promise.resolve(), pending: 0, busy: false, paused: false, local: false, seedTried: false, last: "" };
  const touring = () => document.body.classList.contains("touring");
  const xOn = () => !XS.paused && !XS.local && !touring() && !!(window.PIPE && PIPE.P.online && PIPE.P.session && ["itsg", "vendor"].includes(S.role) && (S.role === "itsg" || S.vendorUser));
  const xNow = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 60000);  // local minutes, like the server's "at"
  const xId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const DTA_EXT = /\.(dat|dta|txt|edi)$/i, RESULT_ACCEPT = ".dat,.dta,.txt,.edi,.xml,.csv,.json,.zip,.pdf";
  function xHeaders(json) {
    const s = window.PIPE && PIPE.P.session, h = { "X-Role": S.role, "X-User": encodeURIComponent((s && s.user) || ""), "X-Vendor": S.vendorUser || "" };
    if (s && s.token) h["X-Token"] = s.token;
    if (json) h["Content-Type"] = "application/json";
    return h;
  }
  async function xCall(path, method, body, raw) {
    const r = await fetch(XAPI + path, { method, headers: xHeaders(body != null && !raw), body: body == null ? undefined : raw ? body : JSON.stringify(body), cache: "no-store" });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || "HTTP " + r.status); }
    return raw === "bytes" ? r.arrayBuffer() : r.json().catch(() => ({}));
  }
  function xQueue(fn) {  // writes go out one after the other; the page already shows the change
    if (!xOn()) return;
    XS.pending++;
    XS.queue = XS.queue.then(fn).catch(e => toast(L("Not saved on the server: ", "Nicht auf dem Server gespeichert: ") + e.message)).finally(() => { XS.pending--; });
  }
  function enc1252(text) {  // the demo's sample files are strings decoded as windows-1252: back to their bytes
    const back = { 0x20AC: 0x80, 0x201A: 0x82, 0x0192: 0x83, 0x201E: 0x84, 0x2026: 0x85, 0x2020: 0x86, 0x2021: 0x87, 0x02C6: 0x88, 0x2030: 0x89, 0x0160: 0x8A, 0x2039: 0x8B, 0x0152: 0x8C, 0x017D: 0x8E,
      0x2018: 0x91, 0x2019: 0x92, 0x201C: 0x93, 0x201D: 0x94, 0x2022: 0x95, 0x2013: 0x96, 0x2014: 0x97, 0x02DC: 0x98, 0x2122: 0x99, 0x0161: 0x9A, 0x203A: 0x9B, 0x0153: 0x9C, 0x017E: 0x9E, 0x0178: 0x9F };
    return Uint8Array.from(text, ch => { const c = ch.charCodeAt(0); return c < 256 ? c : back[c] || 0x3F; });
  }
  const xWork = vid => { if (S.role === "vendor") xQueue(() => xCall("/api/exchange", "PATCH", { vwork: { [vid]: work(vid) } })); };
  const xRead = th => { const side = S.role === "itsg" ? "itsg" : "vendor"; if (th && th.msgs.length > (th.srvRead || 0)) { th.srvRead = th.msgs.length; xQueue(() => xCall(`/api/exchange/threads/${encodeURIComponent(th.id)}/read`, "POST", { n: th.read[side] })); } };
  function xApply(x) {
    const old = (S.mail && S.mail.files) || {};
    S.mail = { threads: x.threads.map(t => Object.assign(t, { srvRead: t.read[S.role === "itsg" ? "itsg" : "vendor"] })),
      files: Object.fromEntries(Object.entries(x.files || {}).map(([k, f]) => [k, Object.assign({}, f, old[k] && old[k].text != null ? { text: old[k].text } : {})])), certs: x.certs || {} };
    S.publishedTo = x.publishedTo || [];
    S.published = S.role === "itsg" ? S.publishedTo.length > 0 : !!x.published;
    Object.entries(x.vwork || {}).forEach(([vid, w]) => { S.vwork[vid] = w; });
  }
  async function xSync(force) {
    if (touring()) { XS.afterTour = true; return; }
    if (XS.afterTour) { XS.afterTour = false; XS.last = ""; }
    if (!xOn() || XS.busy || (XS.pending && !force)) return;
    XS.busy = true;
    try {
      let x = await xCall("/api/exchange", "GET");
      if (!x.threads.length && !XS.seedTried) {  // an empty exchange: write the opening conversations once
        XS.seedTried = true;
        const keep = S.mail; XS.local = true; S.mail = null;
        const seed = mailbox(); S.mail = keep; XS.local = false;
        await xCall("/api/exchange/seed", "POST", { threads: seed.threads });
        x = await xCall("/api/exchange", "GET");
      }
      if (XS.pending) return;  // a write started meanwhile: the next poll brings it
      const sig = JSON.stringify(x);
      if (sig === XS.last && S.mail) return;
      XS.last = sig; xApply(x);
      const a = document.activeElement, typing = a && a.matches && a.matches("textarea, input, select") && a.closest("#view");
      if (!typing && !document.querySelector("#modalHost .modal")) render(); else renderShell();
      if (window.PIPE) PIPE.notifyMail && PIPE.notifyMail();
    } catch (e) { /* offline or signed out: the page keeps its own copy */ } finally { XS.busy = false; }
  }
  function xPause(on) { XS.paused = on; if (!on) { XS.last = ""; xSync(); } }
  async function xBytes(key) {
    const f = mailbox().files[key];
    if (f && f.bytes) return f.bytes;
    if (f && f.text != null && !xOn()) return enc1252(f.text);
    return new Uint8Array(await xCall(`/api/exchange/files/${encodeURIComponent(key)}`, "GET", null, "bytes"));
  }
  function xDownload(key) {
    const f = mailbox().files[key]; if (!f) return;

  /* ---------- live extraction via hessian.AI (OpenAI-compatible) ---------- */
  async function runLive(rule) {
    const key = store.get("aikey", "");
    const fn = C.FN[rule.fn];
    const secs = [rule.sec, ...C.SPEC.sections[rule.sec].links.filter(l => C.SPEC.sections[l])];
    const context = secs.map(s => `§${s} ${C.SPEC.sections[s].title}\n${C.sectionText(s)}`).join("\n\n");
    const tool = { type: "function", function: { name: "extract_rule_parameters", description: "Return the parameters of the pre-written rule function for this spec section. Every parameter needs a verbatim quote copied character for character from the section text.", parameters: { type: "object", properties: { function_id: { type: "string", enum: Object.keys(C.FN) }, params: { type: "object", properties: Object.fromEntries(Object.entries(fn.schema).map(([k, s]) => [k, { type: "number", description: `${s.unit}` }])) }, quotes: { type: "object", properties: Object.fromEntries(Object.keys(fn.schema).map(k => [k, { type: "string" }])) }, rule_text: { type: "string", description: "The rule as one or two plain German sentences an examiner can read and approve. No numbers that are not in the quotes." } }, required: ["function_id", "params", "quotes"] } } };
    const body = { model: S.ai.model, temperature: 0, messages: [{ role: "system", content: "You extract numeric parameters from German social-insurance specifications. Never compute results. Quote the source sentence fragment verbatim (copy exactly). Answer only via the tool." }, { role: "user", content: `Function: ${rule.fn} — ${fn.title.en}\nParameters needed: ${Object.keys(fn.schema).join(", ")}\n\nSpecification (only this section and its direct links):\n${context}` }], tools: [tool], tool_choice: { type: "function", function: { name: "extract_rule_parameters" } } };
    const headers = { "Content-Type": "application/json" };
    if (S.ai.base.startsWith(location.origin)) { const tok = window.PIPE && PIPE.P.session && PIPE.P.session.token; if (tok) headers["X-Token"] = tok; } // our own proxy holds the key
    else if (key) headers.Authorization = "Bearer " + key;
    const res = await fetch(S.ai.base.replace(/\/$/, "") + "/chat/completions", { method: "POST", headers, body: JSON.stringify(body) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json(), msg = j.choices && j.choices[0] && j.choices[0].message;
    let args = msg && msg.tool_calls && msg.tool_calls[0] ? msg.tool_calls[0].function.arguments : (msg && msg.content) || "";
    if (typeof args === "string") { const m = args.match(/\{[\s\S]*\}/); args = JSON.parse(m ? m[0] : args); }
    return { params: args.params || {}, quotes: args.quotes || {}, function_id: args.function_id, text: typeof args.rule_text === "string" ? args.rule_text.trim() : null };
  }

  /* ---------- PDF ingestion via pdf.js (optional CDN extra) ---------- */
  function loadPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    return new Promise((ok, fail) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload = () => { try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; ok(window.pdfjsLib); } catch (e) { fail(e); } };
      s.onerror = () => fail(new Error("pdf.js could not be loaded"));
      document.head.appendChild(s);
    });
  }
  async function ingestPdf(file) {
    if (S.pdfBusy) return;
    S.pdfBusy = true;
    const say = h => { S.pdfStatus = h; const status = $("#pdfStatus"); if (status) status.innerHTML = h; };
    say(`<div class="callout">${L("Reading PDF…", "Lese PDF…")}</div>`);
    try {
      if (!/\.pdf$/i.test(file.name)) throw new Error(L("Choose a PDF file.", "Bitte eine PDF-Datei auswählen."));
      // The server already extracts the text. Do not start a second, CDN-dependent
      // reader that can fail independently or overwrite the upload feedback.
      const stored = window.PIPE ? await PIPE.upload(file) : null;
      if (stored) {
        S.ingested = S.ingested.filter(d => d.name !== file.name);
        S.ingested.push({ ...stored, links: null });
        say(`<div class="callout ok"><b>${esc(file.name)}</b>${stored.pages} ${L("pages", "Seiten")} · ${stored.sections} § · ${L("Ready to generate test cases", "Bereit zum Erzeugen von Testfällen")}</div>`);
        render();
        return;
      }
      const lib = await loadPdfJs();
      const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
      let links = 0, text = "", version = null;
      const heads = new Map();
      for (let p = 1; p <= doc.numPages; p++) {
        const page = await doc.getPage(p);
        const tc = await page.getTextContent();
        const t = tc.items.map(i => i.str + (i.hasEOL ? "\n" : " ")).join("");
        text += t + "\n";
        (t.match(/^\s*(\d+\.\d+(?:\.\d+){0,3})\s+[A-ZÄÖÜ„"].{3,80}$/gm) || []).forEach(h => { const m = h.trim().match(/^(\d+(?:\.\d+)+)\s+(.*)$/); if (m && !heads.has(m[1])) heads.set(m[1], { title: m[2].replace(/\.{3,}.*$/, "").trim(), page: p }); });
        const ann = await page.getAnnotations();
        links += ann.filter(a => a.subtype === "Link" && (a.dest || a.action === "GoTo" || (a.url == null && !a.unsafeUrl))).length;
        if (p % 10 === 0) say(`<div class="callout">${L("Reading page", "Lese Seite")} ${p} / ${doc.numPages} · ${heads.size} § · ${links} ${L("links", "Links")}</div>`);
      }
      const vm = text.match(/Version\s+(\d+\.\d+)/); version = vm ? vm[1] : null;
      const logRefs = (text.match(/(?:Änderungsübersicht|Änderungshistorie)[\s\S]{0,20000}/) || [""])[0].match(/\d+(?:\.\d+)+\s+[„"]/g) || [];
      S.ingested = S.ingested.filter(d => d.name !== file.name);
      S.ingested.push({ name: file.name, pages: doc.numPages, sections: heads.size, links, version });

      body: { en: "The AI turns the spec sentence into a rule in plain language and quotes the spec word for word. The examiner reads it, edits it if needed, and approves or declines it. “Show in document” jumps to the highlighted sentence in the original PDF.", de: "Die KI macht aus dem Satz eine Regel in Klartext und zitiert die Spezifikation wörtlich. Der Prüfer liest sie, ändert sie bei Bedarf und gibt sie frei oder lehnt sie ab. „Im Dokument zeigen“ springt zum markierten Satz im Original-PDF." },
      notes: { en: ["ITSG's feedback: “you can't see the text”, so the readable rule is now the main content.", "ITSG calls these criteria or questions; same thing.", "Edit the wording live to show it isn't locked."], de: ["Feedback von ITSG: „Man sieht den Text nicht“, deshalb ist die lesbare Regel jetzt der Hauptinhalt.", "ITSG nennt das Kriterien oder Fragen; dasselbe.", "Den Wortlaut live ändern, um zu zeigen, dass er nicht fest ist."] } },
    { ch: "req", obj: 2, screen: "extract", sel: "[data-tour=approve]", before: () => { S.selRule = "R-3.12-B"; S.techOpen = false; }, after: () => setTimeout(() => { if (STEPS[idx] !== STEPS[4]) return; approve("R-3.12-B"); ["R-3.12-A", "R-3.12.5", "R-3.7.3"].forEach(id => { if (S.rules[id].status === "pending") S.rules[id].status = "approved"; }); A.render(); TOUR.spot(); }, 1800),
      cap: { today: { en: "Review thousands of test cases", de: "Tausende Testfälle prüfen" }, now: { en: "Approve each rule once, after five automatic checks", de: "Jede Regel einmal freigeben, nach fünf automatischen Prüfungen" } },
      title: { en: "Approve once per rule, not 3,000 test cases", de: "Einmal je Regel freigeben, nicht 3.000 Testfälle" },
      body: { en: "Five automatic checks ran first: every quote is verbatim, every number is in its quote, values are in range, two independent AI runs agree, and the function's tests pass. The examiner signs off the rule, and the other rules are approved the same way. Every decision lands in a hash-chained audit trail.", de: "Vorher liefen fünf automatische Prüfungen: Jedes Zitat ist wörtlich, jede Zahl steht im Zitat, die Werte liegen im Bereich, zwei unabhängige KI-Läufe stimmen überein, und die Funktionstests bestehen. Der Prüfer gibt die Regel frei, die anderen Regeln genauso. Jede Entscheidung landet in einem verketteten Prüfpfad." },
      notes: { en: ["The five checks are under “Technical details” on this screen, for the jury and auditors.", "When the two AI runs disagree, approval is blocked: see the maternity rule.", "Editing a number creates a new parameter set and recomputes every expected value."], de: ["Die fünf Prüfungen stehen unter „Technische Details“ auf dieser Seite, für Jury und Prüfer.", "Wenn die zwei KI-Läufe sich widersprechen, ist die Freigabe gesperrt: siehe Mutterschutz-Regel.", "Eine geänderte Zahl erzeugt einen neuen Parametersatz und berechnet alle Erwartungswerte neu."] } },
    { ch: "test", obj: 3, screen: "tests", sel: "[data-tour=changedtest]", before: () => { S.testTab = "rules"; S.expandRule = null; },
      cap: { today: { en: "Find and rewrite affected tests by hand", de: "Betroffene Tests suchen und von Hand umschreiben" }, now: { en: "Expected result recomputed: no request 41 → request 41", de: "Erwartungswert neu berechnet: keine Anfrage 41 → Anfrage 41" } },
      title: { en: "The test that changed", de: "Der Test, der sich geändert hat" },
      body: { en: "Same employee, new law. Under v13.3 a gap of exactly six months broke the chain: only 12 days counted, so no request 41. Under v13.4 both periods count: 32 days, so request 41 goes out with two periods. Tested code recomputed the expected result; nobody rewrote it by hand.", de: "Derselbe Arbeitnehmer, neues Recht. Unter v13.3 beendete eine Lücke von genau sechs Monaten die Kette: Nur 12 Tage zählten, also keine Anfrage 41. Unter v13.4 zählen beide Zeiträume: 32 Tage, also geht Anfrage 41 mit zwei Zeiträumen raus. Getesteter Code hat das Ergebnis neu berechnet; niemand hat es von Hand umgeschrieben." },
      notes: { en: ["This is ITSG's #1 pain: spec change → affected test → updated expected result.", "The old catalogue row ALT-3.12-031 tested the opposite; the coverage check flags it as obsolete.", "Click the v13.4 result for its full trail (next step)."], de: ["Das ist der größte Schmerz bei ITSG: Spezifikationsänderung → betroffener Test → neuer Erwartungswert.", "Die alte Katalogzeile ALT-3.12-031 prüfte das Gegenteil; die Abdeckungsprüfung markiert sie als veraltet.", "Ein Klick auf das v13.4-Ergebnis zeigt die ganze Herkunft (nächster Schritt)."] } },
    { ch: "test", obj: 4, screen: "tests", sel: "#drawer", noZoom: true, before: () => { S.testTab = "rules"; S.expandRule = null; }, after: () => A.openProv("b6m.new"),
      cap: { today: { en: "Expected values calculated by hand, no trail", de: "Erwartungswerte von Hand gerechnet, ohne Nachweis" }, now: { en: "Every value traces back to the German sentence", de: "Jeder Wert führt zurück zum deutschen Satz" } },
      title: { en: "Every expected value traces back to the spec", de: "Jeder Erwartungswert führt zurück zur Spezifikation" },
      body: { en: "Click any result to see its trail: the German sentence, the number the AI read from it, the function and version that did the calculation, the inputs and each step. An engineer can trust the number without having to trust the AI.", de: "Ein Klick auf ein Ergebnis zeigt seine Herkunft: den deutschen Satz, die Zahl, die die KI daraus gelesen hat, die rechnende Funktion mit Version, die Eingaben und jeden Schritt. Ein Ingenieur kann der Zahl vertrauen, ohne der KI vertrauen zu müssen." },
      notes: { en: ["The AI only found the sentence and read “6 Monate”; code did the rest.", "ITSG's reference case (Peter Mustermann) has the same trails on the Overview."], de: ["Die KI hat nur den Satz gefunden und „6 Monate“ gelesen; den Rest hat Code gemacht.", "Der ITSG-Referenzfall (Peter Mustermann) hat dieselben Herkunftsnachweise im Überblick."] } },
    { ch: "test", obj: 3, screen: "tests", sel: "[data-tour=firstcase]", before: () => { S.testTab = "rules"; S.expandRule = null; },
      cap: { today: { en: "Many cases per rule, all typed in by hand", de: "Viele Fälle je Regel, alle von Hand getippt" }, now: { en: "One case per rule, in ITSG's own words", de: "Ein Fall je Regel, in den Worten von ITSG" } },
      title: { en: "One test case per rule, in ITSG's own words", de: "Ein Testfall je Regel, in den Worten von ITSG" },
      body: { en: "Vendors type every case in by hand today, so each rule starts with one representative case, described the way ITSG writes them and with its expected result calculated by code. This one is ITSG's own example: an earlier illness more than six months back, so no message 41. The full boundary set is one click away.", de: "Hersteller tippen heute jeden Fall von Hand ein, deshalb beginnt jede Regel mit einem repräsentativen Fall, so beschrieben, wie ITSG es tut, mit von Code berechnetem Ergebnis. Dieser ist das Beispiel von ITSG: eine Vorerkrankung mehr als sechs Monate zurück, also keine Meldung 41. Alle Grenzfälle sind einen Klick entfernt." },
      notes: { en: ["ITSG: “for each rule, one test case would be enough, for the first step.” 12 for one rule was “a bit much”.", "“Fresh variants” generates new names and dates every cycle, so vendors can't fit answers to known solutions.", "Each case downloads as JSON test input."], de: ["ITSG: „Für jede Regel wäre ein Testfall genug, für den ersten Schritt.“ 12 für eine Regel waren „etwas viel“.", "„Frische Varianten“ erzeugt jede Runde neue Namen und Daten, damit Hersteller Antworten nicht an bekannte Lösungen anpassen können.", "Jeder Fall lässt sich als JSON-Testeingabe laden."] } },
    { ch: "test", obj: 1, screen: "baseline", sel: "[data-tour=baseline]",
      cap: { today: { en: "30 years of tests, and nobody knows which are obsolete", de: "30 Jahre Tests, niemand weiß, welche veraltet sind" }, now: { en: "Every sentence mapped to a test, obsolete tests flagged", de: "Jeder Satz einem Test zugeordnet, veraltete Tests markiert" } },
      title: { en: "Coverage: every sentence has a test, and old tests get checked too", de: "Abdeckung: Jeder Satz hat einen Test, und alte Tests werden mitgeprüft" },
      body: { en: "Each test-relevant sentence of the spec is matched to the tests that cover it, and sentences without a test are flagged as missing. The old catalogue is checked against the current law too: ALT-3.12-031 still expects the old v13.3 boundary, so it's flagged obsolete.", de: "Jeder prüfrelevante Satz der Spezifikation wird den Tests zugeordnet, die ihn abdecken; Sätze ohne Test werden als fehlend markiert. Auch der alte Katalog wird gegen das geltende Recht geprüft: ALT-3.12-031 erwartet noch die alte Grenze aus v13.3 und wird als veraltet markiert." },
      notes: { en: ["ITSG's own idea: “after 30 years I would not be sure there are no test cases that have been removed by law.”", "The three ALT-… rows are simulated; we need the real ~4,000 scenarios (Gerhard knows where they are).", "Missing example: §3.12.6 now also applies to reasons 11 and 12, and no test covers that yet."], de: ["Die Idee von ITSG: „Nach 30 Jahren wäre ich nicht sicher, dass keine Testfälle drin sind, die per Gesetz entfallen sind.“", "Die drei ALT-…-Zeilen sind simuliert; wir brauchen die echten ~4.000 Szenarien (Gerhard weiß, wo sie liegen).", "Beispiel fehlend: §3.12.6 gilt jetzt auch für Abgabegrund 11 und 12, und dafür gibt es noch keinen Test."] } },
    { ch: "test", obj: 3, screen: "inbox", sel: "[data-tour=publishrow]", after: () => setTimeout(() => { if (STEPS[idx] !== STEPS[9]) return; if (!S.published) { const b = document.querySelector('[data-act="publish"]'); if (b) b.click(); TOUR.spot(); } }, 1400),
      cap: { today: { en: "Vendors type every case into their software", de: "Hersteller tippen jeden Fall in ihre Software" }, now: { en: "The same cases as importable JSON (proposal, SAP pilot)", de: "Dieselben Fälle als importierbares JSON (Vorschlag, Pilot SAP)" } },
      title: { en: "Publish, and stop typing test cases in", de: "Veröffentlichen, und keine Testfälle mehr abtippen" },
      body: { en: "The package goes to the vendors through Messages. Our proposal: the same cases as JSON that the payroll software imports, while the output stays the standard DTA file. That needs a spec change, so start with SAP.", de: "Das Paket geht über Nachrichten an die Hersteller. Unser Vorschlag: dieselben Fälle als JSON, das die Abrechnungssoftware importiert; die Ausgabe bleibt die Standard-DTA-Datei. Das braucht eine Spezifikationsänderung, also mit SAP beginnen." },
      notes: { en: ["ITSG's steer: “work on the idea of how to do the input automatically.”", "“Start with SAP: many of our customers use it.”", "Expected results stay with ITSG; vendors never see them."], de: ["Hinweis von ITSG: „Arbeitet an der Idee, wie man die Eingabe automatisiert.“", "„Fangt mit SAP an: Viele unserer Kunden nutzen es.“", "Erwartungswerte bleiben bei ITSG; Hersteller sehen sie nie."] } },
    { ch: "res", obj: 5, screen: "vhome", sel: "[data-tour=vsteps]", noZoom: true, before: () => { A.vendorDemo("sap", false); },
      cap: { today: { en: "Test packages scattered across e-mails and PDFs", de: "Testpakete verstreut in E-Mails und PDFs" }, now: { en: "SAP sees its status, its next step and its deadline", de: "SAP sieht Stand, nächsten Schritt und Frist" } },
      title: { en: "The vendor's side: SAP signs in", de: "Die Herstellersicht: SAP meldet sich an" },
      body: { en: "Same tool, other role. SAP sees only its own certification: where it stands, the next step, the days left until 31.12.2026, and what ITSG will check on site. The package has just arrived in Messages.", de: "Dasselbe Werkzeug, andere Rolle. SAP sieht nur die eigene Zertifizierung: Stand, nächster Schritt, Tage bis 31.12.2026 und was ITSG vor Ort prüft. Das Paket ist gerade unter Nachrichten angekommen." },
      notes: { en: ["SAP and Lexware are illustrative — all results are imagined (the label says so on every results screen).", "My test cases: each case in words, “mark as entered” or import the JSON, then send the result file.", "Expected results are never shown to vendors — nothing to fit answers to."], de: ["SAP und Lexware sind illustrativ — alle Ergebnisse sind erfunden (das steht auf jeder Ergebnisseite).", "Meine Testfälle: jeder Fall in Worten, „als eingegeben markieren“ oder JSON importieren, dann Ergebnisdatei senden.", "Erwartungswerte sieht der Hersteller nie — es gibt nichts, woran er Antworten anpassen könnte."] } },
    { ch: "res", obj: 5, screen: "mail", sel: "[data-tour=thread]", noZoom: true, before: () => { A.vendorDemo("sap", true); },
      cap: { today: { en: "Results and verdicts spread across mailboxes", de: "Ergebnisse und Urteile über Postfächer verteilt" }, now: { en: "One thread: package in, result out, verdict back", de: "Ein Verlauf: Paket rein, Ergebnis raus, Urteil zurück" } },
      title: { en: "Messages: package in, result out, verdict back", de: "Nachrichten: Paket rein, Ergebnis raus, Urteil zurück" },
      body: { en: "Like e-mail, but every attachment is live. ITSG's package arrived here; SAP sent its result file back, and the comparison posted the verdict in words at once. ITSG answers in the same thread — request a fix, send the report, or issue the certificate.", de: "Wie E-Mail, aber jeder Anhang ist lebendig. Das Paket von ITSG kam hier an; SAP hat die Ergebnisdatei zurückgeschickt, und der Vergleich hat das Urteil sofort in Worten gepostet. ITSG antwortet im selben Verlauf — Korrektur anfordern, Bericht senden oder Zertifikat erteilen." },
      notes: { en: ["Attach rules, test cases, result files or reports — the other side opens them with one click.", "Switch to ITSG: “Issue certificate” only unlocks when nothing failed (try Lexware).", "“Ask ITSG” on any test case opens a message with that case attached."], de: ["Regeln, Testfälle, Ergebnisdateien oder Berichte anhängen — die andere Seite öffnet sie mit einem Klick.", "Zu ITSG wechseln: „Zertifikat erteilen“ geht nur, wenn nichts fehlgeschlagen ist (Lexware ausprobieren).", "„ITSG fragen“ an jedem Testfall öffnet eine Nachricht mit diesem Fall im Anhang."] } },
    { ch: "res", obj: 5, screen: "validate", sel: "[data-tour=words]", before: () => { S.role = "itsg"; S.sample = "gap"; S.selField = null; S.valTab = "words"; },
      cap: { today: { en: "Red bytes, looked up field by field", de: "Rote Bytes, Feld für Feld nachgeschlagen" }, now: { en: "Each difference explained in a sentence, with its §", de: "Jede Abweichung als Satz erklärt, mit ihrem §" } },
      title: { en: "A wrong file, explained in words", de: "Eine falsche Datei, in Worten erklärt" },
      body: { en: "This vendor file sends one period too many: an illness from November 2024 that lies more than six months before the next one, our §3.12 rule again. Instead of red bytes to decode by hand, each difference reads as a sentence with its field and §. The byte view is one tab away.", de: "Diese Herstellerdatei sendet einen Zeitraum zu viel: eine Erkrankung aus November 2024, die mehr als sechs Monate vor der nächsten liegt, wieder unsere Regel aus §3.12. Statt roter Bytes zum Nachschlagen steht jede Abweichung als Satz da, mit Feld und §. Die Byte-Ansicht ist einen Reiter entfernt." },
      notes: { en: ["The real ITSG file TEEL0-Test1-DBVO passes every check and matches our expected block byte for byte: pick it in the file list.", "ITSG: “It could be very helpful, but there mustn't be any errors.” The explanations are computed, not generated.", "Zero tolerance: one wrong field and the release is blocked."], de: ["Die echte ITSG-Datei TEEL0-Test1-DBVO besteht alle Prüfungen und gleicht unserem Erwartungswert Byte für Byte: in der Dateiliste auswählen.", "ITSG: „Es könnte sehr hilfreich sein, aber es darf keine Fehler geben.“ Die Erklärungen sind berechnet, nicht generiert.", "Null Toleranz: ein falsches Feld und die Version wird gesperrt."] } },
    { ch: "res", obj: 6, screen: "report", sel: "[data-tour=allvendors]", before: () => { S.role = "itsg"; S.vendor = "sap"; },
      cap: { today: { en: "Reports assembled by hand", de: "Berichte von Hand zusammengestellt" }, now: { en: "Pass/fail per vendor, as print or JSON, with the next scope set", de: "Bestanden/nicht bestanden je Hersteller, druckbar oder als JSON, nächster Umfang gesetzt" } },
      title: { en: "Pass/fail per vendor, ready to print or send", de: "Bestanden/nicht bestanden je Hersteller, druckbar und versendbar" },
      body: { en: "The on-site audit only checked what failed last year, changed or is new. The report says in numbers and in words how many passed and which one failed. One fail, so SAP isn't certified yet. Each report prints, exports as JSON per vendor, carries a seal, and sets the next audit scope.", de: "Die Vor-Ort-Prüfung umfasste nur, was letztes Jahr fehlschlug, sich änderte oder neu ist. Der Bericht sagt in Zahlen und Worten, wie viele bestanden und welcher nicht. Ein Fehler, also ist SAP noch nicht zertifiziert. Jeder Bericht ist druckbar, als JSON je Hersteller ladbar, versiegelt und legt den nächsten Prüfumfang fest." },
      notes: { en: ["In this imagined run SAP fails one new 13.4 criterion (a cancellation must repeat the names). Zero tolerance: one fail blocks the release.", "ITSG asked for exactly this: “how many passed, how many failed, every test case; print it or give it as JSON for each customer.”", "Lexware passes: click its row."], de: ["In diesem erfundenen Durchlauf fällt SAP bei einem neuen 13.4-Kriterium durch (eine Stornierung muss die Namen wiederholen). Null Toleranz: ein Fehler sperrt die Version.", "Genau das hat ITSG gefragt: „wie viele bestanden, wie viele nicht, jeder Testfall; drucken oder als JSON für jeden Kunden.“", "Lexware besteht: Zeile anklicken."] } },
    { ch: "close", screen: "overview", sel: "[data-tour=recap]", noZoom: true, before: () => { S.recap = true; },
      cap: { today: { en: "Weeks of reading and typing", de: "Wochen des Lesens und Tippens" }, now: { en: "One session, and every value is traceable", de: "Eine Sitzung, und jeder Wert ist nachvollziehbar" } },
      title: { en: "One sentence, start to finish, in one session", de: "Ein Satz, von Anfang bis Ende, in einer Sitzung" },
      body: { en: "From the new PDF to an updated, approved, traceable test and a vendor verdict. The AI reads and drafts, tested code calculates, examiners decide. Today the same work takes weeks of reading and typing.", de: "Vom neuen PDF zum aktualisierten, freigegebenen, nachvollziehbaren Test und zum Urteil über einen Hersteller. Die KI liest und formuliert, getesteter Code rechnet, Prüfer entscheiden. Heute kostet dieselbe Arbeit Wochen des Lesens und Tippens." },
      notes: { en: ["Ask: the real v13.3 PDF, the ~4,000 real test scenarios, and whether ITSG would back a JSON input interface with SAP as pilot.", "Sovereign AI: it runs on Kolibri-1 (German, open weights, self-hostable).", "Everything shown is running code; only the SAP and Lexware results are imagined."], de: ["Bitte: das echte v13.3-PDF, die ~4.000 echten Testszenarien und ob ITSG eine JSON-Eingabeschnittstelle mit SAP als Pilot unterstützen würde.", "Souveräne KI: läuft auf Kolibri-1 (deutsch, offene Gewichte, selbst hostbar).", "Alles Gezeigte ist laufender Code; nur die Ergebnisse von SAP und Lexware sind erfunden."] } }
  ];

  let idx = -1, presenter = null, chan = null;
  try { chan = new BroadcastChannel("eelra-tour"); } catch (e) { chan = null; }
  const send = msg => { try { if (presenter && !presenter.closed) presenter.postMessage(msg, "*"); } catch (e) { /* ignore */ } try { if (chan) chan.postMessage(msg); } catch (e) { /* ignore */ } };
  const state = () => ({ type: "tour", idx, lang: S.lang });

  function host() { return $("#tourHost"); }
  function card() {
    const s = STEPS[idx];
    if (presenterLive && presenter && presenter.closed) presenterLive = false;
    host().innerHTML = `<div class="tour-spot" id="tourSpot"></div><div class="tour-card" id="tourCard" role="dialog" aria-live="polite">
      <div class="tour-chapters">${Object.keys(CHAPTERS).map(ch => { const ids = STEPS.map((x, i) => x.ch === ch ? i : -1).filter(i => i >= 0); return `<div class="tour-ch ${s.ch === ch ? "cur" : ""}" style="flex:${ids.length} 1 0"><b>${T(CHAPTERS[ch])}</b><div class="tour-progress">${ids.map(i => `<i class="${i <= idx ? "on" : ""}"></i>`).join("")}</div></div>`; }).join("")}</div>
      <div class="tour-text"><div class="row"><span class="eyebrow" style="white-space:nowrap">${idx + 1} / ${STEPS.length}</span><h3>${T(s.title)}</h3>${s.obj ? `<span class="pill info" style="white-space:nowrap">${L("ITSG objective", "ITSG-Ziel")} ${s.obj} · ${T(OBJECTIVES[s.obj])}</span>` : ""}</div>${presenterLive ? capStrip(s) : `<p>${T(s.body)}</p>`}</div>
      <div class="tour-ctrl"><div class="actions"><button class="btn sm" data-tour-act="prev" ${idx === 0 ? "disabled" : ""}>${L("Back", "Zurück")}</button><button class="btn sm primary" data-tour-act="next">${idx === STEPS.length - 1 ? L("Finish", "Beenden") : L("Next", "Weiter")}</button><button class="btn sm ghost" data-tour-act="end">${L("End", "Ende")}</button></div>
        <div class="row" style="gap:4px">${presenterLive ? `<span class="muted" style="font-size:var(--fs-xs)">${L("Notes are on the presenter screen", "Notizen auf dem Referentenbildschirm")}</span>` : `<button class="btn sm ghost" data-tour-act="notes" aria-expanded="${notesOpen}">${notesOpen ? L("Hide notes", "Notizen ausblenden") : L("Speaker notes", "Sprechernotizen")}</button><button class="btn sm ghost" data-tour-act="presenter">${L("Presenter window", "Referentenfenster")}</button>`}<span class="muted" style="font-size:var(--fs-xs)"><span class="kbd">←</span> <span class="kbd">→</span> <span class="kbd">N</span> <span class="kbd">P</span> <span class="kbd">Esc</span></span></div></div>
      ${notesOpen && !presenterLive ? `<div class="tour-notes callout"><ul>${T(s.notes).map(n => `<li>${n}</li>`).join("")}</ul></div>` : ""}</div>`;
  }
  let presenterBlocked = false, notesOpen = false, presenterLive = false, lastCmd = null;
  const capStrip = s => s.cap ? `<div class="tour-cap"><span class="today"><b>${L("Today", "Heute")}</b>${T(s.cap.today)}</span><span class="arrow" aria-hidden="true">→</span><span class="now"><b>${L("With the assistant", "Mit dem Assistenten")}</b>${T(s.cap.now)}</span></div>` : "";
  const setPresenterLive = on => { if (presenterLive !== on) { presenterLive = on; refresh(); } };
  const toggleNotes = () => { notesOpen = !notesOpen; card(); spot(); };
  /* Place the spotlight on el, clipped to the visible band between the top bar and the docked tour bar. */
  function place(el, sp) {
    const r = el.getBoundingClientRect(), topB = el.id === "drawer" ? 4 : $("#bar").getBoundingClientRect().bottom + 4, botB = innerHeight - (($("#tourCard") || { offsetHeight: 0 }).offsetHeight) - 4;
    const top = Math.max(topB, r.top - 6), bottom = Math.min(botB, r.bottom + 6);
    Object.assign(sp.style, { opacity: bottom > top ? "1" : "0", left: Math.max(4, r.left - 6) + "px", top: top + "px", width: Math.min(innerWidth - 8, r.width + 12) + "px", height: Math.max(0, bottom - top) + "px" });
  }
  function spot() {
    const s = STEPS[idx]; if (!s) return;
    const el = document.querySelector(s.sel), sp = document.getElementById("tourSpot"), main = $("#main");
    if (!el || !sp) { if (sp) sp.style.opacity = "0"; return; }
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    // Centre the target in the space between the top bar and the docked tour bar.
    if (!s.noZoom) {
      const r = el.getBoundingClientRect(), top = $("#bar").offsetHeight, cardH = ($("#tourCard") || { offsetHeight: 0 }).offsetHeight;
      const room = innerHeight - top - cardH;
      window.scrollTo({ top: Math.max(0, scrollY + r.top - top - Math.max(12, (room - r.height) / 2)), behavior: reduce ? "auto" : "smooth" });
    }
    const zoom = s.noZoom || reduce || innerWidth < 900 ? 1 : (s.zoom || 1.035);
    setTimeout(() => {
      const r0 = el.getBoundingClientRect(), mr = main.getBoundingClientRect();
      main.style.transformOrigin = `${r0.left + r0.width / 2 - mr.left}px ${r0.top + r0.height / 2 - mr.top}px`;
      main.style.transform = zoom === 1 ? "" : `scale(${zoom})`;
      setTimeout(() => place(el, sp), reduce ? 0 : 620);
    }, reduce ? 0 : 420);
  }
  function show(i) {
    if (i < 0 || i >= STEPS.length) return end();
    idx = i;
    const s = STEPS[idx];
    $("#main").style.transform = "";
    A.closeDrawer();
    S.role = "itsg"; // vendor steps switch to the vendor role in their own `before`
    if (s.before) s.before();
    A.go(s.screen);
    card();
    setTimeout(() => { if (s.after) s.after(); spot(); }, 120);
    send(state());
  }
  function start() { if (idx < 0) A.log("system", L("Guided demo started", "Geführte Demo gestartet"), ""); S.role = "itsg"; document.body.classList.add("touring"); show(0); }

    if (!P.runId) return `${head(L("AI test pipeline", "KI-Testpipeline"), L("Drop a new spec PDF, then press “Generate test cases”. The pipeline diffs it against the previous version in docs/law_file — or, without one, uses the document on its own — and the AI turns every change into a spec-change JSON and test cases.", "Neue Spezifikation ablegen, dann „Testfälle erzeugen“ drücken. Die Pipeline vergleicht sie mit der Vorfassung in docs/law_file — oder nutzt ohne Vorfassung das Dokument allein — und die KI macht aus jeder Änderung ein Änderungs-JSON und Testfälle."), `<button class="btn primary" data-act="go" data-screen="ingest">${ic("upload")} ${L("Go to the PDF drop", "Zur PDF-Ablage")}</button>`)}<div class="empty">${L("No run yet.", "Noch kein Lauf.")}</div>`;
