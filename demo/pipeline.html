<title>EEL Review Assistant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Demo: AI-assisted system review for income replacement benefits (DTA EEL), built for the ITSG challenge at Futury Build Days 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: sticky top bar · left pipeline rail (the nav IS the pipeline) · working canvas · right provenance drawer.
   Design tokens below are the single source of truth (Claude Design friendly: tokens → components). */
:root {
  /* colour */
  --bg: #f6f4f4;
  --surface: #ffffff;
  --surface-2: #f1eeee;
  --surface-3: #e9e4e4;
  --line: #e0d9d9;
  --line-strong: #c9c0c1;
  --fg: #1c1819;
  --fg-2: #3d3537;
  --muted: #6d6366;
  --accent: #b0142f;
  --accent-ink: #ffffff;
  --accent-soft: #f8e1e5;
  --accent-line: #e8a9b4;
  --ok: #1d7347; --ok-soft: #e0f1e7;
  --warn: #9a5b00; --warn-soft: #fbeed6;
  --bad: #b3261e; --bad-soft: #fde3e0;
  --info: #285a9c; --info-soft: #e2ebf7;
  --hl-cond: #dbe8fb; --hl-cond-line: #6f9ee0;
  --hl-param: #fde9b8; --hl-param-line: #d49a12;
  --hl-field: #ebe0fb; --hl-field-line: #9a72d8;
  --hl-exc: #fbe0e0; --hl-exc-line: #d76b6b;
  --shadow: 0 1px 2px rgba(40, 20, 24, .06), 0 6px 24px rgba(40, 20, 24, .07);
  --scrim: rgba(20, 12, 14, .62);
  /* type */
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  --fs-xs: .75rem; --fs-sm: .8125rem; --fs-md: .9375rem; --fs-lg: 1.125rem; --fs-xl: 1.5rem; --fs-2xl: 2rem;
  /* shape & space */
  --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;
  --rail-w: 236px; --drawer-w: 440px; --bar-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131112; --surface: #1b1819; --surface-2: #231f20; --surface-3: #2c2728; --line: #342e30; --line-strong: #4a4144;
    --fg: #f0ebec; --fg-2: #d6cfd0; --muted: #a59a9d;
    --accent: #f0566c; --accent-ink: #1b0a0d; --accent-soft: #3b1a20; --accent-line: #7c3341;
    --ok: #57c88f; --ok-soft: #15301f; --warn: #e8a73e; --warn-soft: #34270f; --bad: #f2685b; --bad-soft: #3b1916; --info: #80aef0; --info-soft: #172639;
    --hl-cond: #1b2f4d; --hl-cond-line: #5b8ad0; --hl-param: #3d3011; --hl-param-line: #c4901b; --hl-field: #2c2145; --hl-field-line: #9a7ad8; --hl-exc: #3d1d1d; --hl-exc-line: #d77070;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45); --scrim: rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131112; --surface: #1b1819; --surface-2: #231f20; --surface-3: #2c2728; --line: #342e30; --line-strong: #4a4144;
  --fg: #f0ebec; --fg-2: #d6cfd0; --muted: #a59a9d;
  --accent: #f0566c; --accent-ink: #1b0a0d; --accent-soft: #3b1a20; --accent-line: #7c3341;
  --ok: #57c88f; --ok-soft: #15301f; --warn: #e8a73e; --warn-soft: #34270f; --bad: #f2685b; --bad-soft: #3b1916; --info: #80aef0; --info-soft: #172639;
  --hl-cond: #1b2f4d; --hl-cond-line: #5b8ad0; --hl-param: #3d3011; --hl-param-line: #c4901b; --hl-field: #2c2145; --hl-field-line: #9a7ad8; --hl-exc: #3d1d1d; --hl-exc-line: #d77070;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45); --scrim: rgba(0,0,0,.7);
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 var(--fs-md)/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -.005em; }
h1 { font-size: var(--fs-2xl); } h2 { font-size: var(--fs-xl); } h3 { font-size: var(--fs-lg); } h4 { font-size: var(--fs-md); }
p { margin: 0; max-width: 68ch; }
table { font-size: inherit; border-collapse: collapse; }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-mono); font-size: .92em; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font: 600 var(--fs-xs)/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.de-quote { font-family: var(--font-body); font-style: italic; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- shell ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; height: var(--bar-h); display: flex; align-items: center; gap: var(--s-3);
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 13px/1 var(--font-mono); flex: none; }
.brand-name { font: 600 var(--fs-lg)/1 var(--font-display); white-space: nowrap; }
.brand-sub { font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-spacer { flex: 1; }
.bar-tools { display: flex; align-items: center; gap: var(--s-2); flex-wrap: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: var(--fs-sm); color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); font-weight: 600; }
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: calc(100% - var(--bar-h)); }
.rail { border-right: 1px solid var(--line); background: var(--surface); padding: var(--s-4) var(--s-3); position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--bar-h)); overflow: auto; }
.rail-group { display: grid; gap: 2px; margin-bottom: var(--s-4); }
.rail-label { padding: 0 var(--s-2) var(--s-1); }
.nav-btn { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: var(--r-md); cursor: pointer; color: var(--fg-2); font-size: var(--fs-sm); }
.nav-btn:hover { background: var(--surface-2); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.nav-step { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font: 600 11px/1 var(--font-mono); color: var(--muted); background: var(--surface); }
.nav-btn[aria-current="page"] .nav-step { border-color: var(--accent); color: var(--accent); }
.nav-btn.done .nav-step { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.nav-badge { font: 600 11px/1 var(--font-mono); padding: 3px 6px; border-radius: 999px; background: var(--surface-3); color: var(--fg-2); }
.nav-badge.hot { background: var(--accent); color: var(--accent-ink); }
.main { min-width: 0; padding-block: var(--s-5) var(--s-6); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transform-origin: 50% 0; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
.main-inner { max-width: 1240px; margin: 0 auto; display: grid; gap: var(--s-5); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s-4); flex-wrap: wrap; }
.page-head-text { display: grid; gap: 6px; min-width: 0; }
.page-head p { color: var(--muted); }
.actions { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; }

/* ---------- components ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); padding: 7px 12px; border-radius: var(--r-md); cursor: pointer; font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--fg-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 4px 9px; font-size: var(--fs-xs); }
.btn.ok { border-color: var(--ok); color: var(--ok); }
.btn.bad { border-color: var(--bad); color: var(--bad); }
.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-body { padding: var(--s-4); display: grid; gap: var(--s-3); min-width: 0; }
.panel-body.flush { padding: 0; }
.panel-body > * { min-width: 0; } /* grid children default to min-content: a long file name would widen the whole panel */
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-4); }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-4); }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-3); }
.split { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: var(--s-4); align-items: start; }
.stack { display: grid; gap: var(--s-3); min-width: 0; }
.row { display: flex; gap: var(--s-2); align-items: center; flex-wrap: wrap; min-width: 0; }
.row.between { justify-content: space-between; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font: 600 11px/1.6 var(--font-body); letter-spacing: .02em; white-space: nowrap; background: var(--surface-3); color: var(--fg-2); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.mono { font-family: var(--font-mono); font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.kpi { padding: var(--s-4); display: grid; gap: 4px; }
.kpi-value { font: 600 var(--fs-2xl)/1 var(--font-display); font-variant-numeric: tabular-nums; }
.kpi-label { font-size: var(--fs-sm); color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; font-size: var(--fs-sm); }
.tbl th { text-align: left; font: 600 var(--fs-xs)/1.3 var(--font-body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.clickable { cursor: pointer; }
.tbl tr.clickable:hover td { background: var(--surface-2); }
.tbl tr.sel td { background: var(--accent-soft); }
.list { display: grid; }
.list-item { display: grid; gap: 4px; padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; border-left: 3px solid transparent; background: transparent; border-top: 0; border-right: 0; width: 100%; }
.list-item:hover { background: var(--surface-2); }
.list-item[aria-selected="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.list-item:last-child { border-bottom: 0; }
.sev { width: 4px; align-self: stretch; border-radius: 2px; }
.callout { border: 1px solid var(--line); border-left: 4px solid var(--info); background: var(--info-soft); border-radius: var(--r-md); padding: var(--s-3) var(--s-4); font-size: var(--fs-sm); display: grid; gap: 4px; }
.callout.warn { border-left-color: var(--warn); background: var(--warn-soft); }
.callout.ok { border-left-color: var(--ok); background: var(--ok-soft); }
.callout.bad { border-left-color: var(--bad); background: var(--bad-soft); }
.callout.accent { border-left-color: var(--accent); background: var(--accent-soft); }
.code { font: 400 12.5px/1.55 var(--font-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s-3); overflow-x: auto; white-space: pre; margin: 0; }
.field-label { font-size: var(--fs-xs); color: var(--muted); }
.input, .select, .textarea { width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-md); padding: 7px 10px; font-size: var(--fs-sm); }
.textarea { min-height: 80px; resize: vertical; font-family: var(--font-mono); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: var(--fs-sm); }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font-size: var(--fs-sm); color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.empty { padding: var(--s-6); text-align: center; color: var(--muted); font-size: var(--fs-sm); }
.toast-host { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: grid; gap: 8px; }
body.touring .toast-host { top: calc(var(--bar-h) + 12px); bottom: auto; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: var(--r-md); font-size: var(--fs-sm); box-shadow: var(--shadow); max-width: min(360px, calc(100vw - 32px)); overflow-wrap: anywhere; animation: toast-in .25s ease-out; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }

/* ---------- pipeline map ---------- */
.pipe { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
.pipe-step { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 10px; text-align: left; cursor: pointer; display: grid; gap: 4px; min-width: 0; }
.pipe-step:hover { border-color: var(--accent-line); }
.pipe-step .n { font: 600 11px/1 var(--font-mono); color: var(--accent); }
.pipe-step .t { font: 600 var(--fs-sm)/1.25 var(--font-display); }
.pipe-step .d { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.pipe-step .who { font-size: 10.5px; }
.pipe-step.ai { border-top: 3px solid var(--info); }
.pipe-step.det { border-top: 3px solid var(--ok); }
.pipe-step.human { border-top: 3px solid var(--warn); }
.legend { display: flex; gap: var(--s-4); flex-wrap: wrap; font-size: var(--fs-xs); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.compare { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--s-4); }
.compare ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: var(--fs-sm); }

/* ---------- spec text & highlights ---------- */
.spec { font: 400 var(--fs-md)/1.7 var(--font-body); max-width: 74ch; }
.spec p { margin-bottom: 12px; max-width: none; }
.spec-meta { font: 500 var(--fs-xs)/1.4 var(--font-mono); color: var(--muted); }
mark.hl { background: transparent; color: inherit; border-radius: 3px; padding: 1px 2px; cursor: pointer; box-shadow: inset 0 -2px 0 var(--hl-cond-line); }
mark.hl.cond { background: var(--hl-cond); box-shadow: inset 0 -2px 0 var(--hl-cond-line); }
mark.hl.param { background: var(--hl-param); box-shadow: inset 0 -2px 0 var(--hl-param-line); }
mark.hl.field { background: var(--hl-field); box-shadow: inset 0 -2px 0 var(--hl-field-line); }
mark.hl.exc { background: var(--hl-exc); box-shadow: inset 0 -2px 0 var(--hl-exc-line); }
mark.hl.flash { animation: flash 1.2s ease-out 2; }
@keyframes flash { 50% { outline: 2px solid var(--accent); outline-offset: 2px; } }
.hl-legend { display: flex; gap: var(--s-3); flex-wrap: wrap; font-size: var(--fs-xs); }
.hl-legend mark { cursor: default; }
.xref { color: var(--info); text-decoration: underline dotted; cursor: pointer; }
.redline del { background: var(--bad-soft); color: var(--bad); text-decoration: line-through; border-radius: 2px; }
.redline ins { background: var(--ok-soft); color: var(--ok); text-decoration: none; border-radius: 2px; font-weight: 500; }
.toc { font-size: var(--fs-sm); display: grid; gap: 1px; }
.toc button { text-align: left; border: 0; background: transparent; padding: 4px 8px; border-radius: var(--r-sm); cursor: pointer; display: grid; grid-template-columns: 54px 1fr auto; gap: 6px; color: var(--fg-2); }
.toc button:hover { background: var(--surface-2); }
.toc button[aria-current="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.toc .sub { padding-left: 20px; }
.ctx-meter { display: grid; gap: 6px; }
.meter { height: 8px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--info); border-radius: 999px; }

/* ---------- extraction / guards ---------- */
.runs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); }
.guard { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; font-size: var(--fs-sm); padding: 6px 0; }
.guard .gi { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--font-mono); background: var(--surface-3); color: var(--muted); }
.guard.ok .gi { background: var(--ok); color: var(--surface); }
.guard.bad .gi { background: var(--bad); color: var(--surface); }
.guard.run .gi { background: var(--info); color: var(--surface); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.param-row { display: grid; grid-template-columns: minmax(110px, 160px) 70px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: var(--fs-sm); }
.param-row:last-child { border-bottom: 0; }
.param-val { font: 600 var(--fs-md)/1 var(--font-mono); }
.param-val input { width: 64px; padding: 3px 6px; border: 1px solid var(--accent); border-radius: var(--r-sm); background: var(--surface); font: inherit; }
.typing::after { content: "▍"; animation: pulse .8s infinite; color: var(--accent); }
.rule-text { font: 400 var(--fs-lg)/1.5 var(--font-body); color: var(--fg); max-width: 72ch; }
textarea.rule-text { width: 100%; min-height: 120px; padding: 10px 12px; border: 1px solid var(--accent-line); border-radius: var(--r-md); background: var(--surface); resize: vertical; }
.chain-step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
.chain-step > .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--font-mono); background: var(--surface-3); color: var(--fg-2); }
details.tech { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); }

.case-desc { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: var(--fs-sm); }

.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: var(--fs-sm); }

.find { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: var(--fs-sm); }

.seq-tbl td.id { font: 400 11px/1.4 var(--font-mono); white-space: nowrap; }

.badge-llm { background: var(--info-soft); color: var(--info); }
.badge-oracle { background: var(--ok-soft); color: var(--ok); }

/* ---------- provenance drawer ---------- */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(var(--drawer-w), 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 70; display: grid; grid-template-rows: auto minmax(0, 1fr); transform: translateX(105%); transition: transform .35s cubic-bezier(.2,.7,.2,1);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer.open { transform: none; }
.drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s-3); padding: var(--s-4); border-bottom: 1px solid var(--line); }
.drawer-body { overflow: auto; padding: var(--s-4); }
.trail { display: grid; gap: 0; }

.trail-content { display: grid; gap: 6px; min-width: 0; padding-top: 3px; }

.trail-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 10px; font-size: var(--fs-sm); min-width: 0; overflow-wrap: anywhere; }
.calc { font: 400 12.5px/1.7 var(--font-mono); }

/* ---------- timeline (AU periods) ---------- */

/* ---------- byte view ---------- */
.bytes { font: 400 12.5px/2 var(--font-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s-3); overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
.bytes span { border-radius: 2px; cursor: pointer; padding: 1px 0; }

/* ---------- inbox ---------- */
.msg { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: var(--s-3); padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--line); }

.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--font-mono); background: var(--surface-3); color: var(--fg-2); }

.seq { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* ---------- messages (email-like) ---------- */

.vsteps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }

.vstep.todo { border-top: 3px solid var(--line-strong); color: var(--muted); }
.signin { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); }
.signin button { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: var(--s-4); text-align: left; cursor: pointer; display: grid; gap: 4px; }

@media (max-width: 1100px) { .mail { grid-template-columns: 140px 250px minmax(0, 1fr); } }
@media (max-width: 900px) { .mail { grid-template-columns: minmax(0, 1fr); height: auto; } .mail > * { overflow: visible; } .mail-read { overflow: visible; } .vsteps, .signin { grid-template-columns: minmax(0, 1fr); } }

/* ---------- report ---------- */
.report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-6); display: grid; gap: var(--s-5); }

/* ---------- dropzone ---------- */

/* ---------- AI test pipeline ---------- */
.drop-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, auto); gap: var(--s-3); align-items: stretch; }
.test-btn { flex-direction: column; justify-content: center; gap: 6px; padding: var(--s-3) var(--s-4); white-space: normal; text-align: center; min-height: 100%; }

.cot-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }

details.cot-more summary { cursor: pointer; color: var(--fg-2); }
details.cot-more summary::marker { color: var(--accent); }
.term { background: #15171c; color: #e7e9ee; border-radius: var(--r-md); overflow: hidden; font: 400 12.5px/1.5 var(--font-mono); border: 1px solid #2a2e36; }
.term-head { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; background: #20242b; color: #9aa3b2; font-size: 11.5px; }

.json { font: 400 12px/1.5 var(--font-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 380px; overflow: auto; margin: 0; }
.tc-card { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--r-md); padding: 10px 12px; display: grid; gap: 6px; background: var(--surface); }

.tc-sheet { display: grid; gap: 8px; font-size: var(--fs-sm); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; background: var(--surface-2); }

.gmini .ok { background: var(--ok-soft); color: var(--ok); } .gmini .warn { background: var(--warn-soft); color: var(--warn); } .gmini .fail { background: var(--bad-soft); color: var(--bad); }
.item-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.st { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--font-mono); background: var(--surface-3); color: var(--muted); }

.flag-formula { display: inline-flex; gap: 4px; align-items: center; background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: 1px 8px; font: 700 11px/1.5 var(--font-body); }
.formula-box { display: grid; gap: var(--s-3); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-4); background: var(--surface-2); }

.var-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }

.split.wide { grid-template-columns: minmax(200px, 260px) minmax(0, 1fr); }

@media (max-width: 900px) { .split.wide { grid-template-columns: minmax(0, 1fr); } }
.login-scrim { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: grid; place-items: center; padding: 16px; }
.login-box { width: min(560px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: var(--s-6); display: grid; gap: var(--s-4); }

.login-roles { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
.login-role { display: grid; gap: 6px; text-align: left; padding: var(--s-4); border: 2px solid var(--line); border-radius: var(--r-lg); background: var(--surface-2); cursor: pointer; font-size: var(--fs-sm); color: var(--fg-2); }

@media (max-width: 560px) { .login-roles { grid-template-columns: 1fr; } }
.notify-host { position: fixed; top: calc(var(--bar-h) + 12px); right: 16px; z-index: 70; display: grid; gap: 8px; width: min(380px, calc(100% - 32px)); }
.notify { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 12px; cursor: pointer; font-size: var(--fs-sm); animation: toast-in .3s ease; }

    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const out = []; let i = 0, j = 0;
    const push = (t, w) => { const l = out[out.length - 1]; if (l && l.t === t) l.w.push(w); else out.push({ t, w: [w] }); };
    while (i < n && j < m) {
      if (A[i] === B[j]) { push("=", A[i]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { push("-", A[i]); i++; }
      else { push("+", B[j]); j++; }
    }
    while (i < n) push("-", A[i++]);
    while (j < m) push("+", B[j++]);

  const statusPill = st => ({ pending: pill(L("awaiting approval", "wartet auf Freigabe"), "warn"), approved: pill("✓ " + L("approved", "freigegeben"), "ok"), rejected: pill("✕ " + L("rejected", "abgelehnt"), "bad") }[st]);

  /* ---------- AU timeline (SVG) ---------- */
  function timeline(st, today, P, opt = {}) {
    const res = C.gates(st, today, P);
    const inc = new Set(res.chain.included);
    const endUsed = res.days.endUsed;
    const all = [...st.priors.map(a => a.start), res.days.winStart];
    const x0 = Math.min(...all) - 12, x1 = Math.max(endUsed, st.current.start) + 12;
    const W = 760, H = opt.compact ? 94 : 106, pad = 8, sx = d => pad + (d - x0) / (x1 - x0) * (W - 2 * pad);
    const y = opt.compact ? 32 : 42, bh = 16;
    let svg = `<svg class="tl" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(L("Sick-leave timeline", "AU-Zeitstrahl"))}">`;
    svg += `<rect class="win" x="${sx(res.days.winStart)}" y="${y - 6}" width="${Math.max(0, sx(st.current.start) - sx(res.days.winStart))}" height="${bh + 12}" rx="4"/>`;
    svg += `<text x="${sx(res.days.winStart) + 4}" y="${y - 10}">${esc(L("12-month window", "12-Monats-Fenster"))} ${C.de(res.days.winStart)}</text>`;
    svg += `<line class="axis" x1="${pad}" x2="${W - pad}" y1="${y + bh + 10}" y2="${y + bh + 10}"/>`;
    st.priors.forEach((a, i) => {
      const cls = !inc.has(a) ? "out" : a.paper ? "paper" : "";
      svg += `<rect class="au ${cls}" x="${sx(a.start)}" y="${y}" width="${Math.max(3, sx(a.end + 1) - sx(a.start))}" height="${bh}" rx="3"><title>${C.de(a.start)}–${C.de(a.end)}${a.certified ? "" : " (uncertified)"}</title></rect>`;
      svg += `<text class="lbl" x="${sx(a.start)}" y="${y + bh + 27 + (i % 2) * 14}">${C.de(a.start).slice(0, 6)}</text>`;
    });
    svg += `<rect class="au cur" x="${sx(st.current.start)}" y="${y}" width="${Math.max(3, sx(endUsed + 1) - sx(st.current.start))}" height="${bh}" rx="3"><title>${esc(L("current", "aktuell"))} ${C.de(st.current.start)}–${C.de(endUsed)}</title></rect>`;
    svg += `<text class="lbl" x="${Math.min(W - pad, sx(endUsed + 1))}" y="${y - 10}" text-anchor="end" style="fill:var(--accent)">${esc(L("current AU", "aktuelle AU"))} ${C.de(st.current.start).slice(0, 6)}${st.current.end == null ? " → +7" : ""}</text>`;
    return svg + "</svg>";
  }

  const PARAM_RULE = { six_months: "R-3.12-A", min_days: "R-3.12-A", lookback_months: "R-3.12-A", open_end_days: "R-3.12-A", efz_days: "R-3.12.5", weeks_before: "R-3.11.1", weeks_after: "R-3.11.1", weeks_after_special: "R-3.11.1" };

  const goldenInputs = () => `${esc(C.GOLDEN.name)} · ${L("current AU from", "aktuelle AU ab")} ${C.de(C.GOLDEN.state.current.start)} ${L("to", "bis")} ${C.de(C.GOLDEN.state.current.end)}<br>${C.GOLDEN.state.priors.map(a => `${C.de(a.start)}–${C.de(a.end)}${a.paper ? " (" + L("paper note", "Papier-AU") + ")" : ""}`).join("<br>")}`;

        { kind: "src", ic: "§", title: `${L("Specification", "Spezifikation")} §3.12 · v${old ? "13.3" : "13.4"}`, html: `<div class="trail-box de-quote">„${esc(q)}“</div>${old ? `<div class="muted" style="font-size:var(--fs-xs)">${L("Old wording, reconstructed from the change log", "Alter Wortlaut, aus dem Änderungsprotokoll rekonstruiert")}</div>` : ""}` },
        { kind: "llm", ic: "AI", title: `${L("Parameter extracted", "Parameter extrahiert")}: <code>six_months = ${P.six_months}</code> ${pill(L("LLM: extraction only", "LLM: nur Extraktion"), "info")}`, html: `<div class="trail-box">${L("Two independent runs (Kolibri-1, prompt A / prompt B)", "Zwei unabhängige Läufe (Kolibri-1, Prompt A / Prompt B)")}: <b>${rB.runA.params.six_months}</b> / <b>${rB.runB.params.six_months}</b> ${pill("A = B", "ok")}</div><div class="row">${statusPill(S.rules[rB.id].status)}</div>` },

  /* ---------- Baseline check: is the old catalogue still the law? ---------- */
  function baselineCSV() {
    const b = baseline(), rows = [["id", "section", "title", "status", "reason"]].concat(b.rows.map(r => [r.row.id, r.row.sec, r.row.title.en, r.status, r.why.en]), b.missing.map(m => ["", m.sec, m.quote, "missing", "no test covers this statement"]));
    return rows.map(r => r.map(c => /[;"\n]/.test(c) ? `"${String(c).replace(/"/g, "\"\"")}"` : c).join(";")).join("\n");
  }
  function vBaseline() {
    const b = baseline(), bad = b.rows.filter(r => r.status !== "ok"), ok = b.rows.filter(r => r.status === "ok");
    const nSt = STATEMENTS.length, covered = nSt - b.missing.length, alt = bad.find(r => r.row.id === "ALT-3.12-031");
    return `${head(L("Coverage & baseline check", "Abdeckung & Bestandsprüfung"), L("Does every test-relevant sentence of the spec have a test, and does every test still match the spec? Every existing test is matched against the current specification. Tests whose rule was removed by law are obsolete; test-relevant statements without a test are missing. Both checks are lookups, not AI judgements.", "Hat jeder prüfrelevante Satz der Spezifikation einen Test, und passt jeder Test noch zur Spezifikation? Jeder vorhandene Test wird mit der geltenden Spezifikation abgeglichen. Tests, deren Regel weggefallen ist, sind veraltet; prüfrelevante Aussagen ohne Test fehlen. Beides sind Nachschlagevorgänge, keine KI-Urteile."),

  };
  const STATEMENTS = Object.entries(HIGHLIGHTS).flatMap(([sec, list]) => list.map(h => ({ sec, q: h.q, k: h.k, tests: h.t })));
  let BASELINE = null;
  const baseline = () => BASELINE || (BASELINE = C.baselineCheck(C.CATALOGUE, C.LEGACY_ROWS, STATEMENTS));
  const HL_KIND = { cond: () => L("condition", "Bedingung"), param: () => L("parameter / number", "Parameter / Zahl"), field: () => L("required output field", "Pflichtfeld der Ausgabe"), exc: () => L("exception", "Ausnahme") };
  function highlightText(text, sec, extraQuote) {
    let html = esc(text);
    const hls = (HIGHLIGHTS[sec] || []).slice().sort((a, b) => b.q.length - a.q.length);
    const used = [];
    hls.forEach((h, i) => {
      const e = esc(h.q), idx = html.indexOf(e);
      if (idx < 0 || used.some(u => idx < u[1] && idx + e.length > u[0])) return;
      const tag = `<mark class="hl ${h.k}" data-act="hl" data-sec="${esc(sec)}" data-i="${(HIGHLIGHTS[sec] || []).indexOf(h)}" title="${esc(HL_KIND[h.k]())}">`;
      html = html.slice(0, idx) + tag + e + "</mark>" + html.slice(idx + e.length);
      used.forEach(u => { if (u[0] > idx) { u[0] += tag.length + 7; u[1] += tag.length + 7; } });
      used.push([idx, idx + tag.length + e.length + 7]);
    });
    if (extraQuote) { const e = esc(extraQuote); const i = html.indexOf(e); if (i >= 0) html = html.slice(0, i) + `<mark class="hl param flash" id="flashQuote">` + e + "</mark>" + html.slice(i + e.length); }

  /* ---------- 2 · Change impact ---------- */
  function vChanges() {
    const list = CHANGES;

    const cnt = Object.fromEntries(Object.keys(SOURCE).map(k => [k, list.filter(c => c.source === k).length]));
    const checked = list.filter(c => c.source !== "log-no-text"), unloaded = list.filter(c => c.source === "log-no-text");
    const imp = changeImpact(ch), risk = changeRisk(ch), ai = C.AI_CHANGE_TYPE[ch.sec];
    const K = 16, parts = ch.diff ? ch.diff.parts : [];
    const trimEq = (s, i) => { if (S.fullRedline) return s; const w = s.split(" "); if (w.length <= 2 * K + 4) return s; if (i === 0) return "… " + w.slice(-K).join(" "); if (i === parts.length - 1) return w.slice(0, K).join(" ") + " …"; return w.slice(0, K).join(" ") + " … " + w.slice(-K).join(" "); };
    const redline = ch.diff ? parts.map((p, i) => p.t === "=" ? esc(trimEq(p.s, i)) : p.t === "-" ? `<del>${esc(p.s)}</del>` : `<ins>${esc(p.s)}</ins>`).join(" ") : null;
    const ctxSecs = [ch.sec, ...((C.SPEC.sections[ch.sec] || { links: [] }).links.filter(l => C.SPEC.sections[l]))];
    const ctxTok = Math.round((ctxSecs.reduce((s, x) => s + C.sectionText(x).length, 0) + (C.SPEC_OLD.sections[ch.sec] || []).join(" ").length) / 4);
    return `${head(L("Change impact: v13.3 → v13.4", "Änderungen: v13.3 → v13.4"), L("Two independent sources, both deterministic: the official change log (parsed, not read by the AI) and a section-by-section diff of the old and new text. Where they disagree, you see it.", "Zwei unabhängige Quellen, beide deterministisch: das offizielle Änderungsprotokoll (geparst, nicht von der KI gelesen) und ein Abschnitts-Diff von altem und neuem Text. Wo sie abweichen, sehen Sie es."))}

          ${unloaded.length ? `<details class="tech" style="border:0;border-top:1px solid var(--line);border-radius:0" ${unloaded.some(c => c.sec === ch.sec) ? "open" : ""}><summary style="font:500 var(--fs-sm)/1.3 var(--font-body);color:var(--muted)">${L("More change-log entries", "Weitere Protokolleinträge")} (${unloaded.length})</summary>

            <p class="muted" style="font-size:var(--fs-xs);padding:var(--s-2) var(--s-4)">${L("The demo embeds the text of a few sections only; with the full PDF these are diffed like the others.", "Die Demo enthält nur den Text einiger Abschnitte; mit dem vollständigen PDF werden diese genauso verglichen.")}</p></div></details>` : ""}</section>
        <section class="panel" data-tour="redline"><div class="panel-head"><div class="stack" style="gap:2px"><span class="eyebrow">§${ch.sec}</span><h3>${esc(ch.title)}</h3></div><div class="row"><span class="pill ${SOURCE[ch.source].cls}">${T(SOURCE[ch.source])}</span>${riskPill(risk)}</div></div>
          <div class="panel-body">
            ${ch.entry ? `<div class="callout"><b>${L("Change log entry", "Eintrag im Änderungsprotokoll")} (${esc(ch.entry.version)} · ${esc(ch.entry.date)})</b><span class="de-quote">${esc(ch.entry.raw.split(" | ")[2])}</span><span class="muted" style="font-size:var(--fs-xs)">${L("Parsed: § refs", "Geparst: §-Bezüge")} ${ch.entry.refs.map(r => r.sec).join(", ")} · ${L("description", "Beschreibung")} „${esc(ch.entry.description)}“</span></div>` : `<div class="callout bad"><b>${L("Not in the change log", "Nicht im Änderungsprotokoll")}</b>${L("Found only by comparing the text. Without the diff, this change would have gone unnoticed.", "Nur durch Textvergleich gefunden. Ohne Diff wäre diese Änderung übersehen worden.")}</div>`}
            ${redline ? `<div data-tour="redlinebox"><div class="row between"><span class="field-label">${L("Redline", "Änderungsansicht")} v13.3 → v13.4</span><div class="row">${pill(L("v13.3 text illustrative", "v13.3-Text illustrativ"), "warn")}<button class="btn sm ghost" data-act="toggleRedline">${S.fullRedline ? L("Show changes only", "Nur Änderungen") : L("Show full text", "Ganzen Text zeigen")}</button></div></div><div class="spec redline trail-box" style="margin-top:6px">${redline}</div></div>` : `<div class="callout warn">${ch.source === "log-only" ? L("No wording change in the prose. The change probably lives in a field table or the record description — check manually.", "Keine Textänderung im Fließtext. Die Änderung steckt vermutlich in einer Feldtabelle oder der Datensatzbeschreibung — manuell prüfen.") : L("Section text not loaded in this demo (only DBVO, DBEE, DBMU and DBSD excerpts are embedded).", "Abschnittstext in dieser Demo nicht geladen (nur Auszüge DBVO, DBEE, DBMU, DBSD).")}</div>`}

                ${ai ? `<span class="muted" style="font-size:var(--fs-xs)">${L("confidence", "Konfidenz")} ${Math.round(ai.conf * 100)} % · ${S.changeType[ch.sec] ? L("confirmed by examiner", "vom Prüfer bestätigt") : L("not yet confirmed", "noch nicht bestätigt")}</span>` : ""}</div>
              <div class="stack"><span class="field-label">${L("Test impact", "Testauswirkung")} · ${pill(L("deterministic", "deterministisch"), "ok")}</span><b>${imp.count} ${L("catalogue rows cite", "Katalogzeilen verweisen auf")} §${ch.sec}</b><span class="muted" style="font-size:var(--fs-xs)">${L("from the § references in the test catalogue", "aus den §-Verweisen im Testkatalog")}</span></div>
              <div class="stack"><span class="field-label">${L("Risk", "Risiko")} · ${pill(L("fixed rule", "feste Regel"), "ok")}</span>${riskPill(risk)}<span class="muted" style="font-size:var(--fs-xs)">${L("high = condition, parameter or format change with affected tests · medium = new/removed rule · low = editorial", "hoch = Bedingung, Parameter oder Format mit betroffenen Tests · mittel = neue/entfernte Regel · gering = redaktionell")}</span></div>

            <div class="row between"><span class="muted" style="font-size:var(--fs-xs)">${L("Context sent to the model", "Kontext an das Modell")}: ${ctxSecs.map(x => "§" + x).join(" + ")} + v13.3 §${ch.sec} · ~${fmtN(ctxTok)} ${L("tokens", "Tokens")}</span>
              <div class="actions"><button class="btn" data-act="confirmType" data-sec="${ch.sec}">${ic("check")} ${L("Confirm type", "Typ bestätigen")}</button>${C.RULES.some(r => r.sec === ch.sec) ? `<button class="btn primary" data-act="openRule" data-rule="${C.RULES.find(r => r.sec === ch.sec).id}">${ic("ai")} ${L("Extract rules", "Regeln extrahieren")}</button>` : ""}</div></div>
          </div></section>
      </div>`;
  }

  /* ---------- 3 · Rule extraction ---------- */
  function guardRow(state, label, how) { return `<div class="guard ${state}"><span class="gi">${state === "ok" ? "✓" : state === "bad" ? "✕" : "…"}</span><span><b>${label}</b>${how ? `<br><span class="muted">${how}</span>` : ""}</span></div>`; }

        <div class="row">${pill((p.quoteOk ? "✓ " : "✕ ") + L("verbatim", "wörtlich"), p.quoteOk ? "ok" : "bad")}${k === "_rule" ? "" : pill((p.numOk.ok ? "✓ " : "✕ ") + esc(p.numOk.how), p.numOk.ok ? "ok" : "bad") + pill((p.schemaOk.ok ? "✓ " : "✕ ") + esc(p.schemaOk.how), p.schemaOk.ok ? "ok" : "bad")}</div></div>`; }).join("")}</div></div>`;
  }
  /* ---------- rule text + one representative test case per rule ---------- */
  const ruleText = r => S.rules[r.id].text != null ? S.rules[r.id].text : T(r.text);
  /* Test setup in human words, phrased like ITSG's "Hinweise zur Testkonstellation". */
  function describeCase(sc) {
    const p = a => `${C.de(a.start)} ${L("to", "bis")} ${C.de(a.end)}${a.paper ? " " + L("(paper note at the employer, no eAU)", "(liegt dem AG als Papiernachweis vor, keine eAU)") : a.certified ? "" : " " + L("(no sick note)", "(ohne Bescheinigung)")}`;
    const cur = sc.state.current, items = [
      `${L("The following sick-leave periods are stored in the system", "Nachfolgende AU-Zeiten sind im System hinterlegt")}:<ul>${sc.state.priors.map(a => `<li>${p(a)}</li>`).join("")}</ul>`,
      `${L("The current sick leave starts on", "Die aktuelle AU beginnt am")} ${C.de(cur.start)}${cur.end != null ? `, ${L("initially until", "zunächst bis")} ${C.de(cur.end)}` : ` ${L("with an open end", "mit offenem Ende")}`}${sc.finalAuEnd ? ` — ${L("it finally lasts until", "sie dauert schlussendlich bis")} ${C.de(sc.finalAuEnd)}` : ""}.`
    ];
    if (sc.employmentEnd != null) items.push(`${L("Employment ends on", "Ende der Beschäftigung ist der")} ${C.de(sc.employmentEnd)}.`);
    if (sc.state.insurance !== "GKV") items.push(L("The employee is privately insured.", "Der Arbeitnehmer ist privat versichert."));
    if (sc.state.marginal) items.push(L("The employee is marginally employed.", "Der Arbeitnehmer ist geringfügig beschäftigt."));
    items.push(`${L("Report date", "Meldedatum")}: ${C.de(sc.today)}.`);
    return `<ul class="case-desc">${items.map(i => `<li>${i}</li>`).join("")}</ul>`;
  }
  const MU_CASE = { id: "TC-3.11.1-001", name: "Lena Muster", birth: C.D("2027-05-20") };
  /* ITSG: manual entry today → one case per rule. `boundary` = template ids of the full boundary set. */

        json: dbvoJson(g, g.id), boundary: ["gap-in", "gap-out", "uncert"] };
    }
    if (id === "R-3.12.5") {

      return { id: "TC-3.12.5-001", title: L("Peter Mustermann: when does continued sick pay end?", "Peter Mustermann: Wann endet die Entgeltfortzahlung?"), origin: L("ITSG reference case", "ITSG-Referenzfall"), sc: g, desc: describeCase(g),
        expected: `${L("Sick pay ends", "EFZ endet am")} ${prov("golden.efz30", C.de(e30))}; ${L("after the insurer confirms the paper note:", "nach Bestätigung der Papier-AU durch die Kasse:")} ${prov("golden.efz27", C.de(e27))}`,

        expected: `${L("The insurer confirms the benefit end", "Die Kasse bestätigt das EEL-Ende")} ${prov("golden.eelend", C.de(e))} ${L("(end of employment, reason 99), not", "(Beschäftigungsende, Grund 99), nicht")} ${C.de(g.finalAuEnd)}`,
        json: dbvoJson(g, "TC-3.7.3-001", { eel_end: C.iso(e), eel_end_reason: "99" }), boundary: null };

      desc: `<ul class="case-desc"><li>${L("Employee", "Arbeitnehmerin")} ${MU_CASE.name}, ${L("expected date of birth", "voraussichtlicher Entbindungstag")} ${C.de(MU_CASE.birth)}.</li><li>${L("Single birth, not premature.", "Einzelgeburt, keine Frühgeburt.")}</li></ul>`,
      expected: `${L("Protection period", "Schutzfrist")} ${prov("mu.case", C.de(m.start) + " – " + C.de(m.end))}`,
      json: { schema: "itsg-eel-testinput/0.1", test_case: MU_CASE.id, rule: id, employee: { name: MU_CASE.name }, expected_birth: C.iso(MU_CASE.birth), multiple_birth: false, expected: { protection_start: C.iso(m.start), protection_end: C.iso(m.end) } }, boundary: null };
  }
  const packageJSON = () => ({ package: "EEL 2027-01", spec: `${C.SPEC.doc} v${C.SPEC.version}`, schema: "itsg-eel-testinput/0.1", cases: C.RULES.filter(r => S.rules[r.id].status !== "rejected").map(r => ruleCase(r.id).json) });

  function vExtract() {
    const rule = C.RULES.find(r => r.id === S.selRule), st = S.rules[rule.id];
    const B = st.live ? st.live.run : rule.runB;
    const ev = C.evaluateRule(rule, rule.runA, B);
    const f = C.FN[rule.fn], tests = TESTS.filter(t => t.fn === rule.fn);
    const keys = Object.keys(rule.runA.params);
    const anim = S.extracting;
    const sec = C.SPEC.sections[rule.sec];
    const quotes = [...new Set(Object.values(rule.runA.quotes))];
    const rc = ruleCase(rule.id), pending = st.status === "pending";
    const checkLine = { verified: ["ok", L("All automatic checks passed: every quote is verbatim, every number is in its quote, and two independent AI runs agree.", "Alle automatischen Prüfungen bestanden: Jedes Zitat ist wörtlich, jede Zahl steht im Zitat, zwei unabhängige KI-Läufe stimmen überein.")],
      partly: ["warn", L("One AI run paraphrased a quote and was rejected; the other run passed every check. Details below.", "Ein KI-Lauf hat ein Zitat umformuliert und wurde verworfen; der andere bestand alle Prüfungen. Details unten.")],
      conflict: ["bad", L("The two AI runs disagree on", "Die zwei KI-Läufe widersprechen sich bei") + " " + ev.ag.diff.join(", ") + ". " + L("Resolve before approving.", "Vor der Freigabe klären.")],
      failed: ["bad", L("Automatic checks failed. Do not approve.", "Automatische Prüfungen fehlgeschlagen. Nicht freigeben.")] }[ev.status];
    const liveText = st.live && st.live.run && st.live.run.text;
    return `${head(L("Rules (criteria)", "Regeln (Prüfkriterien)"), L("Each rule is shown as the spec text it comes from, the rule in plain language, and its test case. The examiner approves, edits or declines the wording. The AI drafts; it never calculates an expected value.", "Jede Regel erscheint als Spezifikationstext, aus dem sie stammt, als Regel in Klartext und mit ihrem Testfall. Der Prüfer gibt den Wortlaut frei, ändert ihn oder lehnt ihn ab. Die KI formuliert vor; sie berechnet nie einen Erwartungswert."),
      `<button class="btn" data-act="runExtract">${ic("ai")} ${L("Re-run extraction", "Extraktion erneut ausführen")}</button><button class="btn" data-act="runLive">${ic("ai")} ${L("Run live (hessian.AI)", "Live ausführen (hessian.AI)")}</button>`)}
      <div class="split">
        <section class="panel"><div class="panel-head"><h4>${L("Rules from the spec", "Regeln aus der Spezifikation")}</h4></div>
          <div class="list">${C.RULES.map(r => { const e = C.evaluateRule(r, r.runA, S.rules[r.id].live ? S.rules[r.id].live.run : r.runB); return `<button class="list-item" aria-selected="${r.id === rule.id}" data-act="selRule" data-rule="${r.id}"><div class="row between"><b class="mono">${r.id}</b>${statusPill(S.rules[r.id].status)}</div><b style="font-size:var(--fs-sm)">${esc(T(r.label))}</b><span class="muted" style="font-size:var(--fs-xs)">${esc(ruleText(r).slice(0, 110))}${ruleText(r).length > 110 ? "…" : ""}</span><div class="row">${secLink(r.sec)}${pill({ verified: L("checks ✓", "Prüfungen ✓"), partly: L("one run rejected", "ein Lauf verworfen"), conflict: L("AI runs disagree", "KI-Läufe uneinig"), failed: L("checks failed", "Prüfungen fehlgeschlagen") }[e.status], { verified: "ok", partly: "warn", conflict: "bad", failed: "bad" }[e.status])}</div></button>`; }).join("")}</div></section>
        <div class="stack">
          <section class="panel" data-tour="ruletext"><div class="panel-head"><div class="stack" style="gap:2px"><span class="eyebrow">${rule.id} · §${rule.sec} · ${L("page", "Seite")} ${sec.page}</span><h3>${esc(T(rule.label))}</h3></div>${statusPill(st.status)}</div>
            <div class="panel-body">
              <div class="chain-step"><span class="n">1</span><div class="stack" style="gap:6px"><span class="field-label">${L("From the specification", "Aus der Spezifikation")} · ${C.SPEC.doc} v${C.SPEC.version}</span>
                ${quotes.map(q => `<div class="row between" style="align-items:start"><span class="de-quote">„${esc(q)}“</span><button class="btn sm ghost" data-act="goSec" data-sec="${rule.sec}" data-q="${esc(q)}">${L("Show in document", "Im Dokument zeigen")}</button></div>`).join("")}</div></div>
              <div class="chain-step"><span class="n">2</span><div class="stack" style="gap:6px"><span class="field-label">${L("The rule in plain language", "Die Regel in Klartext")} · ${pill(st.text != null ? L("edited by examiner", "vom Prüfer geändert") : L("AI draft — edit freely", "KI-Entwurf — frei änderbar"), st.text != null ? "warn" : "info")}</span>
                ${pending ? `<textarea class="rule-text" id="ruleText-${rule.id}" data-rule-text="${rule.id}" rows="${Math.ceil(ruleText(rule).length / 72) + 1}" aria-label="${esc(L("Rule text", "Regeltext"))}">${esc(ruleText(rule))}</textarea>` : `<p class="rule-text">${esc(ruleText(rule))}</p>`}
                ${liveText && pending ? `<div class="callout"><b>${L("Live model suggests", "Live-Modell schlägt vor")} (${esc(st.live.model)})</b><span>${esc(liveText)}</span><div class="row"><button class="btn sm" data-act="useLiveText" data-rule="${rule.id}">${L("Use this wording", "Diesen Wortlaut übernehmen")}</button></div></div>` : ""}</div></div>
              <div class="chain-step"><span class="n">3</span><div class="stack" style="gap:6px"><span class="field-label">${L("Test case for this rule", "Testfall zu dieser Regel")}</span>
                <div class="row between"><span><b class="mono">${rc.id}</b> ${esc(rc.title)}</span><button class="btn sm" data-act="openCase" data-rule="${rule.id}">${ic("test")} ${L("Open test case", "Testfall öffnen")}</button></div></div></div>
              <div class="callout ${checkLine[0]}"><b>${L("Automatic checks", "Automatische Prüfungen")}</b><span>${checkLine[1]}</span></div>
            </div></section>
          <section class="panel" data-tour="approve"><div class="panel-head"><h4>${L("Examiner decision", "Entscheidung des Prüfers")}</h4>${pill(L("once per rule, not per test", "einmal je Regel, nicht je Test"), "")}</div>
            <div class="panel-body">
              ${keys.length ? keys.map(k => `<div class="param-row"><code>${k}</code><span class="param-val">${pending ? `<input type="number" id="edit-${rule.id}-${k}" data-param="${k}" value="${st.edited[k] != null ? st.edited[k] : (S.params[k] != null ? S.params[k] : rule.runA.params[k])}">` : S.params[k]}</span><span class="de-quote muted" style="font-size:var(--fs-xs)">„${esc(rule.runA.quotes[k])}“</span>${prov(`param:${rule.id}:${k}`, L("trail", "Herkunft"))}</div>`).join("") : `<p class="muted">${L("No numbers to confirm — the rule itself is what gets approved.", "Keine Zahlen zu bestätigen — freigegeben wird die Regel selbst.")}</p>`}
              <textarea class="textarea" id="rejectReason-${rule.id}" placeholder="${esc(L("Reason (required to decline)", "Begründung (für Ablehnung erforderlich)"))}" ${pending ? "" : "hidden"}></textarea>
              <div class="actions">${pending ? `<button class="btn primary" data-act="approve" data-rule="${rule.id}" ${ev.status === "conflict" ? "disabled" : ""}>${ic("check")} ${L("Approve", "Freigeben")}</button><button class="btn bad" data-act="reject" data-rule="${rule.id}">✕ ${L("Decline", "Ablehnen")}</button>${ev.status === "conflict" ? `<button class="btn" data-act="resolve" data-rule="${rule.id}">${L("Resolve: use run A", "Lösen: Lauf A übernehmen")}</button>` : ""}` : `<span class="muted">${st.status === "approved" ? L("Approved", "Freigegeben") : L("Declined", "Abgelehnt") + ": " + esc(st.reason)}</span><button class="btn sm ghost" data-act="reopen" data-rule="${rule.id}">${L("Reopen", "Wieder öffnen")}</button>`}</div>

          <details class="tech" data-tour="guards" ${S.techOpen ? "open" : ""}><summary><span>${L("Technical details: why you can trust this", "Technische Details: warum das vertrauenswürdig ist")}</span><span class="muted" style="font-size:var(--fs-xs);font-weight:400">${L("function, five checks, both AI runs", "Funktion, fünf Prüfungen, beide KI-Läufe")}</span></summary><div class="tech-body">
              <div class="row"><span class="field-label">${L("Calculated by", "Berechnet durch")}:</span><code>${rule.fn}@${f.version}</code><span class="mono muted" style="font-size:var(--fs-xs)">sha256 ${f.hash.slice(0, 12)}…</span><span class="muted" style="font-size:var(--fs-xs)">${L("picked by the model, pre-written and tested by us", "vom Modell gewählt, von uns vorab geschrieben und getestet")}</span></div>
              <div class="grid-2" id="guardList">
                <div>${guardRow(anim ? "run" : (ev.gA.params && Object.values(ev.gA.params).every(p => p.quoteOk) ? "ok" : "bad"), L("1 · Quote is verbatim in the spec", "1 · Zitat steht wörtlich in der Spezifikation"), L("normalised string match against §", "normalisierter Textvergleich mit §") + rule.sec)}
                ${guardRow(anim ? "run" : (Object.values(ev.gA.params).every(p => p.numOk.ok) ? "ok" : "bad"), L("2 · Number appears in the quote", "2 · Zahl steht im Zitat"), L("digits or German number words × unit (Woche = 7 Tage)", "Ziffern oder Zahlwörter × Einheit (Woche = 7 Tage)"))}</div>
                <div>${guardRow(anim ? "run" : (Object.values(ev.gA.params).every(p => p.schemaOk.ok) ? "ok" : "bad"), L("3 · Parameter exists and is in range", "3 · Parameter existiert und liegt im Bereich"), L("schema of", "Schema von") + " " + rule.fn)}
                ${guardRow(anim ? "run" : (ev.ag.ok ? "ok" : "bad"), L("4 · Two runs agree (A = B)", "4 · Zwei Läufe stimmen überein (A = B)"), ev.ag.ok ? L("identical values", "identische Werte") : L("differs", "weicht ab") + ": " + ev.ag.diff.join(", "))}
                ${guardRow(anim ? "run" : (tests.every(t => t.ok) ? "ok" : "bad"), L("5 · Function unit tests pass", "5 · Funktionstests bestanden"), tests.length ? `${tests.filter(t => t.ok).length}/${tests.length}` : L("integration tests", "Integrationstests"))}</div>
              </div>
              ${ev.status === "partly" ? `<div class="callout warn"><b>${L("Run B paraphrased a quote", "Lauf B hat ein Zitat umformuliert")}</b>${L("The quote guard rejected it, because the text does not appear in the spec. Run A's verbatim quote carries the parameter; the examiner sees both.", "Die Zitatprüfung hat es abgelehnt, weil der Text so nicht in der Spezifikation steht. Das wörtliche Zitat aus Lauf A trägt den Parameter; der Prüfer sieht beide.")}</div>` : ""}

              <div class="stack"><div class="row between"><span class="field-label">§${rule.sec} · ${L("source text with quotes", "Quelltext mit Zitaten")}</span><button class="btn sm ghost" data-act="goSec" data-sec="${rule.sec}">${L("Open in viewer", "Im Viewer öffnen")}</button></div>
                <div class="spec" style="font-size:var(--fs-sm)">${sec.text.map(p => `<p>${highlightText(p, rule.sec)}</p>`).join("")}</div></div>

  function catalogueCSV() {

          <div class="stack" style="gap:var(--s-3)">${timeline(b.state, b.today, S.params, { compact: true })}
            <div class="stack" style="gap:4px"><span class="field-label">v13.3 · „nicht <del style="color:var(--bad)">mindestens</del> 6 Monate“</span><div class="muted" style="text-decoration:line-through">${verdict(rOld)}</div><span class="muted" style="font-size:var(--fs-xs)">${L("Old catalogue row", "Alte Katalogzeile")} <span class="mono">ALT-3.12-031</span>, ${L("now obsolete", "jetzt veraltet")} · ${prov("b6m.old", L("why", "warum"))}</span></div>
            <div class="stack" style="gap:4px"><span class="field-label">v13.4 · „nicht <b style="color:var(--ok)">mehr als</b> 6 Monate“ · ${pill(L("calculated by tested code", "von getestetem Code berechnet"), "ok")}</span><div style="font-size:var(--fs-lg)"><b>${prov("b6m.new", verdict(rNew))}</b></div></div></div></div></div></section>
        <div class="callout accent" data-tour="perrule"><b>${L("One test case per rule", "Ein Testfall je Regel")}</b><span>${L("Vendor engineers type every test case into their software by hand today, so each rule starts with one representative case, described in words the way ITSG writes them. With automatic input (JSON import), expand to the full boundary set — then more is better.", "Hersteller-Entwickler tippen heute jeden Testfall von Hand in ihre Software. Deshalb beginnt jede Regel mit einem repräsentativen Fall, in Worten beschrieben wie bei ITSG. Mit automatischer Eingabe (JSON-Import) lässt sich auf alle Grenzfälle erweitern — dann gilt: mehr ist besser.")}</span></div>
        ${C.RULES.map(r => {

        <div class="panel-body flush tbl-wrap"><table class="tbl"><thead><tr><th>ID</th><th>§</th><th>${L("Kind", "Art")}</th><th>${L("Title", "Titel")}</th><th>${L("Since", "Seit")}</th><th>${L("Status", "Status")}</th></tr></thead><tbody>

    const dialogue = `<section class="panel" data-tour="dialogue"><div class="panel-head"><h3>${L("Employer ⇄ insurer dialogue for TC-3.12-001", "Dialog Arbeitgeber ⇄ Krankenkasse zu TC-3.12-001")}</h3>${pill(L("from ITSG's test constellation", "aus der ITSG-Testkonstellation"), "")}</div>
      <div class="panel-body"><span class="muted" style="font-size:var(--fs-sm)">${L("The software under test produces the employer (AG) messages. The insurer (KK) replies are given: the vendor's software must read and handle them. A reply finds its request through the REF-ID, which repeats the request's DSID — click an ID to follow it.", "Die geprüfte Software erzeugt die Meldungen des Arbeitgebers (AG). Die Antworten der Krankenkasse (KK) sind vorgegeben: Die Software muss sie lesen und verarbeiten. Eine Antwort findet ihre Anfrage über die REF-ID, die die DSID der Anfrage wiederholt — ID anklicken, um ihr zu folgen.")}</span></div>
      <div class="panel-body flush">${seqTable}</div></section>`;
    const manualMin = 20, auto = `<section class="panel" data-tour="autoinput"><div class="panel-head"><h3>${L("Automatic input (proposal)", "Automatische Eingabe (Vorschlag)")}</h3><div class="row">${pill(L("requires a spec change", "erfordert Spezifikationsänderung"), "warn")}${pill(L("pilot: SAP", "Pilot: SAP"), "info")}</div></div>

        <dl class="kv"><dt>${L("This package", "Dieses Paket")}</dt><dd>${nCases} ${L("cases", "Fälle")}</dd><dt>${L("Typed by hand", "Von Hand getippt")}</dt><dd>≈ ${nCases * manualMin} ${L("min per vendor", "Min. je Hersteller")} (${L("assumed", "angenommen")} ${manualMin} ${L("min per case", "Min. je Fall")})</dd><dt>${L("Full catalogue by hand", "Ganzer Katalog von Hand")}</dt><dd>≈ ${fmtN(Math.round(4000 * manualMin / 60))} ${L("hours", "Stunden")}</dd><dt>${L("Imported", "Importiert")}</dt><dd>${L("seconds, any number of cases", "Sekunden, beliebig viele Fälle")}</dd></dl>
        <div class="actions"><button class="btn" data-act="packageJson">${ic(FRAMED ? "copy" : "download")} ${L("Download test package JSON", "Testpaket-JSON herunterladen")}</button></div></div></section>`;
    return `${head(L("Publish", "Veröffentlichen"), L("Publish the test package to vendors through Messages. They receive the test cases in words and the checklist — and, as a proposal, the same cases as importable JSON. Expected results stay with ITSG.", "Testpaket über Nachrichten an Hersteller veröffentlichen. Sie erhalten die Testfälle in Worten und die Checkliste — und, als Vorschlag, dieselben Fälle als importierbares JSON. Erwartungswerte bleiben bei ITSG."))}
      <div class="grid-2" data-tour="publishrow"><section class="panel" data-tour="publish"><div class="panel-head"><h3>${L("Test package EEL 2027-01", "Testpaket EEL 2027-01")}</h3>${S.published ? pill("✓ " + L("published", "veröffentlicht"), "ok") : pill(L("draft", "Entwurf"), "warn")}</div>

  /* ---------- expected DTA files: what a correct payroll program must produce, written by ITSG's oracle ----------
     The same DTA format as the vendor's file: ITSG's sample envelope (TEEL0) with the DBVO block the oracle
     computes for the scenario. For ITSG's reference case this is TEEL0 byte for byte. */
  function expectedText(sc) {
    const lines = C.TEEL0_LINES.slice(), dslw = lines[2], p = dslw.indexOf("DBVO"), n = Number(dslw.slice(p + 30, p + 32));
    lines[2] = dslw.slice(0, p) + C.dbvoBlock(sc.state, S.params) + dslw.slice(p + 32 + 50 * n);
    return lines.join("\r\n") + "\r\n";
  }
  function expectedSet() {  // the message test cases of the package: scenarios that must produce request 41
    return [[C.GOLDEN, "R-3.12-B"], [C.BOUNDARY_6M, "R-3.12-B"]]
      .filter(([sc]) => C.gates(sc.state, sc.today, S.params).allowed)
      .map(([sc, rule]) => ({ name: `EXPECTED_${sc.id}_DBVO.dta`, scenario_id: sc.id, title: `${sc.id} · ${sc.name}`, rule,
        scenario: C.scenarioJSON(sc, rule, S.params), text: expectedText(sc) }));
  }
  const EXP = () => (window.PIPE && PIPE.P.expected) || [];
  const BUILTIN = () => ({ id: "builtin", name: L("ITSG reference TC-3.12-001 (built in)", "ITSG-Referenz TC-3.12-001 (eingebaut)"), scenario_id: "TC-3.12-001", package: "", sha256: "" });
  const expSelected = () => (S.expSel && EXP().find(e => e.id === S.expSel)) || BUILTIN();
  const scenarioOf = e => (e.id !== "builtin" && e.scenario ? C.scenarioFromJSON(e.scenario) : C.GOLDEN);
  const detectVendor = v => (C.VENDORS.find(x => x.product === String(v.meta.product || "").trim()) || {}).id || null;
  async function sha256Hex(bytes) {

  /* ---------- 8 · On-site audit ---------- */
  function scopeFor(vendor) {
    if (!vendor.prev) return C.CATALOGUE.map(r => ({ row: r, why: ["full"] }));
    return C.CATALOGUE.map(r => {
      const why = [];
      if (vendor.prev.failed.includes(r.id)) why.push("failed");
      const s = rowStatus(r); if (s === "new") why.push("new"); if (s === "changed") why.push("changed");
      return { row: r, why };
    }).filter(x => x.why.length);
  }
  const WHY = { failed: () => pill(L("failed last time", "letztes Mal nicht bestanden"), "bad"), new: () => pill(L("new", "neu"), "accent"), changed: () => pill(L("changed", "geändert"), "warn"), full: () => pill(L("first certification", "Erstzertifizierung"), "info") };
  function autoResult(vendor, row) {
    // SAP's uploaded file → message checks for §3.12 fill in automatically. (Imagined results.)
    if (vendor.id === "sap" && row.sec.startsWith("3.12")) { const v = C.validateMessage(C.TEEL0, C.GOLDEN, S.params); return v.ok ? "pass" : "fail"; }
    if (vendor.id === "sap" && row.id === "EEL-3.20-002") return "fail";
    return "pass";
  }
  function auditState(vendor) {

    return S.audit[vendor.id];

  const vendorSeg = () => `<div class="seg" role="group" aria-label="Vendor">${C.VENDORS.map(v => `<button aria-pressed="${S.vendor === v.id}" data-act="vendor" data-v="${v.id}">${esc(v.name)}</button>`).join("")}</div>`;

    const vendor = C.VENDORS.find(v => v.id === S.vendor), scope = scopeFor(vendor), st = auditState(vendor);

    return `${head(L("On-site audit", "Vor-Ort-Prüfung"), L("ITSG's criteria are not sent by vendors — an examiner checks them at the vendor. The scope is computed: what failed last time, what changed, and what is new. A new product gets the whole catalogue.", "ITSG-Kriterien werden nicht von Herstellern gesendet — ein Prüfer prüft sie vor Ort. Der Umfang wird berechnet: was letztes Mal fehlschlug, was sich änderte, was neu ist. Ein neues Produkt bekommt den ganzen Katalog."), vendorSeg())}

      <section class="panel" data-tour="checklist"><div class="panel-head"><h3>${esc(vendor.name)} ${esc(vendor.release)} · ${L("product", "Produkt")} <span class="mono">${vendor.product}</span></h3><span class="muted" style="font-size:var(--fs-xs)">${vendor.prev ? L("last audit", "letzte Prüfung") + " " + vendor.prev.year + ": " + (vendor.prev.failed.length ? vendor.prev.failed.join(", ") + " " + L("failed", "nicht bestanden") : L("all passed", "alle bestanden")) : L("no previous certificate", "kein bisheriges Zertifikat")}</span></div>
        <div class="panel-body flush tbl-wrap"><table class="tbl"><thead><tr><th>ID</th><th>${L("Criterion", "Kriterium")}</th><th>${L("Why in scope", "Warum im Umfang")}</th><th>${L("Result", "Ergebnis")}</th></tr></thead><tbody>
        ${scope.map(x => { const s = st[x.row.id]; return `<tr><td class="mono" style="white-space:nowrap">${x.row.id}</td><td>${esc(T(x.row.title))}${s.auto ? `<br><span class="muted" style="font-size:11px">${L("pre-filled from the compared DTA file", "aus der geprüften DTA-Datei vorbelegt")}</span>` : ""}</td><td><div class="row">${x.why.map(w => WHY[w]()).join("")}</div></td><td><div class="seg"><button aria-pressed="${s.res === "pass"}" data-act="auditSet" data-id="${x.row.id}" data-r="pass">✓</button><button aria-pressed="${s.res === "fail"}" data-act="auditSet" data-id="${x.row.id}" data-r="fail">✕</button></div></td></tr>`; }).join("")}
