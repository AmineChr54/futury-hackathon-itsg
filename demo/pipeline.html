      `<span id="pipeStopAction">${stopAction(r)}</span><button class="btn" data-act="go" data-screen="ingest">${ic("upload")} ${L("New run", "Neuer Lauf")}</button><button class="btn primary" data-act="go" data-screen="pipechanges">${ic("check")} ${L("Review changes", "Änderungen prüfen")}</button><button class="btn" data-act="go" data-screen="review">${ic("test")} ${L("Review test cases", "Testfälle prüfen")}</button>`)}
      <div id="pipeChgBanner">${chBanner()}</div>
      <section class="panel"><div class="panel-head"><div class="stack" style="gap:2px"><span class="eyebrow">${L("Run", "Lauf")} ${esc(P.runId)}${r ? " · " + esc(r.model) : ""}</span><h3 id="pipePlanTitle">${r ? planTitle(r.plan) : L("Loading…", "Lade…")}</h3></div><span id="pipeRunStatus">${r ? runStatusPill(r) : ""}</span></div>
        <div class="panel-body"><div class="cot" id="pipeStages"></div></div></section>
      <div class="split"><section class="panel"><div class="panel-head"><h4>${L("Sections", "Abschnitte")}</h4><span class="muted" style="font-size:var(--fs-xs)" id="pipeItemCount"></span></div><div class="panel-body flush" id="pipeItems" style="max-height:70vh;overflow:auto"></div></section>
        <section class="panel"><div class="panel-head" id="pipeItemHead"></div><div class="panel-body" id="pipeItemBody"></div></section></div>`;
  }
  // step 2 of 3: the extracted changes wait for the examiner before the AI writes test cases
  function chBanner() {
    const w = waiting().length, a = approvedReady().length;
    if (!w && !a) return "";
    return `<div class="callout accent chg-banner"><div><b>${w ? `${w} ${L("spec change(s) waiting for your review", "Änderung(en) warten auf Ihre Prüfung")}` : `${a} ${L("approved change(s) ready", "freigegebene Änderung(en) bereit")}`}</b><span>${L("The AI has read the sections. Check what it understood, then create test cases for the approved changes.", "Die KI hat die Abschnitte gelesen. Prüfen Sie, was sie verstanden hat, und erstellen Sie dann Testfälle für die freigegebenen Änderungen.")}</span></div><button class="btn primary" data-act="go" data-screen="pipechanges">${ic("check")} ${L("Review changes", "Änderungen prüfen")}</button></div>`;
  }
  const planTitle = p => p.mode === "diff" ? `${esc(p.new.name)} <span class="muted">vs.</span> ${esc(p.old.name)}` : `${esc(p.new.name)} <span class="muted">· ${L("single document", "Einzeldokument")}</span>`;
  const runStatusPill = r => r.status === "running" ? pill(L("running", "läuft"), "info") : r.status === "done" ? pill("✓ " + L("finished", "fertig"), "ok") : pill(esc(r.status), "warn");

  function paintRun(changed) {
    const r = P.run; if (!r) return;
    const st = document.getElementById("pipeStages");
    if (!st) return;
    const pt = document.getElementById("pipePlanTitle"); if (pt) pt.innerHTML = planTitle(r.plan);
    const rs = document.getElementById("pipeRunStatus"); if (rs) rs.innerHTML = runStatusPill(r);
    const stop = document.getElementById("pipeStopAction"); if (stop) stop.innerHTML = stopAction(r);
    const bn = document.getElementById("pipeChgBanner"); if (bn) bn.innerHTML = chBanner();
    st.innerHTML = P.events.filter(e => e.item == null).map(e => evHtml(e)).join("");
    const counts = r.items.reduce((m, i) => (m[i.status] = (m[i.status] || 0) + 1, m), {});
    document.getElementById("pipeItemCount").textContent = `${r.items.length} · ${counts.done || 0} ${L("done", "fertig")}${counts.running ? ` · ${counts.running} ${L("running", "laufen")}` : ""}`;
    const list = document.getElementById("pipeItems");
    const sc = list.scrollTop;
    list.innerHTML = r.items.length ? r.items.map(i => `<button class="list-item" data-act="pipeSelItem" data-sec="${esc(i.sec)}" aria-selected="${i.sec === P.selItem}"><div class="item-row">${stIc(i.status)}<div class="stack" style="gap:2px"><b>§${esc(i.sec)} ${esc(i.title)}</b><div class="row" style="gap:4px">${kindPill(i.kind)}${srcPill(i.source)}${i.cases.length ? pill(`${i.cases.length} ${L("test cases", "Testfälle")}`, "ok") : ""}</div></div>${["candidate", "skipped", "error", "stopped"].includes(i.status) ? `<span class="btn sm" data-act="pipeGen" data-sec="${esc(i.sec)}">${ic("play")} ${L("Generate", "Erzeugen")}</span>` : ""}</div></button>`).join("") : `<div class="empty">${L("No changed or testable sections found.", "Keine geänderten oder testbaren Abschnitte gefunden.")}</div>`;
    list.scrollTop = sc;
    paintItem(changed);
  }
  function paintItem(changed) {
    const r = P.run, it = r && r.items.find(i => i.sec === P.selItem);
    const hd = document.getElementById("pipeItemHead"), body = document.getElementById("pipeItemBody");
    if (!hd || !body) return;
    if (!it) { hd.innerHTML = ""; body.innerHTML = `<div class="empty">${L("Select a section.", "Abschnitt auswählen.")}</div>`; return; }
    hd.innerHTML = `<div class="stack" style="gap:2px"><span class="eyebrow">§${esc(it.sec)} · ${L("page", "Seite")} ${it.page}${it.similarity != null ? ` · ${Math.round(it.similarity * 100)}% ${L("similar to the old text", "ähnlich zum alten Text")}` : ""}</span><h3>${esc(it.title)}</h3></div><div class="row">${kindPill(it.kind)}${srcPill(it.source)}${it.status === "review" ? `<button class="btn sm primary" data-act="go" data-screen="pipechanges">${ic("check")} ${L("Review this change", "Änderung prüfen")}</button>` : ""}${["candidate", "skipped", "stopped", "error", "done", "review"].includes(it.status) ? `<button class="btn sm" data-act="pipeGen" data-sec="${esc(it.sec)}">${ic("play")} ${it.status === "candidate" ? L("Extract the change", "Änderung extrahieren") : L("Extract again", "Erneut extrahieren")}</button>` : ""}</div>`;
    const evs = P.events.filter(e => e.item === it.sec);
    const live = r.live && r.live[it.sec];
    const near = window.innerHeight + window.scrollY >= document.body.scrollHeight - 160;
    const red = it.ops && it.ops.length && it.kind === "changed" ? `<details class="cot-more"><summary><b>${L("Word diff", "Wort-Diff")}</b> <span class="muted">(${it.changed_words} ${L("changed words", "geänderte Wörter")})</span></summary><div class="spec redline" style="margin-top:8px;font-size:var(--fs-sm)">${redline(it.ops)}</div></details>` : "";
    const log = it.log && it.log.length ? `<div class="callout"><b>${L("Change log", "Änderungsprotokoll")}</b>${it.log.map(esc).join("<br>")}</div>` : "";
    body.innerHTML = `${log}${red}<div class="cot">${evs.map(e => evHtml(e)).join("") || (it.status === "candidate" ? `<div class="muted" style="font-size:var(--fs-sm)">${L("Not processed yet. Start it with “Generate test cases”.", "Noch nicht bearbeitet. Mit „Testfälle erzeugen“ starten.")}</div>` : it.status === "queued" ? `<div class="muted">${L("Waiting for a free AI worker…", "Wartet auf einen freien KI-Worker…")}${queueInfo()}</div>` : "")}
      ${live ? `<div class="cot-step thought"><span class="cot-ic">…</span><div class="cot-body"><div class="cot-title">${L("AI is thinking", "KI denkt nach")}${live.tool ? " · " + L("preparing", "bereitet vor") + " " + esc(live.tool) : ""}</div><div class="cot-text live typing" id="pipeLive">${esc((live.reasoning || "") + (live.content ? "\n\n" + live.content : "")) || "…"}</div></div></div>` : ""}</div>`;
    const lv = document.getElementById("pipeLive"); if (lv) lv.scrollTop = lv.scrollHeight;
    if (changed && P.follow && near && it.status === "running") window.scrollTo({ top: document.body.scrollHeight });
  }
  function redline(ops) {
    return ops.map(([op, t]) => {
      if (op === "=") { const w = t.split(" "); return esc(w.length > 40 ? w.slice(0, 15).join(" ") + " […] " + w.slice(-15).join(" ") : t); }
      return op === "-" ? `<del>${esc(t)}</del>` : `<ins>${esc(t)}</ins>`;
    }).join(" ");
  }

  /* ---------- chain-of-thought rendering (shared by pipeline, review and developer inbox) ---------- */
  const TOOL_NAME = { run_python: () => L("terminal calculation", "Terminal-Berechnung"), record_spec_change: () => L("spec change", "Spezifikationsänderung"), submit_test_case: () => L("test case", "Testfall"), finish: () => L("finish", "Abschluss") };
  function longText(t, open) {
    t = String(t || "");
    if (t.length <= 900 || open) return `<div class="cot-text">${esc(t)}</div>`;
    return `<details class="cot-more"><summary class="cot-text">${esc(t.slice(0, 420))}… <b>${L("show all", "alles zeigen")}</b></summary><div class="cot-text">${esc(t)}</div></details>`;
  }
  // the readable test sheet: preconditions → numbered steps → expected result
  const tcSheet = c => {
    const pre = c.preconditions || [], steps = c.steps || [];
    if (!pre.length && !steps.length && !c.expected_outcome) return "";
    return `<div class="tc-sheet">${pre.length ? `<div><span class="field-label">${L("Preconditions", "Vorbedingungen")}</span><ul>${pre.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>` : ""}
      ${steps.length ? `<div><span class="field-label">${L("Steps", "Schritte")}</span><ol>${steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>` : ""}
      ${c.expected_outcome ? `<div class="tc-expect"><span class="field-label">${L("Expected result", "Erwartetes Ergebnis")}</span><div>${esc(c.expected_outcome)}</div></div>` : ""}</div>`;
  };
  const stepHtml = (cls, icon, title, body) => `<div class="cot-step ${cls}"><span class="cot-ic">${icon}</span><div class="cot-body"><div class="cot-title">${title}</div>${body}</div></div>`;
  const gmini = gs => `<span class="gmini">${(gs || []).map(g => `<span class="${g.status}" title="${esc(g.name + ": " + g.detail)}">${g.id} ${g.status === "ok" ? "✓" : g.status === "warn" ? "!" : "✕"}</span>`).join("")}</span>`;
  function evHtml(e) {
    const d = e.data || {}, t = `<span class="mono" style="font-weight:400">${esc((e.t || "").slice(11, 19))}</span>`;
    switch (e.type) {
      case "stage": return stepHtml(d.step === "done" ? "ok" : "", d.step === "done" ? "✓" : "⚙", `${t} ${esc({ ingest: L("ingest", "Einlesen"), plan: L("plan", "Plan"), diff: L("diff", "Diff"), select: L("select", "Auswahl"), queue: L("queue", "Warteschlange"), done: L("done", "fertig"), stop: L("stopped", "gestoppt") }[d.step] || d.step)} · ${L("deterministic", "deterministisch")}`, `<div class="cot-text">${esc(d.text)}</div>`);
      case "item_start": return stepHtml("", "▶", `${t} ${d.phase === "cases" ? L("writing test cases", "Testfälle schreiben") : d.phase === "extract" ? L("extracting the change", "Änderung extrahieren") : L("start", "Start")}`, `<div class="cot-text">§${esc(d.sec)} · ${esc(d.model)}</div>`);
      case "decision": return stepHtml(d.decision === "approved" ? "ok" : d.decision === "declined" ? "err" : "", "👤", `${t} ${d.decision === "approved" ? L("examiner approved the spec change", "Prüfer hat die Änderung freigegeben") : d.decision === "declined" ? L("examiner declined the spec change", "Prüfer hat die Änderung abgelehnt") : L("examiner undid the decision", "Prüfer hat die Entscheidung zurückgenommen")}`, `<div class="cot-text muted">${esc(d.by || "")}</div>`);
      case "change_edited": return stepHtml("", "✎", `${t} ${L("examiner edited the spec change", "Prüfer hat die Änderung bearbeitet")}`, `<div class="cot-text muted">${esc(d.by || "")}: ${esc((d.changes || []).join(", "))}</div>`);
      case "context": return stepHtml("", "↗", `${t} ${L("sent to the model", "an das Modell gesendet")}`, `<div class="cot-text">~${fmtN(Math.round(d.chars / 4))} ${L("tokens", "Tokens")}: §${esc((d.sent || []).join(", §"))}${d.old_version ? " + " + L("old version + word diff", "alte Fassung + Wort-Diff") : ""} · ${L("nothing else from the archive", "sonst nichts aus dem Archiv")}</div>`);
      case "thought": return stepHtml("thought", "💭", `${t} ${d.source === "model reasoning" ? L("model reasoning", "Denkprozess des Modells") : L("why", "warum") + ": " + esc((TOOL_NAME[d.source] || (() => d.source))())}`, longText(d.text));
      case "text": return stepHtml("say", "AI", `${t} ${L("AI", "KI")}`, longText(d.text, true));
      case "terminal": return stepHtml("term", "$", `${t} ${L("terminal", "Terminal")} ${d.refused ? pill(L("refused by sandbox", "von Sandbox abgelehnt"), "bad") : d.ok ? pill("exit 0", "ok") : pill(L("error", "Fehler"), "bad")}`,
        `<div class="term"><div class="term-head"><span>$ python calc.py</span><span>${d.ms} ms</span></div><pre class="term-code">${esc(d.code)}</pre><pre class="term-out ${d.ok ? "" : "err"}">${esc(d.stdout || "")}${d.stderr ? (d.stdout ? "\n" : "") + esc(d.stderr) : ""}${!d.stdout && !d.stderr ? "(no output)" : ""}</pre></div>`);
      case "spec_change": return stepHtml("spec", "{}", `${t} ${L("spec change extracted", "Änderung extrahiert")} ${pill(esc(d.change_type || "?"), "accent")}${d.formula_changed ? ` <span class="flag-formula">ƒ ${L("formula changed", "Formel geändert")}</span>` : ""}`,
        `<div class="cot-text"><b>${esc(d.summary || "")}</b></div>${(d.quote_checks || []).map(q => `<div class="row" style="gap:6px;align-items:start"><span class="pill ${q.ok ? "ok" : "bad"}">${q.ok ? "✓" : "✕"} ${q.side === "old" ? L("old", "alt") : L("new", "neu")}</span><span class="de-quote" style="font-size:var(--fs-sm)">„${esc(q.quote)}“</span></div>`).join("")}
        <details class="cot-more"><summary class="muted">JSON</summary><pre class="json">${esc(JSON.stringify(Object.fromEntries(Object.entries(d).filter(([k]) => k !== "quote_checks")), null, 2))}</pre></details>`);
      case "test_case": return stepHtml("case", "TC", `${t} ${L("test case submitted", "Testfall eingereicht")} ${pill(esc(d.kind), "")} ${d.formula_changed ? `<span class="flag-formula">ƒ ${L("formula updated", "Formel aktualisiert")}</span>` : ""}`,
        `<div class="tc-card ${d.formula_changed ? "changed" : ""}"><b>${esc(d.title)}</b><span class="muted" style="font-size:var(--fs-sm)">${esc(d.criterion)}</span>${tcSheet(d)}<code class="formula-view">${esc((d.formula || {}).expression || "")}</code><div class="row between"><span>${L("Oracle result", "Orakel-Ergebnis")}: <b class="mono">${esc(d.expected_value == null ? "—" : d.expected_value)}</b> <span class="muted">(${L("AI", "KI")}: ${esc(d.ai_expected_value)})</span></span>${gmini(d.guards)}</div></div>`);
      case "tool_result": return d.tool === "finish" ? "" : stepHtml(/GUARDS FAILED|NOT verbatim/.test(d.result) ? "err" : "", "↩", `${t} ${L("feedback to the AI", "Rückmeldung an die KI")}`, `<div class="cot-text muted">${esc(d.result)}</div>`);
      case "tool_error": return stepHtml("err", "!", `${t} ${L("tool call rejected", "Tool-Aufruf abgelehnt")}`, `<div class="cot-text">${esc(d.message)}</div>`);
      case "retry": return stepHtml("", "↻", `${t} ${L("retry", "Wiederholung")}`, `<div class="cot-text muted">${esc(d.message)}</div>`);
      case "error": return stepHtml("err", "✕", `${t} ${L("error", "Fehler")}`, `<div class="cot-text">${esc(d.message)}</div>`);
      case "stopped": return stepHtml("err", "■", `${t} ${L("stopped by the examiner", "vom Prüfer gestoppt")}`, `<div class="cot-text muted">${L("The model stream was closed; submitted test cases are kept", "Der Modell-Stream wurde geschlossen; eingereichte Testfälle bleiben erhalten")}${d.kept != null ? ` (${d.kept})` : ""}.</div>`);
      case "item_done": return stepHtml(d.status === "error" ? "err" : "ok", d.status === "error" ? "✕" : "✓", `${t} ${L("section done", "Abschnitt fertig")}`, `<div class="cot-text">${d.cases && d.cases.length ? `${d.cases.length} ${L("test case(s) waiting for review", "Testfall/-fälle warten auf Prüfung")}: ${d.cases.map(id => `<a href="#" data-act="pipeOpenCase" data-id="${esc(id)}">${esc(id)}</a>`).join(", ")}` : L("no test cases", "keine Testfälle")}${d.summary ? `<br><span class="muted">${esc(d.summary)}</span>` : ""}</div>`);
      default: return "";
    }
  }

  /* ---------- examiner review: formula, variables, verify, send ---------- */
  async function loadCases() {
    if (!P.online) return;
    try { P.cases = await api("/api/testcases"); if (onScreen("review") && !editing()) rerender(); else A.renderShell(); } catch (e) { /* offline */ }
  }
  const editing = () => { const a = document.activeElement; return a && a.closest && a.closest("#view") && a.matches("input, textarea, select"); };
  // the editable part of a test case; compared with the stored case to know whether there are unsaved edits
  const draftOf = c => JSON.parse(JSON.stringify({ formula: c.formula || { expression: "", variables: [] }, scenario: c.scenario || {}, title: c.title, criterion: c.criterion,
    expected_outcome: c.expected_outcome, preconditions: c.preconditions || [], steps: c.steps || [] }));
  const isDirty = () => P.draft && P.caseDetail && JSON.stringify(P.draft) !== JSON.stringify(draftOf(P.caseDetail));
  async function openCase(id) {
    P.selCase = id;
    try { P.caseDetail = await api(`/api/testcases/${encodeURIComponent(id)}`); } catch (e) { A.toast(e.message); return; }
    P.draft = draftOf(P.caseDetail);
    P.preview = { ok: !P.caseDetail.formula_error, value: P.caseDetail.expected_value, error: P.caseDetail.formula_error, trace: P.caseDetail.trace || [], names: [] };
    if (S.screen !== "review") A.go("review"); else rerender();
  }
  const STATUS = { draft: ["draft", "warn"], verified: ["verified", "ok"], sent: ["sent to devs", "info"], acknowledged: ["acknowledged", "ok"], rejected: ["rejected", "bad"] };
  const statusPill = s => { const [en, cls] = STATUS[s] || [s, ""]; return pill(({ draft: L("draft", "Entwurf"), verified: "✓ " + L("verified", "verifiziert"), "sent to devs": L("sent to devs", "an Entwickler"), acknowledged: "✓✓ " + L("acknowledged", "bestätigt"), rejected: L("rejected", "abgelehnt") })[en] || en, cls); };

  const sendable = () => [...P.sel].filter(id => P.cases.some(c => c.id === id && c.status !== "rejected"));
  function selBar(lst) {
    const ids = lst.filter(c => c.status !== "rejected").map(c => c.id), all = ids.length && ids.every(id => P.sel.has(id)), n = P.sel.size;
    return `<div class="sel-bar" id="selBar"><label class="row" style="gap:6px"><input type="checkbox" data-selall="1" ${all ? "checked" : ""} ${ids.length ? "" : "disabled"}> ${L("Select all", "Alle auswählen")}</label>
      <span class="muted" style="font-size:var(--fs-sm)">${n ? `${n} ${L("selected", "ausgewählt")}` : L("Tick test cases to send or delete them", "Testfälle zum Senden oder Löschen anhaken")}</span>
      <button class="btn sm danger-ghost" data-act="pipeDeleteSel" ${n ? "" : "disabled"}>${ic("trash")} ${L("Delete", "Löschen")}${n ? ` (${n})` : ""}</button></div>`;
  }
  function paintSel() {  // update the buttons without re-rendering the list
    const n = sendable().length, b = document.querySelector('[data-act="pipeSendOpen"]'), bar = document.getElementById("selBar");
    if (b) { b.disabled = !n; b.innerHTML = `${ic("inbox")} ${L("Send to developers", "An Entwickler senden")}${n ? ` (${n})` : ""}`; }
    if (bar) { const f = P.caseFilter, lst = P.cases.filter(c => f === "all" || c.status === f || (f === "changed" && c.formula_changed)); bar.outerHTML = selBar(lst); }
  }
  async function deleteCases(ids) {
    if (!ids.length) return;
    const what = ids.length === 1 ? ids[0] : `${ids.length} ${L("test cases", "Testfälle")}`;
    if (!confirm(`${L("Delete", "Löschen:")} ${what}? ${L("Developers who received them will no longer see them. This cannot be undone.", "Entwickler, die sie erhalten haben, sehen sie nicht mehr. Dies kann nicht rückgängig gemacht werden.")}`)) return;
    let done = 0;
    for (const id of ids) {
      try { await api(`/api/testcases/${encodeURIComponent(id)}`, { method: "DELETE" }); done++; P.sel.delete(id); if (P.selCase === id) { P.selCase = null; P.caseDetail = null; } }
      catch (e) { A.toast(`${id}: ${e.message}`); }
    }
    if (done) { A.log("examiner", L("Test cases deleted", "Testfälle gelöscht"), ids.slice(0, done).join(", ")); A.toast(`${done} ${L("test case(s) deleted", "Testfall/-fälle gelöscht")}`); }
    await loadCases(); rerender();
  }
  function vReview() {
    if (P.online === false) return `${head(L("Test-case review", "Testfall-Prüfung"), "")}${docsInner()}`;
    const f = P.caseFilter, lst = P.cases.filter(c => f === "all" || c.status === f || (f === "changed" && c.formula_changed));
    const cnt = s => P.cases.filter(c => s === "changed" ? c.formula_changed : c.status === s).length;
    const selSend = sendable();
    return `${head(L("Test-case review", "Testfall-Prüfung"), L("Check what the AI produced. Flagged formulas changed with the law: read the formula, edit it if needed, set the variable values, and verify. Tick test cases to send them to the developers or to delete them.", "Prüfen, was die KI erzeugt hat. Markierte Formeln haben sich mit dem Gesetz geändert: Formel lesen, bei Bedarf ändern, Variablenwerte setzen und verifizieren. Verifizierte Testfälle gehen an die Entwickler."),
      `<button class="btn" data-act="pipeRefreshCases">↻ ${L("Refresh", "Aktualisieren")}</button><button class="btn primary" data-act="pipeSendOpen" ${selSend.length ? "" : "disabled"}>${ic("inbox")} ${L("Send to developers", "An Entwickler senden")}${selSend.length ? ` (${selSend.length})` : ""}</button>`)}
      <div class="split"><section class="panel"><div class="tabs" role="tablist">${[["all", L("All", "Alle"), P.cases.length], ["changed", "ƒ " + L("formula updated", "Formel neu"), cnt("changed")], ["draft", L("Draft", "Entwurf"), cnt("draft")], ["verified", L("Verified", "Verifiziert"), cnt("verified")], ["sent", L("Sent", "Gesendet"), cnt("sent") + cnt("acknowledged")]].map(([k, t, n]) => `<button class="tab" role="tab" aria-selected="${f === k}" data-act="pipeFilter" data-f="${k}">${t} <span class="muted">${n}</span></button>`).join("")}</div>
        ${selBar(lst)}<div class="panel-body flush" style="max-height:72vh;overflow:auto">${lst.length ? lst.map(c => { const fails = (c.guards || []).filter(g => g.status === "fail").length; return `<div class="list-item" data-act="pipeOpenCase" data-id="${esc(c.id)}" aria-selected="${c.id === P.selCase}" role="button" tabindex="0"><div class="row between" style="flex-wrap:nowrap;align-items:start"><label class="chk" onclick="event.stopPropagation()"><input type="checkbox" data-sel="${esc(c.id)}" ${P.sel.has(c.id) ? "checked" : ""} ${c.status === "rejected" ? "disabled" : ""} title="${esc(c.status === "rejected" ? L("rejected — reopen it to send it", "abgelehnt — zum Senden wieder öffnen") : L("select to send or delete", "zum Senden oder Löschen auswählen"))}"></label><div class="stack" style="gap:3px;flex:1"><span class="mono muted" style="font-size:11px">${esc(c.id)}</span><b style="font-size:var(--fs-sm)">${esc(c.title)}</b><div class="row" style="gap:4px">${statusPill(c.status)}${pill("§" + esc(c.section), "mono")}${c.formula_changed ? `<span class="flag-formula">ƒ ${L("updated", "neu")}</span>` : ""}${c.formula_edited ? pill(L("edited", "bearbeitet"), "info") : ""}${fails ? pill(`${fails} ${L("check(s) failed", "Prüfung(en) fehlgeschlagen")}`, "bad") : ""}</div></div><button class="btn ghost sm row-del" data-act="pipeDeleteOne" data-id="${esc(c.id)}" title="${esc(L("Delete test case", "Testfall löschen"))}" aria-label="${esc(L("Delete", "Löschen") + " " + c.id)}">${ic("trash")}</button></div></div>`; }).join("") : `<div class="empty">${P.cases.length ? L("Nothing in this filter.", "Nichts in diesem Filter.") : L("No test cases yet. Run the pipeline first.", "Noch keine Testfälle. Zuerst die Pipeline laufen lassen.")}</div>`}</div></section>
      <div class="stack" id="pipeCase">${caseDetailHtml()}</div></div>`;
  }

  function formulaView(expr, vars) {
    const names = new Set((vars || []).map(v => v.name)), byName = Object.fromEntries((vars || []).map(v => [v.name, v]));
    const fns = new Set(Object.keys((P.status && P.status.functions) || {}).map(k => k.split("(")[0]).concat(["date", "add_days", "add_weeks", "add_months", "days_between", "days_inclusive", "weekday", "min", "max", "abs", "round", "floor", "ceil", "percent"]));
    return esc(expr || "").replace(/[A-Za-z_][A-Za-z0-9_]*/g, w => names.has(w) ? `<span class="v" title="${esc(w + " = " + byName[w].value + (byName[w].unit ? " " + byName[w].unit : "") + (byName[w].description ? " · " + byName[w].description : ""))}">${w}</span>` : fns.has(w) ? `<span class="f">${w}</span>` : w);
  }
  function varTable(vars, readonlyMeta) {
    return `<table class="var-table"><thead><tr><th>${L("Variable", "Variable")}</th><th>${L("Value", "Wert")}</th><th>${L("Type", "Typ")}</th><th>${L("Source", "Quelle")}</th>${readonlyMeta ? "" : "<th></th>"}</tr></thead><tbody>
      ${vars.map((v, i) => `<tr class="${v.source === "spec" ? "spec-param" : ""}"><td><span class="var-name">${esc(v.name)}</span>${v.unit ? ` <span class="muted">${esc(v.unit)}</span>` : ""}${v.description ? `<div class="muted" style="font-size:11px">${esc(v.description)}</div>` : ""}</td>
        <td><input data-var="${i}" data-k="value" value="${esc(v.value == null ? "" : v.value)}" ${v.type === "date" ? 'placeholder="YYYY-MM-DD"' : ""} aria-label="${esc(v.name)}"></td>
        <td>${readonlyMeta ? esc(v.type || "number") : `<select data-var="${i}" data-k="type">${["number", "date", "bool"].map(t => `<option ${t === (v.type || "number") ? "selected" : ""}>${t}</option>`).join("")}</select>`}</td>
        <td>${v.source === "spec" ? `${pill(L("law", "Gesetz"), "warn")}${v.quote ? `<div class="de-quote muted" style="font-size:11px;max-width:32ch">„${esc(v.quote)}“</div>` : ""}` : pill(L("scenario", "Szenario"), "")}</td>
        ${readonlyMeta ? "" : `<td><button class="btn ghost sm" data-act="pipeDelVar" data-i="${i}" title="${esc(L("Remove", "Entfernen"))}">✕</button></td>`}</tr>`).join("")}</tbody></table>`;
  }
  function previewHtml(pv, saved) {
    if (!pv) return "";
    if (!pv.ok) return `<div class="callout bad"><b>${L("Formula does not evaluate", "Formel nicht auswertbar")}</b>${esc(pv.error || "")}</div>`;
    return `<div class="row between" style="align-items:end"><div class="stack" style="gap:2px"><span class="field-label">${L("Expected result (computed by the oracle)", "Erwartetes Ergebnis (vom Orakel berechnet)")}</span><span class="result-big">${esc(pv.value)}</span></div>${saved != null && saved !== pv.value ? pill(L("unsaved — was ", "nicht gespeichert — vorher ") + esc(saved), "warn") : ""}</div>
      ${pv.trace && pv.trace.length ? `<details class="cot-more"><summary class="muted" style="font-size:var(--fs-xs)">${L("step by step", "Schritt für Schritt")}</summary><div class="trace">${pv.trace.map(([s, v]) => `${esc(s)} = <b>${esc(v)}</b>`).join("<br>")}</div></details>` : ""}`;
  }
  function caseDetailHtml() {
    const c = P.caseDetail, d = P.draft;
    if (!c || !d) return `<section class="panel"><div class="empty">${L("Select a test case.", "Testfall auswählen.")}</div></section>`;
    const locked = c.status === "sent" || c.status === "acknowledged";
    const fm = d.formula, names = new Set((P.preview && P.preview.names) || []), missing = [...names].filter(n => !fm.variables.some(v => v.name === n));
    const sc = c.spec_change || {};
    const dirty = isDirty();
    return `<section class="panel"><div class="panel-head"><div class="stack" style="gap:2px"><span class="eyebrow">${esc(c.id)} · §${esc(c.section)} ${esc(c.section_title)} · ${esc(c.document.name)}${c.previous_document ? " ← " + esc(c.previous_document.name) : ""}</span><h3>${esc(c.title)}</h3></div><div class="row">${statusPill(c.status)}${pill(esc(c.kind), "")}</div></div>
      <div class="panel-body">
        ${c.formula_changed ? `<div class="callout warn"><b>ƒ ${L("Formula updated by the law change — please check it", "Formel durch die Gesetzesänderung aktualisiert — bitte prüfen")}</b>${c.previous_expression ? `<span>${L("Before", "Vorher")}: <span class="formula-old">${esc(c.previous_expression)}</span></span>` : ""}<span>${L("Now", "Jetzt")}: <code>${esc(c.ai_expression || (c.formula || {}).expression || "")}</code>${c.formula_edited ? " → " + L("edited by the examiner", "vom Prüfer geändert") : ""}</span></div>` : ""}
        <div class="formula-box ${c.formula_changed ? "changed" : ""}">
          <div class="row between"><span class="field-label">${L("Formula", "Formel")}${fm.result_name ? ` → <b class="mono">${esc(fm.result_name)}</b>${fm.result_unit ? " (" + esc(fm.result_unit) + ")" : ""}` : ""}</span>${c.formula_changed ? `<span class="flag-formula">ƒ ${L("updated", "aktualisiert")}</span>` : ""}</div>
          <div class="formula-view" id="pipeFormulaView">${formulaView(fm.expression, fm.variables)}</div>
          <textarea class="textarea formula-input" id="pipeExpr" spellcheck="false" ${locked ? "readonly" : ""} aria-label="${esc(L("Formula", "Formel"))}">${esc(fm.expression)}</textarea>
          <div id="pipeMissing">${missing.length ? `<div class="row">${L("Variables without a value", "Variablen ohne Wert")}: ${missing.map(n => `<button class="btn sm" data-act="pipeAddVar" data-name="${esc(n)}">+ ${esc(n)}</button>`).join("")}</div>` : ""}</div>
          <div id="pipeVars">${varTable(fm.variables, false)}</div>
          ${locked ? "" : `<div class="row"><button class="btn sm" data-act="pipeAddVar">+ ${L("Variable", "Variable")}</button><span class="muted" style="font-size:var(--fs-xs)">${L("Functions", "Funktionen")}: date, add_days, add_weeks, add_months, days_between, days_inclusive, weekday, min, max, round, floor, ceil, percent · <code>a if cond else b</code></span></div>`}
          <div id="pipePreview">${previewHtml(P.preview, c.expected_value)}</div>
          <span class="muted" style="font-size:var(--fs-xs)">${L("AI's own value from its terminal", "Eigener Wert der KI aus dem Terminal")}: <span class="mono">${esc(c.ai_expected_value)}</span></span>
        </div>
        <div class="grid-2"><label class="stack" style="gap:4px"><span class="field-label">${L("Title", "Titel")}</span><input class="input" id="pipeTitle" value="${esc(d.title)}" ${locked ? "readonly" : ""}></label><label class="stack" style="gap:4px"><span class="field-label">${L("Expected outcome", "Erwartetes Verhalten")}</span><input class="input" id="pipeOutcome" value="${esc(d.expected_outcome || "")}" ${locked ? "readonly" : ""}></label></div>
        <label class="stack" style="gap:4px"><span class="field-label">${L("Criterion", "Kriterium")}</span><textarea class="textarea" id="pipeCrit" style="font-family:var(--font-body);min-height:56px" ${locked ? "readonly" : ""}>${esc(d.criterion || "")}</textarea></label>
        <div class="grid-2"><label class="stack" style="gap:4px"><span class="field-label">${L("Preconditions (one per line)", "Vorbedingungen (eine je Zeile)")}</span><textarea class="textarea" id="pipePre" style="font-family:var(--font-body);min-height:96px" ${locked ? "readonly" : ""}>${esc((d.preconditions || []).join("\n"))}</textarea></label>
          <label class="stack" style="gap:4px"><span class="field-label">${L("Test steps (one per line)", "Testschritte (einer je Zeile)")}</span><textarea class="textarea" id="pipeSteps" style="font-family:var(--font-body);min-height:96px" ${locked ? "readonly" : ""}>${esc((d.steps || []).join("\n"))}</textarea></label></div>
        ${!(d.steps || []).length || !(d.preconditions || []).length ? `<div class="callout warn">${L("This test case has no preconditions or steps yet. Add them so a tester can run it without reading the spec.", "Dieser Testfall hat noch keine Vorbedingungen oder Schritte. Bitte ergänzen, damit ein Tester ihn ohne die Spezifikation ausführen kann.")}</div>` : ""}
        <label class="stack" style="gap:4px"><span class="field-label">${L("Scenario (test data the tester enters, JSON)", "Szenario (Testdaten, die der Tester eingibt, JSON)")}</span><textarea class="textarea" id="pipeScenario" style="min-height:110px" ${locked ? "readonly" : ""}>${esc(JSON.stringify(d.scenario, null, 2))}</textarea></label>
        <div class="row between"><div class="row">${locked ? `<span class="muted" style="font-size:var(--fs-sm)">${L("Sent to", "Gesendet an")} ${esc((c.sent_to || []).join(", "))}</span><button class="btn sm" data-act="pipeReopen">${L("Reopen", "Wieder öffnen")}</button>` : `<button class="btn" data-act="pipeSave" ${dirty ? "" : "disabled"} id="pipeSaveBtn">${L("Save changes", "Änderungen speichern")}</button><button class="btn ok primary" data-act="pipeVerify" ${c.status === "verified" ? "disabled" : ""}>✓ ${c.status === "verified" ? L("Verified", "Verifiziert") : L("Verify", "Verifizieren")}</button><button class="btn bad" data-act="pipeReject" ${c.status === "rejected" ? "disabled" : ""}>✕ ${L("Reject", "Ablehnen")}</button>`}</div>
          <button class="btn ghost sm" data-act="pipeExport" data-id="${esc(c.id)}">${ic("download")} JSON</button></div>
        ${c.verified_by ? `<span class="muted" style="font-size:var(--fs-xs)">${L("Verified by", "Verifiziert von")} ${esc(c.verified_by)} · ${esc(c.verified_at)}${c.override_reason ? " · " + L("override", "Ausnahme") + ": " + esc(c.override_reason) : ""}</span>` : ""}
      </div></section>
      <section class="panel"><div class="panel-head"><h4>${L("Deterministic checks", "Deterministische Prüfungen")}</h4>${gmini(c.guards)}</div><div class="panel-body">${(c.guards || []).map(g => `<div class="guard ${g.status === "ok" ? "ok" : g.status === "fail" ? "bad" : ""}"><span class="gi">${g.status === "ok" ? "✓" : g.status === "fail" ? "✕" : "!"}</span><div><b>${esc(g.id)} ${esc(g.name)}</b><div class="muted">${esc(g.detail)}</div></div></div>`).join("")}${c.formula_edited ? `<div class="callout">${L("The examiner edited the formula: G3 compared the AI's original value; the expected value now comes from the edited formula.", "Der Prüfer hat die Formel geändert: G3 verglich den ursprünglichen KI-Wert; der Erwartungswert kommt jetzt aus der geänderten Formel.")}</div>` : ""}</div></section>
      <section class="panel"><div class="panel-head"><h4>${L("Spec change", "Spezifikationsänderung")} ${pill(esc(sc.change_type || "?"), "accent")}</h4></div><div class="panel-body"><div><b>${esc(sc.summary || "")}</b></div>
        ${sc.old_rule ? `<div class="kv"><dt>${L("before", "vorher")}</dt><dd>${esc(sc.old_rule)}</dd><dt>${L("now", "jetzt")}</dt><dd>${esc(sc.new_rule || "")}</dd></div>` : `<div class="kv"><dt>${L("rule", "Regel")}</dt><dd>${esc(sc.new_rule || "")}</dd></div>`}
        ${(c.quotes || []).map(q => `<div class="de-quote" style="font-size:var(--fs-sm)">„${esc(q)}“</div>`).join("")}
        <details class="cot-more"><summary class="muted">JSON</summary><pre class="json">${esc(JSON.stringify(sc, null, 2))}</pre></details></div></section>
      <section class="panel"><div class="panel-head"><h4>${L("Chain of thought (saved with this test case)", "Gedankengang (mit diesem Testfall gespeichert)")}</h4><span class="muted" style="font-size:var(--fs-xs)">${(c.cot || []).length} ${L("steps", "Schritte")} · ${esc(c.model)}</span></div><div class="panel-body"><div class="cot">${(c.cot || []).map(evHtml).join("")}</div></div></section>
      <section class="panel"><div class="panel-head"><h4>${L("History", "Verlauf")}</h4></div><div class="panel-body flush">${(c.history || []).slice().reverse().map(h => `<div class="log-item"><span class="log-time">${esc((h.t || "").slice(5, 16).replace("T", " "))}</span><span>${h.who && h.who.startsWith("AI") ? "AI" : "👤"}</span><div><b>${esc(h.action)}</b> · ${esc(h.who)}<div class="muted">${esc(h.detail || "")}</div></div></div>`).join("")}</div></section>`;
  }
  let evalTimer = null;
  function scheduleEval() {
    clearTimeout(evalTimer);
    evalTimer = setTimeout(async () => {
      const fm = P.draft && P.draft.formula; if (!fm) return;
      try { P.preview = await api("/api/evaluate", { body: { expression: fm.expression, variables: fm.variables } }); } catch (e) { P.preview = { ok: false, error: e.message }; }
      paintFormula();
    }, 250);
  }
  function paintFormula() {
    const c = P.caseDetail, d = P.draft; if (!c || !d) return;
    const fv = document.getElementById("pipeFormulaView"); if (fv) fv.innerHTML = formulaView(d.formula.expression, d.formula.variables);
    const pv = document.getElementById("pipePreview"); if (pv) pv.innerHTML = previewHtml(P.preview, c.expected_value);
    const names = (P.preview && P.preview.names) || [], missing = names.filter(n => !d.formula.variables.some(v => v.name === n));
    const ms = document.getElementById("pipeMissing"); if (ms) ms.innerHTML = missing.length ? `<div class="row">${L("Variables without a value", "Variablen ohne Wert")}: ${missing.map(n => `<button class="btn sm" data-act="pipeAddVar" data-name="${esc(n)}">+ ${esc(n)}</button>`).join("")}</div>` : "";
    const sb = document.getElementById("pipeSaveBtn"); if (sb) sb.disabled = false;
  }
  function readDraftFields() {
    const d = P.draft; if (!d) return true;
    const g = id => document.getElementById(id);
    if (g("pipeTitle")) d.title = g("pipeTitle").value;
    if (g("pipeOutcome")) d.expected_outcome = g("pipeOutcome").value;
    if (g("pipeCrit")) d.criterion = g("pipeCrit").value;
    const lines = el => el.value.split("\n").map(s => s.replace(/^\s*(\d+[.)]|[-•])\s*/, "").trim()).filter(Boolean);
    if (g("pipePre")) d.preconditions = lines(g("pipePre"));
    if (g("pipeSteps")) d.steps = lines(g("pipeSteps"));
    if (g("pipeScenario")) { try { d.scenario = JSON.parse(g("pipeScenario").value || "{}"); } catch (e) { A.toast(L("Scenario is not valid JSON", "Szenario ist kein gültiges JSON")); return false; } }
    return true;
  }
  async function saveCase() {
    if (!readDraftFields()) return false;
    try {
      const r = await api(`/api/testcases/${encodeURIComponent(P.selCase)}`, { method: "PATCH", body: P.draft });
      A.toast(r.changes.length ? L("Saved: ", "Gespeichert: ") + r.changes.length + L(" change(s), expected value recomputed", " Änderung(en), Erwartungswert neu berechnet") : L("No changes", "Keine Änderungen"));
      A.log("examiner", L("Test case edited", "Testfall bearbeitet"), `${P.selCase}: ${r.changes.join("; ")}`);
      await loadCases(); await openCase(P.selCase); return true;
    } catch (e) { A.toast(e.message); return false; }
  }
  async function caseAction(action, body) {
    try {
      await api(`/api/testcases/${encodeURIComponent(P.selCase)}/${action}`, { body: body || {} });
      A.log("examiner", { verify: L("Test case verified", "Testfall verifiziert"), reject: L("Test case rejected", "Testfall abgelehnt"), reopen: L("Test case reopened", "Testfall wieder geöffnet") }[action], P.selCase + (body && (body.reason || body.override_reason) ? " · " + (body.reason || body.override_reason) : ""));
      await loadCases(); await openCase(P.selCase); return true;
    } catch (e) {
      if (action === "verify" && /give a reason/.test(e.message)) {
        A.modal(L("Checks failed", "Prüfungen fehlgeschlagen"), `<p>${esc(e.message)}</p><label class="stack"><span class="field-label">${L("Why is the test case correct anyway?", "Warum ist der Testfall trotzdem korrekt?")}</span><textarea class="textarea" id="pipeOverride" style="font-family:var(--font-body)"></textarea></label>`, null, `<button class="btn" data-act="closeModal">${L("Cancel", "Abbrechen")}</button><button class="btn primary" data-act="pipeVerifyOverride">${L("Verify with reason", "Mit Begründung verifizieren")}</button>`);
      } else A.toast(e.message);
      return false;
    }
  }
  async function openSend() {
    try { P.users = await api("/api/users"); } catch (e) { /* keep the old list */ }
    const devs = P.users.filter(u => u.role === "dev");
    const ids = sendable(), unverified = ids.filter(id => !["verified", "sent", "acknowledged"].includes((P.cases.find(c => c.id === id) || {}).status));
    A.modal(L("Send to developers", "An Entwickler senden"), `<p class="muted" style="font-size:var(--fs-sm)">${ids.length} ${L("test case(s)", "Testfall/-fälle")}: <span class="mono">${ids.map(esc).join(", ")}</span></p>${unverified.length ? `<div class="callout warn"><b>${unverified.length} ${L("not verified yet", "noch nicht verifiziert")}</b>${L("Sending them counts as your verification; it is recorded in each test case's history.", "Das Senden gilt als Ihre Verifizierung und wird in der Historie jedes Testfalls vermerkt.")}</div>` : ""}
      <div class="stack">${devs.length ? devs.map(u => `<label class="row"><input type="checkbox" class="pipeTo" value="${esc(u.name)}" checked> <b>${esc(u.name)}</b> <span class="muted" style="font-size:var(--fs-xs)">${u.seen ? L("last seen", "zuletzt") + " " + esc(u.seen.replace("T", " ")) : L("not signed in yet", "noch nicht angemeldet")}</span></label>`).join("") : `<div class="muted" style="font-size:var(--fs-sm)">${L("No developer has signed in yet. Developers open this page, choose “Developer” and enter their name. You can also type names here.", "Noch kein Entwickler angemeldet. Entwickler öffnen diese Seite, wählen „Entwickler“ und geben ihren Namen ein. Namen können auch hier eingetragen werden.")}</div>`}</div>
      <label class="stack"><span class="field-label">${L("Other developers (comma-separated)", "Weitere Entwickler (durch Komma getrennt)")}</span><input class="input" id="pipeToExtra"></label>
      <label class="stack"><span class="field-label">${L("Note", "Notiz")}</span><input class="input" id="pipeNote" placeholder="${esc(L("e.g. EEL 13.4 — DBVO boundary", "z. B. EEL 13.4 — DBVO-Grenzfall"))}"></label>`, null,
      `<button class="btn" data-act="closeModal">${L("Cancel", "Abbrechen")}</button><button class="btn primary" data-act="pipeSend" data-ids="${esc(ids.join(","))}">${ic("inbox")} ${L("Send", "Senden")}</button>`);
  }

  /* ---------- users and the developer inbox ---------- */
  function shell() {
    // signed in: show who and as what instead of the role switch; the user button logs out
    const seg = document.getElementById("roleSeg"), b = document.getElementById("userBtn");
    if (P.session) {
      if (seg) seg.innerHTML = `<button aria-pressed="true" tabindex="-1">${S.role === "dev" ? L("Developer", "Entwickler") : S.role === "vendor" ? L("Vendor", "Hersteller") : "ITSG"}</button>`
        + (S.role === "vendor" && P.session.vendor ? `<button aria-pressed="false" tabindex="-1">${L("as", "als")} <b>${esc((A.C.VENDORS.find(v => v.id === P.session.vendor) || {}).name || "")}</b></button>` : "")
        + (S.role === "vendor" && !P.session.vendor && A.S.vendorUser ? `<button aria-pressed="false" data-act="signInModal" title="${esc(L("Switch company", "Firma wechseln"))}">${L("as", "als")} <b>${esc((A.C.VENDORS.find(v => v.id === A.S.vendorUser) || {}).name || "")}</b> ▾</button>` : "");
      if (b) { b.innerHTML = `👤 <span>${esc(P.session.user)}</span> · ${L("Log out", "Abmelden")}`; b.dataset.act = "pipeLogout"; }
      const ai = document.getElementById("aiBtn"); if (ai) ai.hidden = S.role === "dev";
    } else if (b) { b.innerHTML = `👤 <span>${L("Sign in", "Anmelden")}</span>`; b.dataset.act = "pipeLogout"; }
  }
  function askName(then) {
    A.modal(L("Who are you?", "Wer sind Sie?"), `<p class="muted" style="font-size:var(--fs-sm)">${L("Your name is recorded with every edit, verification and hand-over. Developers receive test cases under this name.", "Ihr Name wird bei jeder Änderung, Verifizierung und Übergabe vermerkt. Entwickler erhalten Testfälle unter diesem Namen.")}</p>
      <label class="stack"><span class="field-label">${L("Name", "Name")}</span><input class="input" id="pipeUserName" value="${esc(P.user)}" autocomplete="name"></label>`, null,
      `<button class="btn" data-act="closeModal">${L("Cancel", "Abbrechen")}</button><button class="btn primary" data-act="pipeSaveUser">${L("Continue", "Weiter")}</button>`);
    P.afterName = then;
    setTimeout(() => { const i = document.getElementById("pipeUserName"); if (i) i.focus(); }, 30);
  }
  async function register() {
    if (!P.online || !P.user || !["itsg", "dev", "vendor"].includes(S.role)) return;
    try { await api("/api/users", { body: { name: P.user, role: S.role } }); } catch (e) { /* offline */ }
  }
  function onRole() {
    if (S.role === "dev" && !P.user) askName(() => { loadInbox(); });
    else { register(); if (S.role === "dev") loadInbox(); }
  }
  async function loadInbox() {
    if (!P.online || !P.user) return;
    try {
      const before = P.inbox.length;
      P.inbox = await api(`/api/inbox?user=${encodeURIComponent(P.user)}`);
      if (S.role === "dev" && P.inbox.length > before && before) A.toast(L("New test cases from ITSG", "Neue Testfälle von ITSG"));
      if (onScreen("devinbox") && !editing()) rerender(); else A.renderShell();
    } catch (e) { /* offline */ }
  }
  async function openInbox(id) {
    P.selInbox = id;
    try { P.inboxDetail = await api(`/api/testcases/${encodeURIComponent(id)}`); } catch (e) { A.toast(e.message); return; }
    P.devVars = JSON.parse(JSON.stringify((P.inboxDetail.formula || {}).variables || []));
    P.devPreview = { ok: true, value: P.inboxDetail.expected_value, trace: P.inboxDetail.trace || [] };
    if (!P.seenInbox.includes(id)) { P.seenInbox.push(id); store.set("seenInbox", P.seenInbox); }
    rerender();
  }
  function vDevInbox() {
    if (P.online === false) return `${head(L("Developer inbox", "Entwickler-Postfach"), "")}${docsInner()}`;
    if (!P.user) return `${head(L("Developer inbox", "Entwickler-Postfach"), "")}<section class="panel"><div class="panel-body"><p>${L("Enter your name to see the test cases ITSG sent you.", "Namen eingeben, um die von ITSG gesendeten Testfälle zu sehen.")}</p><div><button class="btn primary" data-act="pipeUser">👤 ${L("Sign in", "Anmelden")}</button></div></div></section>`;
    const c = P.inboxDetail;
    return `${head(L("Developer inbox", "Entwickler-Postfach") + " — " + esc(P.user), L("Verified test cases from ITSG for your next release: the scenario to enter, the formula with its variables, the expected value, and how the AI and the examiner got there.", "Verifizierte Testfälle von ITSG für Ihr nächstes Release: das Szenario, die Formel mit ihren Variablen, der Erwartungswert und wie KI und Prüfer dorthin gekommen sind."), `<button class="btn" data-act="pipeRefreshInbox">↻ ${L("Refresh", "Aktualisieren")}</button>`)}
      <div class="split"><section class="panel"><div class="panel-body flush">${P.inbox.length ? P.inbox.map(t => `<button class="list-item" data-act="pipeOpenInbox" data-id="${esc(t.id)}" aria-selected="${t.id === P.selInbox}"><span class="mono muted" style="font-size:11px">${esc(t.id)} · ${esc((t.sent_at || "").replace("T", " "))}</span><b style="font-size:var(--fs-sm)">${esc(t.title)}</b><div class="row" style="gap:4px">${!P.seenInbox.includes(t.id) ? pill(L("new", "neu"), "accent") : ""}${pill("§" + esc(t.section), "mono")}${t.formula_changed ? `<span class="flag-formula">ƒ ${L("formula updated", "Formel neu")}</span>` : ""}${t.my_ack ? pill("✓ " + esc(t.my_ack.state), "ok") : ""}</div></button>`).join("") : `<div class="empty">${L("Nothing yet. ITSG sends verified test cases here.", "Noch nichts. ITSG sendet verifizierte Testfälle hierher.")}</div>`}</div></section>
      <div class="stack">${c ? `<section class="panel"><div class="panel-head"><div class="stack" style="gap:2px"><span class="eyebrow">${esc(c.id)} · §${esc(c.section)} ${esc(c.section_title)} · ${esc(c.document.name)}</span><h3>${esc(c.title)}</h3></div><div class="row">${pill(esc(c.kind), "")}${c.package ? pill(esc(c.package), "mono") : ""}</div></div>
        <div class="panel-body"><div class="callout accent"><b>${L("Criterion", "Kriterium")}</b>${esc(c.criterion)}</div>${tcSheet(c)}
        ${c.formula_changed ? `<div class="callout warn"><b>ƒ ${L("This calculation changed with the new specification", "Diese Berechnung hat sich mit der neuen Spezifikation geändert")}</b>${c.previous_expression ? `<span>${L("Before", "Vorher")}: <span class="formula-old">${esc(c.previous_expression)}</span></span>` : ""}</div>` : ""}
        <div class="formula-box ${c.formula_changed ? "changed" : ""}"><span class="field-label">${L("Formula", "Formel")} → <b class="mono">${esc((c.formula || {}).result_name || "")}</b></span><div class="formula-view">${formulaView((c.formula || {}).expression, P.devVars)}</div>
          <div id="devVars">${varTable(P.devVars, true)}</div><span class="muted" style="font-size:var(--fs-xs)">${L("Try other values to understand the rule — this does not change the test case.", "Andere Werte ausprobieren, um die Regel zu verstehen — der Testfall bleibt unverändert.")}</span>
          <div id="devPreview">${previewHtml(P.devPreview, null)}</div>
          <div class="row"><span class="field-label">${L("Expected value in the test case", "Erwartungswert im Testfall")}:</span><b class="mono">${esc(c.expected_value)}</b></div></div>
        <div class="kv"><dt>${L("Expected outcome", "Erwartetes Verhalten")}</dt><dd>${esc(c.expected_outcome || "")}</dd><dt>${L("Verified by", "Verifiziert von")}</dt><dd>${esc(c.verified_by || "—")} · ${esc(c.verified_at || "")}</dd></div>
        <span class="field-label">${L("Scenario", "Szenario")}</span><pre class="json">${esc(JSON.stringify(c.scenario, null, 2))}</pre>
        ${(c.quotes || []).map(q => `<div class="de-quote" style="font-size:var(--fs-sm)">„${esc(q)}“</div>`).join("")}
        <label class="stack"><span class="field-label">${L("Comment for ITSG (optional)", "Kommentar an ITSG (optional)")}</span><input class="input" id="devComment" value="${esc((c.acks || []).find(a => a.who === P.user) ? (c.acks.find(a => a.who === P.user).comment || "") : "")}"></label>
        <div class="row between"><div class="row"><button class="btn ok primary" data-act="pipeAck" data-state="accepted">✓ ${L("Accept", "Annehmen")}</button><button class="btn" data-act="pipeAck" data-state="question">? ${L("Ask a question", "Rückfrage")}</button></div><div class="row"><button class="btn ghost sm" data-act="pipeExport" data-id="${esc(c.id)}">${ic("download")} JSON</button>${c.package ? `<button class="btn ghost sm" data-act="pipeExportPkg" data-id="${esc(c.package)}">${ic("download")} ${L("Package", "Paket")}</button>` : ""}</div></div></div></section>
        <section class="panel"><div class="panel-head"><h4>${L("Spec change", "Spezifikationsänderung")}</h4></div><div class="panel-body"><b>${esc((c.spec_change || {}).summary || "")}</b><details class="cot-more"><summary class="muted">JSON</summary><pre class="json">${esc(JSON.stringify(c.spec_change, null, 2))}</pre></details></div></section>
        <section class="panel"><div class="panel-head"><h4>${L("Chain of thought", "Gedankengang")}</h4><span class="muted" style="font-size:var(--fs-xs)">${(c.cot || []).length} ${L("steps", "Schritte")}</span></div><div class="panel-body"><details class="cot-more"><summary>${L("Show how the AI derived this test case", "Zeigen, wie die KI diesen Testfall hergeleitet hat")}</summary><div class="cot" style="margin-top:10px">${(c.cot || []).map(evHtml).join("")}</div></details></div></section>
        <section class="panel"><div class="panel-head"><h4>${L("History", "Verlauf")}</h4></div><div class="panel-body flush">${(c.history || []).slice().reverse().map(h => `<div class="log-item"><span class="log-time">${esc((h.t || "").slice(5, 16).replace("T", " "))}</span><span>${h.who && h.who.startsWith("AI") ? "AI" : "👤"}</span><div><b>${esc(h.action)}</b> · ${esc(h.who)}<div class="muted">${esc(h.detail || "")}</div></div></div>`).join("")}</div></section>`
      : `<section class="panel"><div class="empty">${L("Select a test case.", "Testfall auswählen.")}</div></section>`}</div></div>`;
  }
  let devTimer = null;
  function scheduleDevEval() {
    clearTimeout(devTimer);
    devTimer = setTimeout(async () => {
      const c = P.inboxDetail; if (!c) return;
      try { P.devPreview = await api("/api/evaluate", { body: { expression: (c.formula || {}).expression, variables: P.devVars } }); } catch (e) { P.devPreview = { ok: false, error: e.message }; }
      const el = document.getElementById("devPreview"); if (el) el.innerHTML = previewHtml(P.devPreview, null);
    }, 250);
  }
  async function exportJson(path, name) {
    try { const j = await api(path); A.downloadOrCopy(name, JSON.stringify(j, null, 2), "application/json"); } catch (e) { A.toast(e.message); }
  }

  /* ---------- spec-change review: the examiner approves, edits or declines what the AI extracted ---------- */
  const CT = () => ({
    parameter: [L("A limit or number changed", "Grenzwert oder Zahl geändert"), "warn"],
    condition: [L("A condition changed", "Eine Bedingung hat sich geändert"), "warn"],
    formula: [L("A calculation changed", "Eine Berechnung hat sich geändert"), "bad"],
    new_rule: [L("New rule", "Neue Regel"), "accent"],
    removed_rule: [L("Rule removed", "Regel entfallen"), "bad"],
    format: [L("Data format changed", "Datenformat geändert"), "info"],
    clarification: [L("Clarification", "Klarstellung"), "info"],
    editorial: [L("Wording only — nothing to test", "Nur redaktionell — nichts zu testen"), ""]
  });
  const ctPill = t => { const [label, cls] = CT()[t] || [t || "?", ""]; return pill(esc(label), cls); };
  const human = n => { const s = String(n || "").replace(/_/g, " ").trim(); return s ? s[0].toUpperCase() + s.slice(1) : ""; };
  const reviewItems = () => (P.run ? P.run.items : []).filter(i => i.spec_change || (i.status === "running" || i.status === "queued"));
  const waiting = () => (P.run ? P.run.items : []).filter(i => i.status === "review" && !i.decision);
  const approvedReady = () => (P.run ? P.run.items : []).filter(i => i.status === "review" && i.decision === "approved");
  const chState = i => i.status === "done" ? "done" : (i.status === "queued" || i.status === "running") ? "busy" : i.decision || "waiting";
  const chStatePill = i => ({
    done: i.cases.length ? pill(`✓ ${L("test cases created", "Testfälle erstellt")} (${i.cases.length})`, "info") : pill("✓ " + L("nothing to test", "nichts zu testen"), ""),
    busy: pill(i.phase === "cases" ? "◐ " + L("AI is writing test cases…", "KI schreibt Testfälle…") : "◐ " + L("AI is reading the section…", "KI liest den Abschnitt…"), "info"),
    approved: pill("✓ " + L("approved", "freigegeben"), "ok"),
    declined: pill("✕ " + L("declined", "abgelehnt"), "bad"),
    waiting: pill(L("waiting for you", "wartet auf Sie"), "warn")
  })[chState(i)];

  function vChanges() {
    if (P.online === false) return `${head(L("Review changes", "Änderungen prüfen"), "")}${docsInner()}`;
    const intro = L("Before any test case is written, check what the AI understood. Each card is one change it found in the specification. Approve what is right, fix what is almost right, decline what is wrong — then let the AI write test cases for the approved changes.",
      "Bevor Testfälle entstehen, prüfen Sie, was die KI verstanden hat. Jede Karte ist eine Änderung, die sie in der Spezifikation gefunden hat. Richtiges freigeben, fast Richtiges korrigieren, Falsches ablehnen — dann schreibt die KI Testfälle für die freigegebenen Änderungen.");
    if (!P.runId || !P.run) return `${head(L("Review changes", "Änderungen prüfen"), intro, `<button class="btn primary" data-act="go" data-screen="ingest">${ic("upload")} ${L("Go to the PDF drop", "Zur PDF-Ablage")}</button>`)}<div class="empty">${P.runId ? L("Loading…", "Lade…") : L("No run yet. Drop a PDF and press “Generate test cases”.", "Noch kein Lauf. PDF ablegen und „Testfälle erzeugen“ drücken.")}</div>`;
    const all = reviewItems();
    const f = P.chFilter;
    const shown = all.filter(i => f === "all" || chState(i) === f);
    const count = s => all.filter(i => chState(i) === s).length;
    const selectable = shown.filter(i => i.status === "review");
    const sel = selectable.filter(i => P.chSel.has(i.sec));
    const allSel = selectable.length > 0 && sel.length === selectable.length;
    const nApproved = approvedReady().length;
    const pending = (P.run.items || []).filter(i => !i.spec_change && ["error", "stopped"].includes(i.status));
    return `${head(L("Review changes", "Änderungen prüfen"), intro,
      `<button class="btn" data-act="go" data-screen="pipeline">${ic("ai")} ${L("AI pipeline", "KI-Pipeline")}</button><button class="btn primary" data-act="chCreate" ${nApproved && !P.chEdit ? "" : "disabled"} title="${esc(L("The AI writes test cases for every approved change", "Die KI schreibt Testfälle für jede freigegebene Änderung"))}">${ic("test")} ${L("Create test cases", "Testfälle erstellen")}${nApproved ? ` (${nApproved})` : ""}</button>`)}
      <div class="chg-bar" role="toolbar" aria-label="${esc(L("Bulk actions", "Sammelaktionen"))}">
        <div class="row"><label class="row" style="gap:8px;font-weight:600"><input type="checkbox" id="chSelAll" ${allSel ? "checked" : ""} ${selectable.length ? "" : "disabled"} style="width:18px;height:18px;accent-color:var(--accent)"> ${L("Select all", "Alle auswählen")}</label>
          <span class="muted" style="font-size:var(--fs-sm)">${sel.length ? `${sel.length} ${L("selected", "ausgewählt")}` : L("tick cards to act on several at once", "Karten anhaken, um mehrere auf einmal zu bearbeiten")}</span></div>
        <div class="row"><button class="btn ok" data-act="chBulk" data-d="approved" ${sel.length ? "" : "disabled"}>✓ ${L("Approve selected", "Auswahl freigeben")}</button><button class="btn bad" data-act="chBulk" data-d="declined" ${sel.length ? "" : "disabled"}>✕ ${L("Decline selected", "Auswahl ablehnen")}</button><button class="btn ghost" data-act="chBulk" data-d="" ${sel.length ? "" : "disabled"}>↺ ${L("Undo decision", "Entscheidung zurücknehmen")}</button></div>
      </div>
      <div class="tabs" role="tablist">${[["all", L("All", "Alle"), all.length], ["waiting", L("Waiting for you", "Wartet auf Sie"), count("waiting")], ["approved", L("Approved", "Freigegeben"), count("approved")], ["declined", L("Declined", "Abgelehnt"), count("declined")], ["done", L("Test cases created", "Testfälle erstellt"), count("done")]].map(([k, t, n]) => `<button class="tab" role="tab" aria-selected="${f === k}" data-act="chFilter" data-f="${k}">${t} <span class="muted">${n}</span></button>`).join("")}</div>
      <div class="chg-list">${shown.length ? shown.map(chCard).join("") : `<div class="empty">${all.length ? L("Nothing in this filter.", "Nichts in diesem Filter.") : P.run.status === "running" ? L("The AI is reading the sections. Changes appear here as soon as they are extracted.", "Die KI liest die Abschnitte. Änderungen erscheinen hier, sobald sie extrahiert sind.") : L("No changes were extracted in this run.", "In diesem Lauf wurden keine Änderungen extrahiert.")}</div>`}
        ${pending.length && f === "all" ? pending.map(i => `<div class="chg-pending">✕ <div style="flex:1"><b>§${esc(i.sec)} ${esc(i.title)}</b><br>${L("The AI could not extract a change for this section.", "Die KI konnte für diesen Abschnitt keine Änderung extrahieren.")}</div><button class="btn sm" data-act="pipeGen" data-sec="${esc(i.sec)}">↻ ${L("Try again", "Erneut versuchen")}</button></div>`).join("") : ""}</div>`;
  }

  function chCard(i) {
    const st = chState(i), sc = i.spec_change || {};
    if (st === "busy" && !i.spec_change) return `<div class="chg-pending"><span class="st running">◐</span><div><b>§${esc(i.sec)} ${esc(i.title)}</b><br>${L("The AI is reading this section…", "Die KI liest diesen Abschnitt…")}</div></div>`;
    if (P.chEdit === i.sec) return chEditCard(i);
    const params = (sc.parameters || []).filter(p => p && p.name);
    const checks = sc.quote_checks || [];
    const bad = checks.filter(q => !q.ok).length;
    const selected = P.chSel.has(i.sec) && i.status === "review";
    return `<article class="chg-card ${st} ${selected ? "selected" : ""}" data-sec="${esc(i.sec)}">
      <div class="chg-head">${i.status === "review" ? `<input type="checkbox" data-chsel="${esc(i.sec)}" ${selected ? "checked" : ""} aria-label="${esc(L("Select", "Auswählen") + " §" + i.sec)}">` : "<span></span>"}
        <div style="min-width:0"><span class="eyebrow">§${esc(i.sec)} · ${L("page", "Seite")} ${esc(i.page)}${i.change_edited ? " · " + L("edited by you", "von Ihnen bearbeitet") : ""}</span><h3>${esc(i.title)}</h3></div>
        <div>${chStatePill(i)}</div></div>
      <div class="row" style="gap:6px">${ctPill(sc.change_type)}${sc.formula_changed ? `<span class="flag-formula">ƒ ${L("the calculation changes", "die Berechnung ändert sich")}</span>` : ""}${kindPill(i.kind)}</div>
      ${sc.summary ? `<p class="chg-summary">${esc(sc.summary)}</p>` : ""}
      ${sc.old_rule ? `<div class="chg-rules"><div class="chg-rule before"><span class="field-label">${L("Before", "Vorher")}</span><div>${esc(sc.old_rule)}</div></div><div class="chg-arrow" aria-hidden="true">→</div><div class="chg-rule after"><span class="field-label">${L("Now", "Jetzt")}</span><div>${esc(sc.new_rule || "")}</div></div></div>`
        : sc.new_rule ? `<div class="chg-rules"><div class="chg-rule only"><span class="field-label">${L("The rule", "Die Regel")}</span><div>${esc(sc.new_rule)}</div></div></div>` : ""}
      ${params.length ? `<div class="stack" style="gap:6px"><span class="field-label">${L("Numbers and limits", "Zahlen und Grenzwerte")}</span><div class="chg-params">${params.map(p => `<div class="chg-param"><b>${esc(human(p.name))}</b><span class="val">${p.old_value ? `<span class="old">${esc(p.old_value)}</span><span class="muted">→</span>` : ""}<span class="new">${esc(p.new_value || "—")}${p.unit ? " " + esc(p.unit) : ""}</span></span>${p.quote ? `<span class="q">„${esc(p.quote)}“</span>` : ""}</div>`).join("")}</div></div>` : ""}
      ${checks.length ? `<details class="cot-more" ${bad ? "open" : ""}><summary><b>${L("Evidence from the specification", "Belege aus der Spezifikation")}</b> <span class="muted">· ${checks.length - bad}/${checks.length} ${L("found word for word", "wörtlich gefunden")}</span>${bad ? " " + pill(`${bad} ${L("not found — check", "nicht gefunden — prüfen")}`, "bad") : ""}</summary><div class="stack" style="gap:6px;margin-top:8px">${checks.map(q => `<div class="chg-quote"><span class="pill ${q.ok ? "ok" : "bad"}" title="${esc(q.ok ? L("found word for word in the spec", "wörtlich in der Spezifikation gefunden") : L("not found in the spec — the AI may have paraphrased", "nicht in der Spezifikation gefunden — die KI hat evtl. umformuliert"))}">${q.ok ? "✓" : "?"} ${q.side === "old" ? L("old text", "alter Text") : L("new text", "neuer Text")}</span><span class="de-quote">„${esc(q.quote)}“</span></div>`).join("")}</div></details>` : ""}
      <div class="chg-actions"><div class="row">${i.status === "review"
          ? (i.decision ? `<button class="btn ghost" data-act="chDecide" data-sec="${esc(i.sec)}" data-d="">↺ ${L("Undo", "Zurücknehmen")}</button>` : `<button class="btn ok primary" data-act="chDecide" data-sec="${esc(i.sec)}" data-d="approved">✓ ${L("Approve", "Freigeben")}</button>`)
            + `<button class="btn" data-act="chEdit" data-sec="${esc(i.sec)}">✎ ${L("Edit", "Bearbeiten")}</button>`
            + (i.decision === "declined" ? "" : `<button class="btn bad" data-act="chDecide" data-sec="${esc(i.sec)}" data-d="declined">✕ ${L("Decline", "Ablehnen")}</button>`)
          : i.status === "done" ? `<button class="btn" data-act="go" data-screen="review">${ic("check")} ${L("Open the test cases", "Testfälle öffnen")}</button>` : ""}</div>
        <details class="cot-more"><summary class="muted" style="font-size:var(--fs-xs)">${L("raw data (JSON)", "Rohdaten (JSON)")}</summary><pre class="json" style="margin-top:6px">${esc(JSON.stringify(Object.fromEntries(Object.entries(sc).filter(([k]) => !["quote_checks", "section", "title", "page", "detected_as", "source", "document", "previous_document"].includes(k))), null, 2))}</pre></details></div>
    </article>`;
  }

  function chEditCard(i) {
    const d = P.chDraft;
    const prow = (p, n) => `<div class="prow"><input class="input" data-cp="${n}" data-k="name" value="${esc(p.name || "")}" placeholder="${esc(L("e.g. gap months", "z. B. Abstand Monate"))}" aria-label="${esc(L("Name", "Name"))}"><input class="input" data-cp="${n}" data-k="old_value" value="${esc(p.old_value || "")}" placeholder="${esc(L("before", "vorher"))}" aria-label="${esc(L("Before", "Vorher"))}"><input class="input" data-cp="${n}" data-k="new_value" value="${esc(p.new_value || "")}" placeholder="${esc(L("now", "jetzt"))}" aria-label="${esc(L("Now", "Jetzt"))}"><input class="input" data-cp="${n}" data-k="unit" value="${esc(p.unit || "")}" placeholder="${esc(L("unit", "Einheit"))}" aria-label="${esc(L("Unit", "Einheit"))}"><button class="btn ghost sm" data-act="chDelParam" data-n="${n}" title="${esc(L("Remove", "Entfernen"))}">✕</button></div>`;
    return `<article class="chg-card selected" data-sec="${esc(i.sec)}">
      <div class="chg-head"><span></span><div style="min-width:0"><span class="eyebrow">§${esc(i.sec)} · ${L("editing", "bearbeiten")}</span><h3>${esc(i.title)}</h3></div><div>${pill("✎ " + L("editing", "Bearbeitung"), "info")}</div></div>
      <div class="chg-edit">
        <label class="stack" style="gap:4px"><span class="field-label">${L("What kind of change is it?", "Welche Art von Änderung?")}</span><select class="select" id="chType">${Object.entries(CT()).map(([k, [label]]) => `<option value="${k}" ${d.change_type === k ? "selected" : ""}>${esc(label)}</option>`).join("")}</select></label>
        <label class="stack" style="gap:4px"><span class="field-label">${L("In one or two sentences", "In ein, zwei Sätzen")}</span><textarea class="textarea" id="chSummary">${esc(d.summary || "")}</textarea></label>
        <div class="grid-2"><label class="stack" style="gap:4px"><span class="field-label">${L("The rule before", "Die Regel vorher")}</span><textarea class="textarea" id="chOld">${esc(d.old_rule || "")}</textarea></label>
          <label class="stack" style="gap:4px"><span class="field-label">${L("The rule now", "Die Regel jetzt")}</span><textarea class="textarea" id="chNew">${esc(d.new_rule || "")}</textarea></label></div>
        <div class="stack" style="gap:6px"><span class="field-label">${L("Numbers and limits", "Zahlen und Grenzwerte")}</span>
          <div class="prow headrow"><span>${L("Name", "Name")}</span><span>${L("Before", "Vorher")}</span><span>${L("Now", "Jetzt")}</span><span>${L("Unit", "Einheit")}</span><span></span></div>
          <div id="chParams" class="stack" style="gap:6px">${d.parameters.map(prow).join("")}</div>
